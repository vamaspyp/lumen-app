<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMEN · Living Field · Deep Prototype</title><style>:root{--ink:#f3efe6;--mut:#9ca9a0;--line:rgba(242,239,230,.12);--soft:rgba(255,255,255,.045);--sage:#9db59f;--gold:#d7bd8c;--blue:#91abc1}*{box-sizing:border-box}body{margin:0;background:#09130f;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.world{min-height:100vh;background:radial-gradient(circle at 76% 16%,rgba(220,184,119,.11),transparent 28%),radial-gradient(circle at 14% 55%,rgba(111,161,126,.13),transparent 34%),linear-gradient(145deg,#08110d,#102019 58%,#13241d);transition:.7s ease}.top{position:fixed;z-index:8;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:20px 26px;background:linear-gradient(#09130fe8,transparent)}.brand{font-size:.65rem;letter-spacing:.22em;color:#809287}.tools{display:flex;gap:8px}.btn,.chip{border:1px solid var(--line);background:rgba(255,255,255,.04);color:#dce2dc;border-radius:999px;padding:10px 14px;font:inherit;cursor:pointer}.btn:hover,.chip:hover,.card:hover{background:rgba(255,255,255,.075)}.primary{background:#eee7da;color:#1c2922;font-weight:700}.stage{min-height:100vh;padding:96px 6vw 70px;display:grid;place-items:center}.scene{width:min(1120px,100%);animation:in .45s ease}.hero{display:grid;grid-template-columns:1.08fr .72fr;gap:7vw;align-items:center}.eyebrow{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:#82968a}.hero h1,.scene>h1{font:400 clamp(3rem,6vw,6rem)/.96 Georgia,serif;letter-spacing:-.045em;margin:14px 0 20px}.lead{max-width:720px;color:var(--mut);line-height:1.72;font-size:1.04rem}.orbwrap{min-height:390px;display:grid;place-items:center}.orb{width:160px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 27%,#fafcf6 0 3%,#c9ddc9 14%,#84aa8d 43%,#34563f 70%,#142b1d);box-shadow:0 0 145px rgba(117,174,130,.23);animation:breathe 8s ease-in-out infinite}.orb.small{width:46px;box-shadow:0 0 55px rgba(117,174,130,.22)}textarea,input{width:100%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.045);color:#eef1eb;border-radius:20px;padding:17px;font:inherit;outline:none}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:28px}.grid.two{grid-template-columns:repeat(2,1fr)}.card{border:1px solid var(--line);background:var(--soft);border-radius:27px;padding:22px;min-height:150px;cursor:pointer;transition:.25s}.card h2,.card h3{font:400 1.42rem Georgia,serif;margin:7px 0 9px}.card p{color:#93a198;line-height:1.55;margin:0}.card small{color:#72867a;letter-spacing:.1em}.thread{margin:30px 0 0;padding-left:20px;border-left:1px solid var(--line);display:grid;gap:17px}.thread .item{max-width:760px}.thread strong{font:400 1.2rem Georgia,serif}.thread p{color:#93a198;line-height:1.6}.resource{display:grid;grid-template-columns:1fr .8fr;gap:6vw;align-items:start}.viewer{border:1px solid var(--line);border-radius:34px;padding:30px;background:rgba(255,255,255,.035);min-height:430px}.viewer h2{font:400 2.1rem Georgia,serif}.meta{font-size:.76rem;color:#7f9187}.audio{height:190px;display:grid;place-items:center}.wave{display:flex;gap:5px;align-items:center;height:70px}.wave i{display:block;width:3px;border-radius:4px;background:#a9bea9;animation:w 2.2s ease-in-out infinite}.wave i:nth-child(2n){animation-delay:.3s}.wave i:nth-child(3n){animation-delay:.7s}.video{aspect-ratio:16/9;border-radius:24px;background:radial-gradient(circle at 50% 45%,rgba(213,188,141,.2),transparent 25%),linear-gradient(145deg,#182820,#0c1511);display:grid;place-items:center}.play{width:72px;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:1.5rem}.practice{display:grid;place-items:center;text-align:center;min-height:310px}.practice .breath{width:110px;aspect-ratio:1;border:1px solid #7f9d86;border-radius:50%;animation:breathe 7s ease-in-out infinite}.circle{border-radius:50%;width:min(420px,80vw);aspect-ratio:1;margin:auto;position:relative;border:1px solid var(--line)}.person{position:absolute;width:74px;aspect-ratio:1;border-radius:50%;background:rgba(145,171,193,.12);border:1px solid rgba(145,171,193,.25);display:grid;place-items:center;font-size:.72rem;color:#aab8c2}.person:nth-child(1){top:-18px;left:42%}.person:nth-child(2){right:-18px;top:38%}.person:nth-child(3){bottom:-18px;left:42%}.person:nth-child(4){left:-18px;top:38%}.center{position:absolute;inset:38%;display:grid;place-items:center;text-align:center;color:#82958a;font:italic .9rem Georgia,serif}.lumi{position:fixed;z-index:9;right:22px;bottom:20px;display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#102019dc;backdrop-filter:blur(12px);border-radius:999px;padding:8px 12px;color:#a9b6ae;cursor:pointer}.panel{position:fixed;z-index:12;right:20px;bottom:78px;width:min(390px,calc(100vw - 40px));padding:22px;border:1px solid var(--line);border-radius:26px;background:#102019f5;box-shadow:0 20px 70px #0008;display:none}.panel.show{display:block}.panel h3{font:400 1.5rem Georgia,serif;margin:0 0 8px}.panel p{color:#98a69d;line-height:1.55}.quiet{opacity:.66}.note{font:italic 1rem Georgia,serif;color:#7f9187;margin-top:25px}.sep{height:1px;background:var(--line);margin:24px 0}@keyframes breathe{50%{transform:scale(1.06);filter:brightness(1.08)}}@keyframes w{0%,100%{height:12px}50%{height:58px}}@keyframes in{from{opacity:0;transform:translateY(8px)}}@media(max-width:820px){.hero,.resource{grid-template-columns:1fr}.orbwrap{min-height:240px;order:-1}.grid,.grid.two{grid-template-columns:1fr}.stage{padding-inline:22px}.top{padding:16px}.hero h1,.scene>h1{font-size:3.25rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}</style></head><body><div class="world" id="world"><header class="top"><div class="brand">LUMEN · PRESENCIA</div><div class="tools"><button class="btn" onclick="explore()">Explorar</button><button class="btn quiet" onclick="home()">Salir</button></div></header><main class="stage" id="root"></main><button class="lumi" onclick="toggleLumi()"><span class="orb small"></span><span>LUMI · disponible</span></button><aside class="panel" id="lpanel"><h3>Estoy acá.</h3><p>No necesitás salir de donde estás para hablar conmigo. Puedo ayudarte a mirar esto, buscar otra posibilidad o simplemente dejarte seguir.</p><textarea placeholder="Decime lo que necesites..."></textarea><div class="row"><button class="btn primary" onclick="moment()">Conversar</button><button class="btn" onclick="toggleLumi()">Seguir por mi cuenta</button></div></aside></div><script>const R=document.querySelector('#root'),W=document.querySelector('#world'),P=document.querySelector('#lpanel');function set(x){R.innerHTML=x;P.classList.remove('show');W.className='world'}function toggleLumi(){P.classList.toggle('show')}function home(){set(`<section class="scene hero"><div><div class="eyebrow">Estoy acá</div><h1>¿Qué está vivo ahora?</h1><p class="lead">Podés contarme algo, quedarte un momento o entrar a recorrer LUMEN por tu cuenta. La relación no cambia porque cambie lo que hacés.</p><textarea placeholder="Podés empezar por donde quieras..."></textarea><div class="row"><button class="btn primary" onclick="moment()">Compartir</button><button class="btn" onclick="explore()">Quiero explorar</button></div><p class="note">La forma cambia. La relación permanece.</p></div><div class="orbwrap"><div class="orb"></div></div></section>`)}function moment(){set(`<section class="scene hero"><div><div class="eyebrow">Acompañamiento</div><h1>Podemos mirar esto juntos.</h1><p class="lead">LUMI refleja sin apropiarse, aclara sólo si cambia materialmente la ayuda y acerca una posibilidad con humildad. En cualquier momento podés corregir, explorar, callar o irte.</p><div class="row"><button class="btn primary" onclick="resource('practice')">Probar algo breve</button><button class="btn" onclick="source()">Ver otras posibilidades</button><button class="btn" onclick="territory()">Recordar algo mío</button><button class="btn quiet" onclick="home()">Con esto alcanza</button></div></div><div class="orbwrap"><div class="orb"></div></div></section>`)}function explore(){set(`<section class="scene"><div class="eyebrow">Movimiento libre</div><h1>Podés andar sin pedir permiso.</h1><p class="lead">Tres territorios alcanzables y una posibilidad de deambular. No son módulos: el mismo Field cambia de densidad y deja que el centro sea aquello que elegiste recorrer.</p><div class="grid two"><article class="card" onclick="source()"><small>FUENTE</small><h2>Explorar posibilidades</h2><p>Reservorio vivo: sabiduría, prácticas, obras, audio, video, lugares, experiencias, personas y ayuda real.</p></article><article class="card" onclick="territory()"><small>TERRITORIO PROPIO</small><h2>Recorrer lo mío</h2><p>Faros, Caminos, Santuario, Repertorio, hitos y relaciones elegidas, sin dashboard de productividad.</p></article><article class="card" onclick="tissue()"><small>TEJIDO</small><h2>Acercarme a otras vidas</h2><p>Personas, círculos, encuentros, pedir, ofrecer y derramar sin feed social ni reputación.</p></article><article class="card" onclick="wander()"><small>CURIOSIDAD</small><h2>Deambular</h2><p>Una apertura cada vez, con diversidad y sin optimizar permanencia.</p></article></div></section>`)}function source(){set(`<section class="scene"><div class="eyebrow">Fuente · reservorio vivo</div><h1>Descubrir con criterio.</h1><p class="lead">No es una biblioteca de tarjetas. Podés buscar algo conocido o seguir relaciones por intención, tiempo, energía, formato, contexto, idioma, accesibilidad y contraste.</p><input placeholder="Buscar una idea, una persona, una práctica, un lugar..."><div class="row"><button class="chip" onclick="resource('reflection')">Otra mirada</button><button class="chip" onclick="resource('practice')">Algo breve</button><button class="chip" onclick="resource('audio')">Para escuchar</button><button class="chip" onclick="resource('video')">Para ver</button><button class="chip" onclick="resource('work')">Profundizar</button><button class="chip" onclick="resource('action')">Llevar a la vida</button></div><div class="grid"><article class="card" onclick="resource('reflection')"><small>PERSPECTIVA</small><h3>Una idea que abre</h3><p>Texto contemplativo con procedencia y otra mirada disponible.</p></article><article class="card" onclick="resource('practice')"><small>PRÁCTICA</small><h3>Dos minutos de espacio</h3><p>Experiencia guiada; LUMI baja presencia cuando empieza.</p></article><article class="card" onclick="resource('audio')"><small>AUDIO</small><h3>Caminar y escuchar</h3><p>Continuar fuera de pantalla, con transcripción y control.</p></article><article class="card" onclick="resource('video')"><small>VIDEO</small><h3>Ver a alguien pensar</h3><p>Imagen y voz sólo cuando agregan algo que el texto no lleva.</p></article><article class="card" onclick="resource('work')"><small>OBRA / RECURSO</small><h3>Profundizar en una fuente</h3><p>Procedencia, autoría, acceso y por qué podría ser relevante.</p></article><article class="card" onclick="resource('action')"><small>ACCIÓN REAL</small><h3>Hacer algo afuera</h3><p>Una posibilidad cuyo centro está en la Vida, no en la pantalla.</p></article><article class="card" onclick="tissue()"><small>PERSONA / CÍRCULO</small><h3>Encontrar otra vida</h3><p>Cuando la ayuda correcta es humana, LUMEN deja de ser protagonista.</p></article><article class="card" onclick="resource('place')"><small>LUGAR / EVENTO</small><h3>Ir</h3><p>Contexto, disponibilidad, condiciones y salida al mundo real.</p></article><article class="card" onclick="resource('help')"><small>AYUDA PROFESIONAL / MATERIAL</small><h3>Recibir ayuda concreta</h3><p>Competencia, límites, costo y disponibilidad cuando importan.</p></article></div><div class="row"><button class="btn" onclick="territory()">Relacionar con algo mío</button><button class="btn" onclick="tissue()">Seguir hacia algo humano</button><button class="btn quiet" onclick="explore()">Seguir andando</button></div></section>`)}const data={reflection:['PERSPECTIVA','Una idea que no necesita convencerte','“A veces claridad no es tener una respuesta, sino poder distinguir qué merece una respuesta ahora.”','Origen · ensayo contemporáneo · lectura 3 min'],work:['OBRA / RECURSO','Profundizar sin perder el hilo','Un fragmento, una obra o un recurso externo aparece con contexto suficiente para saber qué es, de dónde viene y por qué podría servirte.','Procedencia · autoría · acceso · 18 min'],action:['ACCIÓN REAL','Cerrar la pantalla puede ser la experiencia','La posibilidad es concreta: llamar a alguien, caminar, ordenar una conversación, pedir ayuda o hacer un gesto en el mundo. LUMEN queda disponible y espera.','Fuera de pantalla · retorno opcional'],place:['LUGAR / EVENTO','Un lugar al que podría valer la pena ir','La expresión incluye qué ocurre allí, cuándo, para quién, condiciones de acceso, costo si existe y por qué apareció para vos.','Presencial · condiciones visibles'],help:['AYUDA PROFESIONAL / MATERIAL','Cuando lo correcto no es introspección','LUMEN muestra ayuda competente o material con procedencia, límites, disponibilidad, costo y alternativas. No convierte un problema real en ejercicio emocional.','Competencia · disponibilidad · límites']};function resource(t){if(t==='audio')return audio();if(t==='video')return video();if(t==='practice')return practice();const d=data[t];set(`<section class="scene resource"><div class="viewer"><div class="eyebrow">${d[0]}</div><h2>${d[1]}</h2><p class="lead">${d[2]}</p><div class="sep"></div><div class="meta">${d[3]}</div><div class="row"><button class="btn primary" onclick="returning()">Vivir / abrir</button><button class="btn" onclick="territory()">Guardar para mí</button><button class="btn quiet" onclick="source()">Otra posibilidad</button></div></div><aside><div class="orbwrap" style="min-height:260px"><div class="orb small"></div></div><p class="lead">LUMI no explica de más. Si querés, puede decir por qué apareció esto, mostrar otra mirada o retirarse.</p><div class="row"><button class="chip" onclick="toggleLumi()">¿Por qué esto?</button><button class="chip" onclick="source()">Algo diferente</button></div></aside></section>`)}function audio(){set(`<section class="scene resource"><div class="viewer"><div class="eyebrow">Audio · 7 min</div><h2>Caminar con una pregunta</h2><p class="lead">Una voz breve abre la experiencia y después deja aire. La pantalla deja de pedir atención.</p><div class="audio"><div class="wave">${'<i></i>'.repeat(17)}</div></div><div class="row"><button class="btn primary" onclick="returning()">▶ Escuchar</button><button class="btn">Transcripción</button><button class="btn quiet" onclick="source()">Salir</button></div><p class="meta">Sin autoplay · velocidad · transcripción · continuar con pantalla bloqueada</p></div><aside><div class="orbwrap" style="min-height:260px"><div class="orb small" style="opacity:.25"></div></div><p class="lead">Mientras escuchás, LUMI pasa a presencia ambiental. El audio es el centro.</p></aside></section>`)}function video(){set(`<section class="scene resource"><div class="viewer"><div class="eyebrow">Video · 11 min</div><h2>Una conversación sobre elegir sin certeza</h2><div class="video"><div class="play">▶</div></div><div class="row"><button class="btn primary" onclick="returning()">Ver</button><button class="btn">Leer transcripción</button><button class="btn quiet" onclick="source()">Salir</button></div><p class="meta">Autor y procedencia visibles · subtítulos · audio descriptivo cuando corresponda</p></div><aside><p class="lead">El video no es decoración. Está acá porque la presencia, el tono y los matices de esta conversación forman parte del valor.</p><div class="row"><button class="chip" onclick="resource('reflection')">Prefiero leer</button><button class="chip" onclick="tissue()">Quiero algo humano</button></div></aside></section>`)}function practice(){set(`<section class="scene resource"><div class="viewer practice"><div><div class="eyebrow">Práctica · 2 min</div><div class="breath" style="margin:28px auto"></div><h2>Dejá que el ritmo baje un poco.</h2><p class="lead">No hay que hacerlo bien. Podés detenerte cuando quieras.</p><div class="row" style="justify-content:center"><button class="btn primary" onclick="returning()">Terminé</button><button class="btn quiet" onclick="home()">Salir</button></div></div></div><aside><div class="orbwrap" style="min-height:250px"><div class="orb small" style="opacity:.12"></div></div><p class="lead">La práctica toma el centro. LUMI se retira casi por completo.</p></aside></section>`)}function returning(){set(`<section class="scene hero"><div><div class="eyebrow">Retorno</div><h1>¿Qué pasó en la vida?</h1><p class="lead">Puede haber ayudado, no haber ayudado, haber pasado otra cosa o no querer decir nada. El retorno no convierte la experiencia en examen.</p><div class="row"><button class="chip" onclick="integrate()">Me ayudó</button><button class="chip" onclick="source()">Quiero variar</button><button class="chip" onclick="integrate()">Pasó algo distinto</button><button class="chip" onclick="home()">No sé / no quiero decir</button></div></div><div class="orbwrap"><div class="orb"></div></div></section>`)}function integrate(){set(`<section class="scene"><div class="eyebrow">Integración</div><h1>Podés llevarte sólo lo que importe.</h1><p class="lead">Guardar no es coleccionar. Hacer propio significa necesitar menos mediación de LUMEN.</p><div class="grid two"><article class="card" onclick="territory()"><small>SANTUARIO</small><h3>Esto importa para mí</h3><p>Guardar con una reflexión propia y control total sobre memoria.</p></article><article class="card" onclick="territory()"><small>REPERTORIO</small><h3>Esto ya sé usarlo</h3><p>Reconocer capacidad propia para repetir, variar o transferir.</p></article><article class="card" onclick="territory()"><small>TRAYECTORIA</small><h3>Esto se relaciona con algo que cuido</h3><p>Vincular a un Faro sin convertirlo en progreso obligatorio.</p></article><article class="card" onclick="home()"><small>SOLTAR</small><h3>Con esto alcanza</h3><p>No conservar nada también es una salida completa.</p></article></div></section>`)}function territory(){set(`<section class="scene"><div class="eyebrow">Territorio propio · mismo Field, más íntimo</div><h1>Lo que elegiste llevar con vos.</h1><p class="lead">No cambia de producto ni de lenguaje perceptual: baja la densidad, aumenta la intimidad. No es historial, dashboard ni archivo. Es una constelación vital que podés recorrer y modificar.</p><div class="grid"><article class="card" onclick="faro()"><small>FARO</small><h3>Una dirección que elegiste cuidar</h3><p>Editable, pausable, redefinible y abandonable.</p></article><article class="card" onclick="camino()"><small>CAMINO</small><h3>Un recorrido posible</h3><p>Sugerido y editable; nunca una secuencia obligatoria.</p></article><article class="card" onclick="sanctuary()"><small>SANTUARIO</small><h3>Lo que importa para mí</h3><p>Recuerdos elegidos, reflexiones y tesoros bajo soberanía.</p></article><article class="card" onclick="repertoire()"><small>REPERTORIO</small><h3>Lo que ya puedo llevar</h3><p>Prácticas, recursos y capacidades que requieren menos LUMEN.</p></article><article class="card" onclick="milestones()"><small>HITOS</small><h3>Cosas que reconocí</h3><p>Hechos o comprensiones, nunca badges ni puntos.</p></article><article class="card" onclick="moment()"><small>AHORA</small><h3>Algo del presente tomó prioridad</h3><p>Un Momento puede interrumpir cualquier continuidad sin romperla.</p></article></div><div class="row"><button class="btn" onclick="source()">Abrir Fuente desde algo mío</button><button class="btn" onclick="tissue()">Abrir hacia otras vidas</button><button class="btn quiet" onclick="explore()">Seguir andando</button></div></section>`)}function faro(){detail('Faro','Vivir con más espacio y menos apuro.','No es objetivo ni KPI. Es una frase humana que podés editar cuando deje de representarte.','Editar · Pausar · Redefinir · Soltar')}function camino(){detail('Camino','Un recorrido que puede cambiar.','Tres posibilidades aparecen como orientación, no como tareas. Podés saltar, cambiar el orden o abandonarlo sin “perder progreso”.','Cambiar · Saltar · Pausar · Abandonar')}function milestones(){detail('Hitos','Cosas que fueron verdad en tu vida.','“Pude poner un límite sin explicarme de más.” “Pedí ayuda antes de estar desbordado.” Son reconocimientos, no recompensas.','Relacionar · Corregir · Ocultar · Soltar')}function detail(k,t,p,a){set(`<section class="scene hero"><div><div class="eyebrow">Territorio · ${k}</div><h1>${t}</h1><p class="lead">${p}</p><div class="row"><button class="chip">${a.split(' · ').join('</button><button class="chip">')}</button><button class="btn quiet" onclick="territory()">Volver al territorio</button></div></div><div class="orbwrap"><div class="orb small"></div></div></section>`)}function sanctuary(){set(`<section class="scene"><div class="eyebrow">Santuario</div><h1>Íntimo por diseño.</h1><p class="lead">Guardar significa “esto importa para mí”. Nada sensible reaparece fuera de contexto. Siempre podés saber por qué algo fue recordado y corregir, ocultar, exportar o borrar.</p><div class="thread"><div class="item"><strong>Una frase que quise conservar</strong><p>“No necesito resolverlo hoy para tratarlo con seriedad.”</p></div><div class="item"><strong>Mi propia reflexión</strong><p>“Me ayuda recordar que bajar el ritmo no es abandonar.”</p></div><div class="item"><strong>Por qué está acá</strong><p>Lo guardaste después de una experiencia el 8 de septiembre. LUMEN puede usarlo para personalizar sólo porque lo autorizaste.</p></div></div><div class="row"><button class="btn">Editar reflexión</button><button class="btn">Cambiar uso de memoria</button><button class="btn">Exportar</button><button class="btn quiet">Borrar</button><button class="btn quiet" onclick="territory()">Volver</button></div></section>`)}function repertoire(){set(`<section class="scene"><div class="eyebrow">Repertorio propio</div><h1>Entonces esto ya no es de LUMEN.</h1><p class="lead">Son cosas que sabés usar, repetir o adaptar por tu cuenta. El éxito es que LUMI tenga cada vez menos que mediar.</p><div class="grid"><article class="card"><small>PRÁCTICA PROPIA</small><h3>Dos minutos antes de responder</h3><p>La usaste en contextos distintos. Podés repetirla sin abrir LUMEN.</p></article><article class="card"><small>RECURSO PROPIO</small><h3>Una pregunta que te ordena</h3><p>“¿Qué parte de esto sí depende de mí?”</p></article><article class="card"><small>VÍNCULO PROPIO</small><h3>Una persona a la que sabés recurrir</h3><p>LUMEN no necesita intermediar ese vínculo.</p></article></div><div class="row"><button class="btn" onclick="source()">Variar algo</button><button class="btn" onclick="tissue()">Compartir si quiero</button><button class="btn quiet" onclick="territory()">Volver</button></div></section>`)}function tissue(){W.classList.add('human');set(`<section class="scene"><div class="eyebrow">Tejido · vida acompañando vida</div><h1>Acercarte sin convertirte en audiencia.</h1><p class="lead">Podés descubrir por propósito, contexto, disponibilidad y límites. Pedir y ofrecer tienen la misma dignidad. No hay seguidores, likes, ranking ni feed infinito.</p><div class="grid"><article class="card" onclick="circle()"><small>CÍRCULO</small><h3>Conversar con pocas personas</h3><p>Propósito, acuerdos, salida y cuidado visibles antes de entrar.</p></article><article class="card" onclick="one()"><small>1:1</small><h3>Hablar con un par</h3><p>Experiencia compartida sin convertir a nadie en experto.</p></article><article class="card" onclick="one()"><small>MENTOR / FACILITADOR</small><h3>Alguien con oficio</h3><p>Rol, competencia, límites, costo y disponibilidad cuando corresponda.</p></article><article class="card" onclick="spill()"><small>OFRECER</small><h3>Derramar algo que ya puedo llevar</h3><p>Contribuir sin reputación, nivel ni obligación de reciprocidad.</p></article><article class="card" onclick="circle()"><small>ENCUENTRO</small><h3>Una actividad compartida</h3><p>Presencial o remota; la actividad toma el centro.</p></article><article class="card" onclick="source()"><small>VOLVER A POSIBILIDADES</small><h3>Seguir por otro camino</h3><p>El Tejido no encierra: podés volver a Fuente o a tu vida.</p></article></div><div class="row"><button class="btn quiet" onclick="explore()">Seguir andando</button></div></section>`)}function circle(){W.classList.add('human');set(`<section class="scene resource"><div><div class="eyebrow">Círculo · 5 personas</div><h1 style="font:400 3.6rem/1 Georgia,serif">Hablar de decisiones que todavía no tienen forma.</h1><p class="lead">Antes de entrar: propósito, confidencialidad, rol de facilitación, límites, cómo salir y cómo reportar. Después LUMEN se retira.</p><div class="row"><button class="btn primary" onclick="circleLive()">Entrar al círculo</button><button class="btn">Ver acuerdos</button><button class="btn quiet" onclick="tissue()">No ahora</button></div></div><div class="circle"><div class="person">Ana</div><div class="person">Leo</div><div class="person">Mara</div><div class="person">Vos</div><div class="center">LUMEN sostiene bordes</div></div></section>`)}function circleLive(){W.classList.add('human');set(`<section class="scene"><div class="eyebrow">Círculo en curso · LUMI P0</div><h1>Ahora el centro son ustedes.</h1><p class="lead">La interfaz se aquieta. Quedan sólo las personas y controles inequívocos de cuidado.</p><div class="circle"><div class="person">Ana</div><div class="person">Leo</div><div class="person">Mara</div><div class="person">Vos</div><div class="center">escuchar · hablar · estar</div></div><div class="row" style="justify-content:center"><button class="btn" onclick="returning()">Terminar y volver</button><button class="btn quiet" onclick="home()">Salir</button><button class="btn quiet">Reportar</button></div></section>`)}function one(){set(`<section class="scene hero"><div><div class="eyebrow">Encuentro 1:1</div><h1>Quizá esto no necesita más LUMEN.</h1><p class="lead">Ves por qué esta persona podría ser pertinente, su rol y sus límites. Si elegís acercarte, LUMI sostiene consentimiento y salida y después desaparece.</p><div class="row"><button class="btn primary" onclick="circleLive()">Acercarme</button><button class="btn quiet" onclick="tissue()">Seguir mirando</button></div></div><div class="orbwrap"><div class="orb small" style="opacity:.16"></div></div></section>`)}function spill(){set(`<section class="scene"><div class="eyebrow">Derramar</div><h1>Ofrecer sin convertirlo en identidad.</h1><p class="lead">Podés compartir una presencia, una experiencia, una práctica, un recurso o ayuda concreta. LUMEN cuida consentimiento y seguridad; no crea niveles de contribuidor.</p><div class="grid two"><article class="card"><small>PRESENCIA</small><h3>Estoy disponible para escuchar</h3><p>Con límites de tiempo y contexto elegidos.</p></article><article class="card"><small>EXPERIENCIA</small><h3>Algo que aprendí viviendo</h3><p>Compartir como experiencia propia, no verdad universal.</p></article><article class="card"><small>RECURSO</small><h3>Algo que me ayudó</h3><p>Con procedencia y sin convertir recomendación en promoción.</p></article><article class="card"><small>AYUDA CONCRETA</small><h3>Puedo ofrecer esto</h3><p>Capacidad, alcance, disponibilidad y límites explícitos.</p></article></div><div class="row"><button class="btn quiet" onclick="tissue()">Volver al Tejido</button></div></section>`)}function wander(){set(`<section class="scene hero"><div><div class="eyebrow">Deambular</div><h1>No hace falta buscar.</h1><p class="lead">LUMEN abre una sola posibilidad y deja aire. Si no resuena, puede aparecer otra suficientemente distinta. No hay scroll infinito ni urgencia.</p><div class="row"><button class="btn primary" onclick="resource('reflection')">Seguir esto</button><button class="btn" onclick="source()">Otra cosa</button><button class="btn quiet" onclick="home()">Seguir mi día</button></div></div><div class="orbwrap"><div class="orb"></div></div></section>`)}home();</script></body></html>
