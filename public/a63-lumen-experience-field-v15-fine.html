<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMEN · Field V1.5</title><style>:root{--fg:#f4f1e9;--mut:#9aaba1;--line:rgba(240,245,237,.12);--soft:rgba(255,255,255,.045)}*{box-sizing:border-box}body{margin:0;color:var(--fg);font-family:Inter,system-ui,sans-serif;background:#08120e}.world{min-height:100vh;padding:24px;background:radial-gradient(circle at 72% 15%,rgba(224,193,139,.11),transparent 26%),radial-gradient(circle at 15% 50%,rgba(113,166,128,.13),transparent 35%),linear-gradient(150deg,#08120e,#112019 56%,#15251e);transition:background 1.1s ease}.top{display:flex;justify-content:space-between;align-items:center}.brand,.k{font-size:.67rem;letter-spacing:.2em;text-transform:uppercase;color:#81958a}.tool,.pill{border:1px solid var(--line);background:var(--soft);color:#dce3de;border-radius:999px;padding:10px 15px}.stage{min-height:88vh;display:grid;place-items:center}.field{width:min(1120px,100%);display:grid;grid-template-columns:1.06fr .74fr;gap:7vw;align-items:center}.copy h1,.space h1{font:400 clamp(3rem,6vw,6.3rem)/.95 Georgia,serif;letter-spacing:-.045em;margin:14px 0 22px}.copy p,.intro{color:var(--mut);line-height:1.75;max-width:720px}.orbspace{min-height:390px;display:grid;place-items:center}.orb{width:158px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 27%,#f8fbf4 0 3%,#c6dcc7 14%,#84aa8c 43%,#34563f 70%,#142b1d);box-shadow:0 0 140px rgba(117,174,130,.22);animation:b 8s ease-in-out infinite}.orb.small{width:74px;opacity:.7;box-shadow:0 0 70px rgba(117,174,130,.16)}@keyframes b{50%{transform:scale(1.045)}}textarea{width:100%;min-height:72px;border:1px solid rgba(255,255,255,.16);background:var(--soft);color:#eef1eb;border-radius:22px;padding:18px;font:inherit}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.main{background:#ece6da;color:#1c2922;font-weight:700}.quiet{opacity:.62}.space{width:min(1080px,100%)}.spacehead{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:start}.space h1{font-size:clamp(2.8rem,5vw,5rem)}.whisper{max-width:280px;color:#778b7f;font:italic 1rem/1.55 Georgia,serif;padding-top:34px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:30px}.card{border:1px solid var(--line);background:var(--soft);border-radius:26px;padding:22px;min-height:158px;text-align:left;color:inherit}.card small{color:#71877a;letter-spacing:.1em}.card h3{font:400 1.4rem Georgia,serif;margin:10px 0}.card p{color:#8fa096;line-height:1.5;font-size:.92rem}.thread{display:flex;gap:10px;overflow:auto;padding:8px 0 5px;margin-top:22px}.thread button{white-space:nowrap}.lumi{display:flex;gap:12px;align-items:center;margin-top:24px;color:#8da096;font-size:.9rem}.dot{width:9px;height:9px;border-radius:50%;background:#8fae96;box-shadow:0 0 20px #8fae96}.fade{animation:f .55s ease}@keyframes f{from{opacity:0;transform:translateY(7px)}}@media(max-width:820px){.field,.spacehead{grid-template-columns:1fr}.orbspace{min-height:220px;order:-1}.cards{grid-template-columns:1fr}.whisper{padding:0}.copy h1{font-size:3.4rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main class="world" id="world"><header class="top"><div class="brand">LUMEN · PRESENCIA</div><button class="tool" onclick="home()">Salir</button></header><div class="stage" id="root"></div></main><script>const r=document.querySelector('#root'),w=document.querySelector('#world');function set(x){r.innerHTML=x;r.firstElementChild?.classList.add('fade')}function tone(t='base'){const b={base:'radial-gradient(circle at 72% 15%,rgba(224,193,139,.11),transparent 26%),radial-gradient(circle at 15% 50%,rgba(113,166,128,.13),transparent 35%),linear-gradient(150deg,#08120e,#112019 56%,#15251e)',source:'radial-gradient(circle at 70% 18%,rgba(199,165,109,.12),transparent 28%),radial-gradient(circle at 16% 50%,rgba(110,155,119,.13),transparent 36%),linear-gradient(150deg,#09130f,#142019 56%,#18261f)',mine:'radial-gradient(circle at 70% 18%,rgba(188,168,201,.09),transparent 28%),radial-gradient(circle at 16% 50%,rgba(112,157,126,.13),transparent 36%),linear-gradient(150deg,#0a130f,#142019 56%,#19251f)',human:'radial-gradient(circle at 70% 18%,rgba(122,153,186,.12),transparent 28%),radial-gradient(circle at 16% 50%,rgba(110,153,124,.1),transparent 36%),linear-gradient(150deg,#091218,#101d1b 56%,#16231f)'};w.style.background=b[t]}function home(){tone();set(`<section class="field"><div class="copy"><div class="k">Estoy acá</div><h1>¿Qué está vivo ahora?</h1><p>Podés contarme algo, quedarte un momento o simplemente moverte. No necesitás elegir una parte de LUMEN.</p><textarea placeholder="Podés empezar por donde quieras..." aria-label="Expresión libre"></textarea><div class="row"><button class="pill main" onclick="moment()">Compartir</button><button class="pill" onclick="explore()">Quiero explorar</button></div></div><div class="orbspace"><div class="orb"></div></div></section>`)}function moment(){tone();set(`<section class="field"><div class="copy"><div class="k">Escuchando</div><h1>Podemos quedarnos un poco acá.</h1><p>No hace falta traducir tu vida a categorías. Si entiendo suficiente, puedo acercarte algo. Si no, te preguntaré sólo lo que realmente cambie la ayuda.</p><div class="row"><button class="pill main" onclick="source(true)">Acercame algo</button><button class="pill" onclick="mine()">Quiero mirar algo mío</button><button class="pill quiet" onclick="home()">Con esto alcanza</button></div><div class="lumi"><span class="dot"></span>LUMI acompaña; no ocupa el centro.</div></div><div class="orbspace"><div class="orb"></div></div></section>`)}function explore(){tone();set(`<section class="space"><div class="spacehead"><div><div class="k">Movimiento libre</div><h1>Podés andar.</h1><p class="intro">Descubrir algo, reencontrar lo tuyo, acercarte a otras vidas o no buscar nada en particular. El lugar no cambia: cambia lo que toma presencia.</p></div><div class="orb small"></div></div><div class="cards"><button class="card" onclick="source()"><small>DESCUBRIR</small><h3>Ver qué hay</h3><p>Posibilidades conectadas por sentido, contexto y curiosidad.</p></button><button class="card" onclick="mine()"><small>LO TUYO</small><h3>Recorrer lo que importa</h3><p>Faros, hilos, recuerdos elegidos y capacidades propias.</p></button><button class="card" onclick="tissue()"><small>OTRAS VIDAS</small><h3>Acercarme</h3><p>Personas, círculos y encuentros sin lógica de red social.</p></button></div><div class="thread"><button class="pill" onclick="wander()">No busco nada · quiero deambular</button><button class="pill quiet" onclick="home()">Volver</button></div></section>`)}function source(fromMoment=false){tone('source');set(`<section class="space"><div class="spacehead"><div><div class="k">Fuente · reservorio vivo</div><h1>${fromMoment?'Quizá algo de esto pueda acompañarte.':'Seguí lo que te dé curiosidad.'}</h1><p class="intro">No es un catálogo. Entrá por una posibilidad y seguí relaciones: otra mirada, algo más breve, más profundo, humano, cercano o contrastante.</p></div><div class="orb small"></div></div><div class="cards"><button class="card" onclick="poss('perspectiva')"><small>PERSPECTIVA · 6 MIN</small><h3>Mirar desde otro lugar</h3><p>Una idea con procedencia que puede ordenar sin cerrar.</p></button><button class="card" onclick="poss('practica')"><small>PRÁCTICA · 4 MIN</small><h3>Volver al cuerpo</h3><p>Una experiencia breve que se hace, no se consume.</p></button><button class="card" onclick="tissue()"><small>HUMANO · DISPONIBLE</small><h3>Hablar con alguien</h3><p>Tal vez la mejor posibilidad no esté dentro de una pantalla.</p></button></div><div class="thread"><button class="pill" onclick="source()">Otra mirada</button><button class="pill" onclick="mine()">Algo relacionado con lo mío</button><button class="pill" onclick="tissue()">Algo humano</button><button class="pill" onclick="wander()">Sorprendeme con criterio</button></div><div class="lumi"><span class="dot"></span>LUMI queda disponible. Si querés, podés preguntarme por qué apareció algo.</div></section>`)}function poss(type){tone('source');set(`<section class="field"><div class="copy"><div class="k">Una posibilidad</div><h1>${type==='practica'?'Cuatro minutos para volver a sentir el piso.':'Una mirada que no necesita convertirse en verdad.'}</h1><p>${type==='practica'?'Podés hacerla acá o salir de la pantalla. Si no encaja, la soltamos.':'Sabés de dónde viene, para qué podría servir y también sus límites. Podés contrastarla antes de llevarla a tu vida.'}</p><div class="row"><button class="pill main" onclick="live()">Vivir esto</button><button class="pill" onclick="source()">Seguir la constelación</button><button class="pill" onclick="mine()">Guardarlo entre lo mío</button><button class="pill quiet" onclick="home()">No es para mí</button></div></div><div class="orbspace"><div class="orb small"></div></div></section>`)}function mine(){tone('mine');set(`<section class="space"><div class="spacehead"><div><div class="k">Tu territorio</div><h1>Lo tuyo sigue acá, sin encerrarte.</h1><p class="intro">No es un dashboard ni una versión congelada de vos. Son cosas que elegiste conservar y que podés retomar, relacionar, corregir, dejar descansar o soltar.</p></div><div class="orb small"></div></div><div class="cards"><button class="card" onclick="faro()"><small>FARO · ACTIVO</small><h3>Vivir con más espacio</h3><p>Una dirección que elegiste cuidar. Puede cambiar.</p></button><button class="card" onclick="own()"><small>REPERTORIO · PROPIO</small><h3>Una práctica que ya es tuya</h3><p>No necesitás que LUMEN te la vuelva a enseñar.</p></button><button class="card" onclick="memory()"><small>SANTUARIO · ELEGIDO</small><h3>Algo que importa</h3><p>Una reflexión que decidiste conservar, no un historial automático.</p></button></div><div class="thread"><button class="pill" onclick="source()">Ver qué se relaciona</button><button class="pill" onclick="tissue()">Abrir hacia otras vidas</button><button class="pill" onclick="moment()">Traer algo al presente</button></div><div class="lumi"><span class="dot"></span>Estoy cerca si querés relacionar algo. También podés recorrerlo sin mí.</div></section>`)}function faro(){tone('mine');set(`<section class="field"><div class="copy"><div class="k">Faro</div><h1>“Vivir con más espacio y menos apuro.”</h1><p>No es una meta ni un KPI. Podés cambiar sus palabras, pausarlo, abandonarlo o ver qué hilos de tu vida siguen conectados con él.</p><div class="row"><button class="pill" onclick="source()">Explorar algo relacionado</button><button class="pill" onclick="moment()">Traerlo al ahora</button><button class="pill quiet" onclick="mine()">Dejarlo descansar</button></div></div><div class="orbspace"><div class="orb small"></div></div></section>`)}function own(){tone('mine');set(`<section class="field"><div class="copy"><div class="k">Algo propio</div><h1>Esto ya no necesita ser de LUMEN.</h1><p>Podés usarlo por tu cuenta, variarlo o compartir lo aprendido. Que necesites menos mediación también es una buena señal.</p><div class="row"><button class="pill main" onclick="live()">Usarlo ahora</button><button class="pill" onclick="tissue()">Derramar algo de esto</button><button class="pill quiet" onclick="mine()">Volver</button></div></div><div class="orbspace"><div class="orb small"></div></div></section>`)}function memory(){tone('mine');set(`<section class="field"><div class="copy"><div class="k">Santuario</div><h1>Lo guardaste porque importaba para vos.</h1><p>Podés recordar por qué está acá, escribir algo nuevo, corregirlo o borrarlo. No necesito convertirlo en perfil para acompañarte.</p><div class="row"><button class="pill">Escribir una reflexión</button><button class="pill">¿Por qué lo recordás?</button><button class="pill quiet" onclick="mine()">Corregir · olvidar · volver</button></div></div><div class="orbspace"><div class="orb small"></div></div></section>`)}function tissue(){tone('human');set(`<section class="space"><div class="spacehead"><div><div class="k">Tejido</div><h1>Acercarte a otra vida también puede ser explorar.</h1><p class="intro">Podés mirar antes de participar. El contexto, propósito, disponibilidad, límites y cuidado importan más que la popularidad.</p></div><div class="orb small" style="opacity:.35"></div></div><div class="cards"><button class="card" onclick="human('circle')"><small>CÍRCULO · 6 PERSONAS</small><h3>Conversar sin tener que rendir</h3><p>Propósito claro, bordes visibles y salida simple.</p></button><button class="card" onclick="human('one')"><small>1:1 · PAR</small><h3>Alguien dispuesto a escuchar</h3><p>Una conversación humana, no una relación de seguidores.</p></button><button class="card" onclick="human('pro')"><small>OFICIO · CONDICIONES VISIBLES</small><h3>Hablar con alguien preparado</h3><p>Cuando experiencia, competencia o ayuda profesional importan.</p></button></div><div class="thread"><button class="pill" onclick="offer()">Quiero ofrecer algo</button><button class="pill" onclick="source()">Seguir explorando</button><button class="pill quiet" onclick="home()">No ahora</button></div><div class="lumi"><span class="dot"></span>Antes del encuentro puedo ayudarte a entender contexto y límites. Después me retiro.</div></section>`)}function human(kind){tone('human');set(`<section class="field"><div class="copy"><div class="k">Vida acompañando Vida</div><h1>${kind==='pro'?'Acá importa saber quién puede ayudarte y bajo qué condiciones.':'Ahora la otra persona toma el centro.'}</h1><p>${kind==='pro'?'Podés ver procedencia, competencia, costo o disponibilidad antes de decidir. LUMEN no vende relevancia.':'LUMEN sostiene sólo los bordes necesarios: consentimiento, salida, cuidado y reporte. No necesita estar en la conversación.'}</p><div class="row"><button class="pill main" onclick="returning()">El encuentro terminó</button><button class="pill quiet" onclick="home()">Salir / reportar</button></div></div><div class="orbspace"><div class="orb small" style="opacity:.08"></div></div></section>`)}function offer(){tone('human');set(`<section class="field"><div class="copy"><div class="k">Derramar</div><h1>Dar también puede ser una forma de integrar.</h1><p>Podés ofrecer presencia, experiencia o algo que te sirvió sin convertirlo en reputación, nivel o estatus. Pedir y ofrecer tienen la misma dignidad.</p><div class="row"><button class="pill main" onclick="human('one')">Ofrecerme para una conversación</button><button class="pill quiet" onclick="tissue()">Volver al Tejido</button></div></div><div class="orbspace"><div class="orb small"></div></div></section>`)}function live(){tone();set(`<section class="field"><div class="copy"><div class="k">Experiencia</div><h1>Ahora puede tocar vivir.</h1><p>LUMEN baja la voz. Podés seguir fuera de pantalla y volver cuando tenga sentido.</p><div class="row"><button class="pill main" onclick="returning()">Volví</button><button class="pill quiet" onclick="home()">Ir a mi vida</button></div></div><div class="orbspace"><div class="orb small" style="opacity:.18"></div></div></section>`)}function returning(){tone();set(`<section class="field"><div class="copy"><div class="k">Retorno</div><h1>¿Qué quedó en la vida?</h1><p>Puede haber ayudado, no haber ayudado, haber pasado otra cosa o no necesitar palabras.</p><div class="row"><button class="pill main" onclick="mine()">Quiero conservar algo</button><button class="pill" onclick="source()">Quiero variar</button><button class="pill" onclick="tissue()">Quiero volver a alguien</button><button class="pill quiet" onclick="home()">Cerrar por ahora</button></div></div><div class="orbspace"><div class="orb"></div></div></section>`)}function wander(){tone();set(`<section class="field"><div class="copy"><div class="k">Deambular</div><h1>No hace falta buscar.</h1><p>Una sola apertura cada vez. Sin feed infinito ni urgencia. Si nada te llama, no pasa nada.</p><div class="row"><button class="pill main" onclick="source()">Quiero seguir algo que apareció</button><button class="pill" onclick="mine()">Me recordó algo mío</button><button class="pill quiet" onclick="home()">Seguir mi día</button></div></div><div class="orbspace"><div class="orb"></div></div></section>`)}home();</script></body></html>
