<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09130f"><title>LUMEN · V17 Intuitive Flow</title><style>
:root{--ink:#f3efe6;--mut:#9caaa1;--line:rgba(242,239,230,.13);--soft:rgba(255,255,255,.045);--sage:#9db59f;--gold:#d7bd8c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09130f;color:var(--ink);font-family:Inter,system-ui,sans-serif}button,textarea{font:inherit}.world{min-height:100vh;background:radial-gradient(circle at 78% 15%,rgba(220,184,119,.10),transparent 26%),radial-gradient(circle at 14% 56%,rgba(111,161,126,.13),transparent 34%),linear-gradient(145deg,#08110d,#102019 58%,#13241d)}.top{position:fixed;z-index:5;inset:0 0 auto;display:flex;justify-content:space-between;padding:18px 24px;background:linear-gradient(#09130fe8,transparent)}.brand{font-size:.64rem;letter-spacing:.22em;color:#829389}.stage{min-height:100vh;padding:94px 6vw 70px;display:grid;place-items:center}.scene{width:min(1080px,100%);animation:enter .4s ease}.hero{display:grid;grid-template-columns:1.08fr .72fr;gap:7vw;align-items:center}.eyebrow{font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:#82968a}.hero h1,.scene>h1{font:400 clamp(3rem,6vw,5.8rem)/.97 Georgia,serif;letter-spacing:-.045em;margin:14px 0 20px}.lead{max-width:760px;color:var(--mut);line-height:1.72;font-size:1.03rem}.orbwrap{min-height:330px;display:grid;place-items:center}.orb{width:154px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 27%,#fafcf6 0 3%,#c9ddc9 14%,#84aa8d 43%,#34563f 70%,#142b1d);box-shadow:0 0 145px rgba(117,174,130,.22);animation:breathe 8s ease-in-out infinite}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:#dce2dc;border-radius:999px;padding:10px 14px;cursor:pointer}.btn:hover,.choice:hover{background:rgba(255,255,255,.075)}.primary{background:#eee7da;color:#1c2922;font-weight:700}.quiet{opacity:.67}textarea{width:100%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.045);color:#eef1eb;border-radius:20px;padding:16px;outline:none}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:28px}.choice{border:1px solid var(--line);background:var(--soft);border-radius:28px;padding:22px;min-height:150px;cursor:pointer}.choice small{color:#788b80;letter-spacing:.08em}.choice h2{font:400 1.5rem Georgia,serif;margin:8px 0}.choice p{color:#94a299;line-height:1.55;margin:0}.thread{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}.thread .choice{min-height:130px}.status{border-left:1px solid rgba(215,189,140,.35);padding:16px 20px;margin:22px 0;color:#bdc8c1;line-height:1.65}.note{font:italic 1rem Georgia,serif;color:#829389;margin-top:22px}.softline{height:1px;background:var(--line);margin:24px 0}.presence{position:fixed;right:20px;bottom:18px;z-index:6;border:1px solid var(--line);background:#102019dc;border-radius:999px;padding:8px 11px;color:#a9b6ae;display:flex;gap:8px;align-items:center;cursor:pointer}.dot{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#edf6ea,#7ca085 45%,#294936)}.panel{position:fixed;right:20px;bottom:66px;z-index:7;width:min(370px,calc(100vw - 40px));display:none;border:1px solid var(--line);background:#102019f7;border-radius:24px;padding:20px}.panel.on{display:block}.panel h3{font:400 1.45rem Georgia,serif;margin:0 0 8px}.panel p{color:#98a69d;line-height:1.55}.mini{font-size:.78rem;color:#7d8e84}.constellation{position:relative;min-height:390px;margin-top:20px;border:1px solid var(--line);border-radius:34px;background:rgba(255,255,255,.025);overflow:hidden}.center{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:160px;height:160px;border-radius:50%;display:grid;place-items:center;text-align:center;border:1px solid rgba(215,189,140,.35);font:400 1.4rem Georgia,serif}.star{position:absolute;width:210px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:24px;padding:15px;cursor:pointer}.s1{left:5%;top:8%}.s2{right:4%;top:12%}.s3{left:4%;bottom:9%}.s4{right:5%;bottom:8%}.star b{display:block;margin-bottom:5px}.star span{color:#90a097;font-size:.9rem;line-height:1.4}@keyframes breathe{50%{transform:scale(1.055);filter:brightness(1.06)}}@keyframes enter{from{opacity:0;transform:translateY(8px)}}@media(max-width:820px){.hero,.thread{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.orbwrap{min-height:210px;order:-1}.stage{padding-inline:21px}.hero h1,.scene>h1{font-size:3.1rem}.constellation{min-height:auto;padding:16px}.center,.star{position:static;transform:none;width:auto;height:auto;margin:10px;border-radius:24px}.center{padding:22px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div class="world"><header class="top"><div class="brand">LUMEN · PRESENCIA</div><button class="btn quiet" onclick="arrival()">Salir</button></header><main id="root" class="stage"></main><button class="presence" onclick="toggleLumi()" aria-label="LUMI"><span class="dot"></span><span>LUMI</span></button><aside id="panel" class="panel"><h3>Estoy acá.</h3><p>Podés contarme algo, pedirme otra forma o seguir por tu cuenta.</p><textarea aria-label="Hablar con LUMI" placeholder="Decime como te salga..."></textarea><div class="row"><button class="btn primary" onclick="understand()">Seguir</button><button class="btn" onclick="toggleLumi()">Cerrar</button></div></aside></div><script>
const R=document.querySelector('#root'),P=document.querySelector('#panel');let state={returned:false,own:false,proactive:false};function set(x){R.innerHTML=x;P.classList.remove('on');scrollTo(0,0)}function toggleLumi(){P.classList.toggle('on')}
function arrival(){set(`<section class="scene hero"><div><div class="eyebrow">Estoy acá</div><h1>¿Qué está vivo ahora?</h1><p class="lead">Podés contarme algo, explorar por tu cuenta o simplemente quedarte acá un momento.</p><textarea aria-label="Expresión libre" placeholder="Podés empezar por donde quieras..."></textarea><div class="row"><button class="btn primary" onclick="understand()">Contarte algo</button><button class="btn" onclick="explore()">Quiero explorar</button><button class="btn quiet" onclick="quiet()">Sólo estar</button></div></div><div class="orbwrap"><div class="orb"></div></div></section>`)}
function understand(){set(`<section class="scene hero"><div><div class="eyebrow">Te estoy siguiendo</div><h1>Parece que necesitás un poco de claridad antes de decidir.</h1><p class="lead">Puedo estar entendiendo mal. Si querés, te acerco algo breve para hacer espacio; si no, buscamos otra forma.</p><div class="row"><button class="btn primary" onclick="suggest()">Sí, probemos</button><button class="btn" onclick="clarify()">No es eso</button><button class="btn quiet" onclick="arrival()">Con esto alcanza</button></div></div><div class="orbwrap"><div class="orb"></div></div></section>`)}
function clarify(){set(`<section class="scene"><div class="eyebrow">Una sola aclaración</div><h1>¿Qué te ayudaría más ahora?</h1><div class="choices"><article class="choice" onclick="suggest()"><small>AHORA</small><h2>Bajar un poco el ruido</h2><p>Algo breve para atravesar este momento.</p></article><article class="choice" onclick="constellation()"><small>MIRAR</small><h2>Ordenar lo que estás viendo</h2><p>Otra perspectiva para discernir mejor.</p></article><article class="choice" onclick="human()"><small>CON ALGUIEN</small><h2>Hablarlo con una persona</h2><p>Una forma humana de acompañar lo que estás viviendo.</p></article></div></section>`)}
function suggest(){set(`<section class="scene"><div class="eyebrow">Una posibilidad</div><h1>Dos minutos de espacio.</h1><p class="lead">No para resolver nada. Sólo para que aparezca un poco más de aire antes de seguir.</p><div class="thread"><article class="choice" onclick="practice()"><small>2 MIN · SIN PANTALLA</small><h2>Probar ahora</h2><p>Una pausa breve. Yo me retiro mientras la hacés.</p></article><article class="choice" onclick="own()"><small>ALGO TUYO</small><h2>Volver a algo que ya te sirve</h2><p>Si ya tenés una forma propia, no hace falta agregar novedad.</p></article></div><div class="row"><button class="btn" onclick="constellation()">Quiero otra forma</button><button class="btn quiet" onclick="arrival()">No quiero nada ahora</button></div></section>`)}
function practice(){set(`<section class="scene hero"><div><div class="eyebrow">Ahora vos</div><h1>Salí un momento de la pantalla.</h1><p class="lead">Apoyá los pies. Mirá un punto quieto. Soltá el aire un poco más lento de lo habitual. No busques sentirte distinto.</p><div class="status">LUMI baja su presencia. No hay nada que completar.</div><div class="row"><button class="btn primary" onclick="returned()">Volví</button><button class="btn quiet" onclick="arrival()">Salir</button></div></div><div class="orbwrap"><div class="orb" style="opacity:.38;transform:scale(.72)"></div></div></section>`)}
function returned(){state.returned=true;set(`<section class="scene"><div class="eyebrow">Volviste</div><h1>¿Te ayudó en algo?</h1><p class="lead">No hace falta sacar una conclusión grande.</p><div class="row"><button class="btn primary" onclick="cultivate()">Sí, algo</button><button class="btn" onclick="notHelped()">No mucho</button><button class="btn" onclick="unknown()">No sé todavía</button><button class="btn quiet" onclick="arrival()">Prefiero no hablarlo</button></div></section>`)}
function cultivate(){set(`<section class="scene"><div class="eyebrow">Podés dejarlo acá</div><h1>O hacer algo más con lo que te sirvió.</h1><p class="lead">No hay una secuencia. Elegí sólo si alguna de estas formas te nace.</p><div class="choices"><article class="choice" onclick="own()"><small>HACER PROPIO</small><h2>Guardarlo como recurso</h2><p>Para volver cuando vos quieras.</p></article><article class="choice" onclick="transfer()"><small>LLEVAR A LA VIDA</small><h2>Probarlo en esa conversación</h2><p>Una versión mínima en otro contexto.</p></article><article class="choice" onclick="constellation()"><small>OTRA FORMA</small><h2>Profundizar sin repetir</h2><p>Mirarlo desde otra perspectiva o con alguien.</p></article></div><div class="row"><button class="btn quiet" onclick="arrival()">Dejarlo acá</button></div></section>`)}
function own(){state.own=true;set(`<section class="scene hero"><div><div class="eyebrow">Algo tuyo</div><h1>Esto puede quedar disponible sin convertirse en una tarea.</h1><p class="lead">Cuando vuelva a tener sentido, puedo recordarte que existe. O podés usarlo por tu cuenta y yo no intervenir.</p><div class="row"><button class="btn primary" onclick="later()">Quiero poder volver</button><button class="btn" onclick="withdraw()">No hace falta que me lo recuerdes</button><button class="btn quiet" onclick="arrival()">Seguir</button></div></div><div class="orbwrap"><div class="orb" style="width:90px;opacity:.65"></div></div></section>`)}
function later(){set(`<section class="scene"><div class="eyebrow">Continuidad elegida</div><h1>Queda cerca, no encima tuyo.</h1><p class="lead">Si volvés con algo parecido, puedo empezar por esto antes de buscar novedad.</p><div class="row"><button class="btn primary" onclick="returnLater()">Simular un regreso</button><button class="btn" onclick="proactivity()">Tal vez recordármelo</button><button class="btn quiet" onclick="arrival()">Salir</button></div></section>`)}
function returnLater(){set(`<section class="scene hero"><div><div class="eyebrow">Qué bueno volver</div><h1>¿Querés recuperar algo que ya te sirvió?</h1><p class="lead">La otra vez, hacer un poco de espacio te ayudó antes de decidir. El presente manda: puede servir otra vez, variar o no tener nada que ver.</p><div class="row"><button class="btn primary" onclick="transfer()">Usarlo en esta situación</button><button class="btn" onclick="practice()">Repetirlo</button><button class="btn" onclick="constellation()">Otra forma</button><button class="btn quiet" onclick="arrival()">Hoy es otra cosa</button></div></div><div class="orbwrap"><div class="orb" style="width:105px"></div></div></section>`)}
function transfer(){set(`<section class="scene"><div class="eyebrow">Llevarlo a la vida</div><h1>Probá una versión mínima antes de esa conversación.</h1><p class="lead">No hace falta repetir la práctica completa. Sólo frená diez segundos, soltá el aire y preguntate qué querés cuidar antes de responder.</p><div class="row"><button class="btn primary" onclick="transferReturn()">Lo probé</button><button class="btn" onclick="constellation()">Prefiero otra forma</button><button class="btn quiet" onclick="arrival()">No ahora</button></div></section>`)}
function transferReturn(){set(`<section class="scene"><div class="eyebrow">En otro contexto</div><h1>¿Te sirvió también ahí?</h1><div class="row"><button class="btn primary" onclick="appropriation()">Sí, pude usarlo solo</button><button class="btn" onclick="cultivate()">Algo, pero habría que variarlo</button><button class="btn" onclick="notHelped()">No</button><button class="btn quiet" onclick="arrival()">No quiero responder</button></div></section>`)}
function appropriation(){set(`<section class="scene hero"><div><div class="eyebrow">Menos LUMEN</div><h1>Parece que ya sabés volver a esto por tu cuenta.</h1><p class="lead">No necesito seguir sugiriéndolo. Puede quedar como algo tuyo y aparecer sólo si vos lo buscás.</p><div class="row"><button class="btn primary" onclick="withdraw()">Sí, dejalo en mis recursos</button><button class="btn" onclick="later()">Todavía quiero algo de acompañamiento</button></div></div><div class="orbwrap"><div class="orb" style="width:64px;opacity:.35"></div></div></section>`)}
function withdraw(){set(`<section class="scene hero"><div><div class="eyebrow">Es tuyo</div><h1>No tengo nada que agregar.</h1><p class="lead">Podés seguir con tu vida. Si alguna vez querés volver, estoy acá.</p><div class="row"><button class="btn quiet" onclick="arrival()">Volver al presente</button></div></div><div class="orbwrap"><div class="orb" style="width:42px;opacity:.2"></div></div></section>`)}
function constellation(){set(`<section class="scene"><div class="eyebrow">Distintas formas de acercarte</div><h1>No todo se cultiva de la misma manera.</h1><p class="lead">Si lo que estás buscando es más claridad para decidir, podés acercarte desde lugares distintos. No hay orden ni recorrido obligatorio.</p><div class="constellation"><div class="center">Más claridad<br>para decidir</div><div class="star s1" onclick="suggest()"><b>Hacer espacio</b><span>Una práctica breve antes de pensar más.</span></div><div class="star s2" onclick="reflection()"><b>Mirarlo distinto</b><span>Una pregunta que ordene sin darte una respuesta.</span></div><div class="star s3" onclick="human()"><b>Con alguien</b><span>Una conversación humana cuando pensar solo no alcanza.</span></div><div class="star s4" onclick="transfer()"><b>Llevarlo a la vida</b><span>Probar una forma mínima en la situación real.</span></div></div><p class="note">Podés entrar por cualquiera, mezclar, dejarlo o volver más adelante.</p></section>`)}
function reflection(){set(`<section class="scene"><div class="eyebrow">Una pregunta</div><h1>¿Qué decisión te dejaría más en paz con vos, incluso si no fuera la más cómoda?</h1><p class="lead">No hace falta contestarme. Podés llevártela, escribir algo o volver a otra forma.</p><div class="row"><button class="btn" onclick="cultivate()">Esto me abrió algo</button><button class="btn" onclick="human()">Quiero hablarlo con alguien</button><button class="btn quiet" onclick="arrival()">Me la llevo</button></div></section>`)}
function human(){set(`<section class="scene"><div class="eyebrow">Otra vida puede ayudar</div><h1>No todo tiene que pasar entre vos y una pantalla.</h1><p class="lead">Podría servir hablar con alguien de confianza, una persona con experiencia o un profesional, según lo que estés viviendo.</p><div class="choices"><article class="choice"><small>ALGUIEN CERCANO</small><h2>Una conversación honesta</h2><p>Sin convertirla en consejo automático.</p></article><article class="choice"><small>EXPERIENCIA</small><h2>Alguien que pasó por algo parecido</h2><p>Con límites y contexto claros.</p></article><article class="choice"><small>APOYO PROFESIONAL</small><h2>Cuando hace falta más sostén</h2><p>Con condiciones, alcance y límites visibles.</p></article></div><div class="row"><button class="btn" onclick="constellation()">Volver a otras formas</button><button class="btn quiet" onclick="arrival()">Salir</button></div></section>`)}
function proactivity(){state.proactive=true;set(`<section class="scene"><div class="eyebrow">Sólo si vos querés</div><h1>Puedo acercártelo más adelante.</h1><p class="lead">No porque dejaste de entrar, sino porque elegiste sostener esto.</p><div class="row"><button class="btn primary" onclick="later()">Sí, una vez</button><button class="btn" onclick="arrival()">Ahora no</button><button class="btn quiet" onclick="arrival()">No me recuerdes esto</button></div></section>`)}
function explore(){set(`<section class="scene"><div class="eyebrow">Andá por donde quieras</div><h1>No necesitás tener un problema para explorar.</h1><div class="choices"><article class="choice" onclick="constellation()"><small>QUIERO CULTIVAR</small><h2>Más claridad para decidir</h2><p>Distintas formas alrededor de una capacidad humana, sin niveles ni progreso.</p></article><article class="choice" onclick="own()"><small>VOLVER A LO MÍO</small><h2>Algo que ya me sirve</h2><p>Recursos propios antes que novedad.</p></article><article class="choice" onclick="human()"><small>OTRAS VIDAS</small><h2>Acercarme a alguien</h2><p>Personas y encuentros cuando eso agrega valor.</p></article></div><div class="row"><button class="btn quiet" onclick="arrival()">Volver al presente</button></div></section>`)}
function quiet(){set(`<section class="scene hero"><div><div class="eyebrow">Sin hacer nada</div><h1>Podemos quedarnos acá.</h1><p class="lead">No hay nada que completar ni decidir.</p><div class="row"><button class="btn quiet" onclick="arrival()">Cuando quieras</button></div></div><div class="orbwrap"><div class="orb" style="opacity:.3"></div></div></section>`)}
function notHelped(){set(`<section class="scene"><div class="eyebrow">Está bien</div><h1>No voy a insistir con algo que no ayudó.</h1><div class="row"><button class="btn" onclick="constellation()">Probar otra forma</button><button class="btn" onclick="clarify()">Contarte mejor qué necesito</button><button class="btn quiet" onclick="arrival()">Dejarlo acá</button></div></section>`)}
function unknown(){set(`<section class="scene"><div class="eyebrow">No hace falta saber</div><h1>Podemos dejar la respuesta abierta.</h1><p class="lead">Si más adelante aparece algo, lo retomamos. Si no, no inventamos una conclusión.</p><div class="row"><button class="btn quiet" onclick="arrival()">Seguir</button></div></section>`)}
arrival();
</script></body></html>
