<title>LUMEN · Experience & Sensation Field V1.3</title>
<style>
:root{--bg:#08120e;--bg2:#122019;--fg:#f3f0e8;--mut:#9daba2;--soft:#72867a;--line:rgba(240,244,235,.12);--sage:#91ad97;--warm:#e6c895;--paper:#efe8dc;--ink:#27322d;--danger:#e8b3a5;--ease:cubic-bezier(.22,.8,.25,1)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.world{min-height:100vh;position:relative;overflow:hidden;background:radial-gradient(circle at var(--x,65%) var(--y,20%),rgba(214,181,124,.12),transparent 24%),radial-gradient(circle at 18% 45%,rgba(104,151,118,.14),transparent 32%),linear-gradient(150deg,#08120e,#112019 55%,#15251e);transition:background 1.2s var(--ease)}.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E")}.top{position:fixed;z-index:30;left:24px;right:24px;top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:.67rem;letter-spacing:.23em;color:#85978b}.tools{display:flex;gap:8px;align-items:center}.tool{border:1px solid var(--line);background:rgba(7,16,12,.55);backdrop-filter:blur(14px);color:#9eada3;border-radius:999px;padding:9px 12px}.tool:hover,.tool:focus-visible{background:rgba(255,255,255,.07);outline:none;border-color:rgba(230,200,150,.4)}.stage{min-height:100vh;display:grid;place-items:center;padding:82px max(22px,6vw) 60px}.field{width:min(1120px,100%);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.75fr);gap:clamp(35px,8vw,110px);align-items:center}.copy{max-width:700px}.kicker{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:#81968a;font-weight:750}.copy h1{font:400 clamp(3.1rem,6.7vw,6.8rem)/.92 Georgia,"Times New Roman",serif;letter-spacing:-.055em;margin:15px 0 23px}.copy p{color:#a4b0a8;font-size:1.05rem;line-height:1.78;max-width:650px}.orbspace{position:relative;min-height:480px;display:grid;place-items:center}.ring,.ring2{position:absolute;width:min(420px,40vw);aspect-ratio:1;border:1px solid rgba(214,231,216,.08);border-radius:50%;transition:1.3s var(--ease)}.ring2{width:min(310px,30vw);border-color:rgba(214,231,216,.1)}.orb{width:170px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 27%,#f8fbf4 0 3%,#c6dcc7 14%,#84aa8c 43%,#34563f 70%,#142b1d);box-shadow:0 0 0 32px rgba(188,221,193,.018),0 0 0 82px rgba(188,221,193,.012),0 0 145px rgba(117,174,130,.22);animation:breathe 8s ease-in-out infinite;transition:1.2s var(--ease);position:relative;z-index:3}.orb.quiet{transform:scale(.72);opacity:.28;box-shadow:0 0 55px rgba(117,174,130,.08)}.orb.tiny{width:90px;opacity:.68}.orb.absent{opacity:.05;transform:scale(.4)}@keyframes breathe{50%{transform:scale(1.055);filter:brightness(1.05)}}.expression{margin-top:32px;display:flex;gap:10px;align-items:flex-end;max-width:700px}.expression textarea{flex:1;min-height:62px;max-height:150px;resize:vertical;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.045);color:#eef1eb;border-radius:22px;padding:18px;outline:none;backdrop-filter:blur(12px)}.expression textarea:focus{border-color:rgba(222,194,145,.48);background:rgba(255,255,255,.07)}.expression textarea::placeholder{color:#8f9e95}.send{width:60px;height:60px;border:0;border-radius:50%;background:#ece6da;color:#1c2b23;font-size:1.25rem}.under{margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.textbtn{border:0;background:transparent;color:#b9c4bd;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.18)}.ambientCue{font-size:.84rem;color:#71857a}.choices{display:flex;gap:9px;flex-wrap:wrap;margin-top:30px}.pill{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#dbe1dc;padding:11px 15px;border-radius:999px;transition:.25s}.pill:hover,.pill:focus-visible{background:rgba(255,255,255,.09);transform:translateY(-1px);outline:none}.pill.main{background:#ece6da;color:#1c2922;border-color:#ece6da;font-weight:700}.pill.danger{border-color:rgba(232,179,165,.42);color:#f0c9be}.whisper{margin-top:20px;color:#657a6d;font:italic 1rem Georgia,serif}.reflection{border-left:1px solid rgba(228,194,139,.38);padding-left:22px;color:#c8d0cb;line-height:1.75;margin-top:28px;max-width:650px}.constellation{position:relative;width:min(500px,44vw);aspect-ratio:1}.cOrb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:112px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 28%,#eff6ec,#82a98b 45%,#294c36 78%);box-shadow:0 0 70px rgba(126,184,139,.2)}.node{position:absolute;width:150px;border:1px solid rgba(255,255,255,.12);background:rgba(10,23,16,.67);backdrop-filter:blur(13px);border-radius:19px;padding:12px 13px;color:#d9e0da;transition:.3s;text-align:left}.node:hover,.node:focus-visible{transform:translateY(-3px);border-color:rgba(230,197,145,.4);outline:none}.node b{font:400 .98rem Georgia,serif}.node small{display:block;color:#73877a;margin-top:4px;line-height:1.3}.n1{left:0;top:8%}.n2{right:0;top:8%}.n3{right:-3%;top:40%}.n4{right:2%;bottom:6%}.n5{left:2%;bottom:6%}.n6{left:-3%;top:40%}.n7{left:35%;top:-5%}.n8{left:35%;bottom:-5%}.drawer{position:fixed;z-index:40;right:22px;bottom:22px;width:min(440px,calc(100vw - 44px));padding:22px;border:1px solid var(--line);background:rgba(11,24,17,.95);backdrop-filter:blur(18px);border-radius:26px;box-shadow:0 30px 90px rgba(0,0,0,.32);transform:translateY(130%);transition:.6s var(--ease)}.drawer.on{transform:none}.drawer .kind{font-size:.63rem;letter-spacing:.16em;color:#7e9385;text-transform:uppercase}.drawer h2{font:400 1.8rem Georgia,serif;margin:8px 0 10px}.drawer p{color:#9eaca2;line-height:1.6;font-size:.93rem}.drawer .meta{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tag{border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 8px;color:#899b8f;font-size:.72rem}.immersive{text-align:center;max-width:790px;margin:auto}.immersive .orb{width:110px;margin:0 auto 38px;animation-duration:10s}.immersive h1{font:400 clamp(2.8rem,6vw,5.8rem)/1 Georgia,serif;margin:0}.immersive p{max-width:630px;margin:24px auto;color:#9fada4;line-height:1.75}.breathline{width:min(420px,80%);height:2px;background:rgba(255,255,255,.1);margin:40px auto;overflow:hidden}.breathline i{display:block;width:35%;height:100%;background:#d8bd8d;animation:travel 6s ease-in-out infinite}@keyframes travel{50%{transform:translateX(185%)}}.paper{width:min(830px,100%);background:linear-gradient(145deg,#f1ebdf,#e4ddd1);color:var(--ink);border-radius:40px;padding:clamp(28px,5vw,58px);box-shadow:0 30px 100px rgba(0,0,0,.22)}.paper .kicker{color:#748078}.paper h1{font:400 clamp(2.6rem,5vw,5rem)/.98 Georgia,serif;margin:14px 0 22px}.paper p{color:#5d6861;line-height:1.7}.paper .pill{border-color:rgba(39,50,45,.15);color:var(--ink)}.paper .pill.main{background:#26342c;color:#f2eee5}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:26px}.card{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.035);border-radius:24px;padding:20px}.card h3{font:400 1.35rem Georgia,serif;margin:0 0 9px}.card p{font-size:.9rem;line-height:1.55;margin:0;color:#8fa095}.demo{position:fixed;z-index:45;right:22px;top:70px;width:min(330px,calc(100vw - 44px));padding:18px;border:1px solid var(--line);background:rgba(9,20,14,.97);border-radius:22px;display:none;box-shadow:0 20px 60px rgba(0,0,0,.35)}.demo.on{display:block}.demo h3{font:400 1.2rem Georgia,serif;margin:0 0 10px}.demo label{display:block;color:#8fa095;font-size:.82rem;margin:10px 0}.demo select{width:100%;margin-top:5px;background:#14251b;color:#e7ebe7;border:1px solid var(--line);padding:9px;border-radius:10px}.coverage{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);color:#6f8275;font-size:.75rem;line-height:1.5}.foot{position:fixed;z-index:20;left:24px;bottom:18px;color:#52685a;font-size:.62rem;letter-spacing:.1em}.fade{animation:fade .8s var(--ease)}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:850px){.field{grid-template-columns:1fr}.orbspace{min-height:300px;order:-1}.ring{width:300px}.ring2{width:220px}.copy h1{font-size:3.5rem}.constellation{width:min(480px,92vw)}.node{width:120px;font-size:.82rem}.stage{padding:82px 22px 55px}.foot{display:none}.cards{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="world" id="world"><div class="grain"></div><header class="top"><div class="brand">LUMEN · PRESENCIA</div><div class="tools"><button class="tool" id="soundBtn" aria-label="Activar sonido ambiental">sonido ○</button><button class="tool" id="demoBtn" aria-label="Abrir escenarios de prueba">···</button><button class="tool" onclick="withdraw()">Salir</button></div></header><div id="root" aria-live="polite"></div><aside class="drawer" id="drawer" aria-live="polite"></aside><aside class="demo" id="demo"><h3>Escenarios de prueba</h3><label>Entrada<select id="scenario"><option value="first">Primera llegada</option><option value="faro">Faro previo autorizado</option><option value="own">Algo propio disponible</option><option value="proactive">Proactividad consentida</option><option value="nomatch">NO_MATCH</option><option value="safety">Safety / derivación</option><option value="human">Otra vida</option><option value="silence">Sólo estar</option></select></label><button class="pill" style="margin-top:8px" onclick="applyScenario()">Abrir escenario</button><div class="coverage">Control de QA. No forma parte de la experiencia normal. Permite recorrer la cobertura fisiológica V55.3 sin convertirla en navegación visible.</div></aside><div class="foot">A63 · V55.3 · FIELD NO REGRESIVO</div></main>
<script>
const root=document.querySelector('#root'),drawer=document.querySelector('#drawer'),demo=document.querySelector('#demo'),scenario=document.querySelector('#scenario');
const K='lumen-v13-field';
const saved=JSON.parse(localStorage.getItem(K)||'{}');
let ctx={entry:'first',input:'',selected:null,lastKind:null,outcome:null,own:saved.own||[],faro:saved.faro||null,proactive:saved.proactive??true,memoryAllowed:saved.memoryAllowed??true,sound:false};
const archetypes=[
{t:'Comprender',s:'Una perspectiva que puede ordenar sin cerrar',k:'perspective',m:'lectura · 4 min'},
{t:'Practicar',s:'Una experiencia breve para vivir, no sólo leer',k:'practice',m:'práctica · 2 min'},
{t:'Escuchar',s:'Una pieza de audio para salir de la pantalla',k:'audio',m:'audio · 5 min'},
{t:'Encontrarnos',s:'Otra vida, círculo o encuentro humano',k:'human',m:'humano · variable'},
{t:'Actuar',s:'Un gesto concreto en el mundo real',k:'action',m:'acción · 10 min'},
{t:'Profundizar',s:'Una obra o recurso con procedencia',k:'resource',m:'recurso · abierto'},
{t:'Ir',s:'Un lugar, evento o experiencia presencial',k:'place',m:'presencial'},
{t:'Recibir ayuda',s:'Apoyo profesional, material o servicio',k:'support',m:'apoyo · según disponibilidad'}
];
function persist(){localStorage.setItem(K,JSON.stringify({own:ctx.own,faro:ctx.faro,proactive:ctx.proactive,memoryAllowed:ctx.memoryAllowed}))}
function shell(copy,visual='<div class="ring"></div><div class="ring2"></div><div class="orb"></div>'){drawer.classList.remove('on');root.innerHTML=`<section class="stage fade"><div class="field"><div class="copy">${copy}</div><div class="orbspace">${visual}</div></div></section>`;window.scrollTo(0,0)}
function arrive(){ctx.entry='first';const cue=ctx.faro?`<button class="textbtn" onclick="resumeFaro()">Hay un hilo anterior disponible, si hoy importa.</button>`:ctx.own.length?`<button class="textbtn" onclick="repertoire()">Hay algo tuyo disponible, si lo necesitás.</button>`:'';shell(`<div class="kicker">VIDA → PRESENCIA</div><h1>¿Qué está vivo ahora?</h1><p>Podés llegar como estés. No necesitás elegir una parte de LUMEN ni saber qué pedir.</p><div class="expression"><textarea id="input" placeholder="Contame lo que quieras…" aria-label="Expresión libre"></textarea><button class="send" onclick="listen()" aria-label="Compartir">→</button></div><div class="under"><button class="textbtn" onclick="explore()">Quiero explorar</button>${cue}</div><div class="whisper">Estoy acá. Sin apuro.</div>`)}
function listen(){const el=document.querySelector('#input');ctx.input=(el?.value||'').trim();if(!ctx.input){silence();return}const t=ctx.input.toLowerCase();if(/suicid|matarme|hacerme daño|no quiero vivir|lastimarme/.test(t))return safety();if(/no hay nada|nada me sirve|no existe|imposible de ayudar/.test(t))return noMatch();let title='Puedo intentar entender con vos.';let refl='Escucho algo que todavía no necesita convertirse en una categoría. Podemos quedarnos lo suficiente para distinguir qué podría tener sentido ahora.';let mode='general';if(/faro|seguir|continu|retomar|camino/.test(t)){title='Esto parece tener un hilo anterior.';refl=ctx.faro?'Hay una continuidad que elegiste cuidar. Puedo traerla sólo como contexto, sin convertir este momento en un programa.':'Podemos mirar la continuidad que nombrás sin asumir que hoy necesite lo mismo que antes.';mode='continuity'}else if(/ansiedad|agob|miedo|cans|triste|perdid|mal|ruido/.test(t)){title='Parece que esto está ocupando bastante espacio.';refl='No necesito diagnosticarlo para estar con vos. Primero podemos bajar un poco el ruido y después ver si conviene comprender, vivir algo breve, buscar otra ayuda o simplemente dejar espacio.';mode='regulate'}else if(/decid|eleg|duda|no sé|confund/.test(t)){title='Hay algo que todavía no termina de ordenarse.';refl='Quizá no haga falta decidir enseguida. Puedo ayudarte a abrir perspectivas sin empujarte hacia una respuesta.';mode='discern'}else if(/persona|hablar con|solo|sola|pareja|amigo|equipo/.test(t)){title='Quizá esto no necesite resolverse sólo acá.';refl='A veces otra vida es la forma correcta de ayuda. Puedo ayudarte a preparar ese encuentro y después corrernos.';mode='human'}ctx.mode=mode;shell(`<div class="kicker">ESCUCHAR → COMPRENDER</div><h1>${title}</h1><div class="reflection">${refl}</div><div class="choices"><button class="pill main" onclick="openPossibilities()">Sí, es por ahí</button><button class="pill" onclick="clarify()">No del todo</button><button class="pill" onclick="explore()">Prefiero explorar</button><button class="pill" onclick="closeEnough()">Con esto alcanza</button></div><div class="whisper">Si no sé, te lo voy a decir.</div>`)}
function clarify(){shell(`<div class="kicker">INCERTIDUMBRE → ACLARAR</div><h1>No estoy seguro de haber entendido bien.</h1><p>No necesito saber todo. Sólo una cosa que pueda cambiar materialmente lo que te acerque.</p><div class="expression"><textarea id="clarify" aria-label="Aclaración" placeholder="¿Qué sería importante que no entienda mal?"></textarea><button class="send" onclick="acceptClarify()">→</button></div><div class="under"><button class="textbtn" onclick="openPossibilities()">No hace falta aclarar más</button><button class="textbtn" onclick="noMatch()">No logro ponerlo en palabras</button></div>`)}
function acceptClarify(){const v=document.querySelector('#clarify')?.value.trim();if(v)ctx.input+=' '+v;openPossibilities()}
function recommendation(){if(ctx.mode==='continuity'&&ctx.own.length)return{t:'Volver a algo que ya es tuyo',s:'Antes que sumar novedad, podemos recuperar una forma que ya te sirvió y ver si hoy sigue viva.',k:'own',why:'Porque ya existe una relación previa y el presente puede decidir si todavía sirve.'};if(ctx.mode==='regulate')return{t:'Volver al suelo',s:'Una pausa breve para bajar volumen sin intentar resolverlo todo.',k:'practice',why:'Porque ahora parece más valioso crear un poco de espacio antes que agregar análisis.'};if(ctx.mode==='discern')return{t:'Abrir dos miradas sin decidir todavía',s:'Una forma breve de separar lo que sabés, lo que suponés y lo que todavía no necesita respuesta.',k:'perspective',why:'Porque la incertidumbre parece pedir discernimiento antes que acción.'};if(ctx.mode==='human')return{t:'Preparar una conversación humana',s:'Ordenar qué querés llevar a otra persona y después dejar que lo humano ocupe el centro.',k:'human',why:'Porque otra vida puede aportar algo que LUMEN no debería intentar reemplazar.'};return{t:'Una posibilidad pequeña, no una respuesta total',s:'Probar algo breve y reversible para ver qué ocurre en la vida real.',k:'action',why:'Porque todavía hay suficiente apertura como para aprender sin encerrarte.'}}
function openPossibilities(){const r=recommendation();ctx.selected=r;shell(`<div class="kicker">APERTURA → POSIBILIDAD</div><h1>Hay algo que podría tener sentido ahora.</h1><p>${r.t}</p><div class="reflection">${r.s}<br><br><span style="color:#7d9184">Por qué podría ser pertinente:</span> ${r.why}</div><div class="choices"><button class="pill main" onclick="live('${r.k}')">Quiero probarlo</button><button class="pill" onclick="constellation()">Abrir el campo un poco más</button><button class="pill" onclick="explore()">Prefiero explorar</button><button class="pill" onclick="noMatch()">Nada de esto</button></div><div class="whisper">Vos seguís eligiendo.</div>`,miniConstellation())}
function miniConstellation(){return `<div class="constellation" aria-hidden="true"><div class="cOrb"></div><div class="node n1"><b>comprender</b><small>otra mirada</small></div><div class="node n2"><b>vivir</b><small>algo breve</small></div><div class="node n4"><b>otra vida</b><small>conectar</small></div><div class="node n5"><b>algo propio</b><small>recordar</small></div></div>`}
function constellation(){shell(`<div class="kicker">CONSTELACIÓN</div><h1>No hay una única manera de estar con esto.</h1><p>Podemos cambiar de forma sin cambiar de relación. Elegí sólo si algo te llama; también podés volver atrás.</p><div class="choices"><button class="pill" onclick="live('perspective')">Otra mirada</button><button class="pill" onclick="live('practice')">Algo para vivir</button><button class="pill" onclick="live('human')">Otra vida</button>${ctx.own.length?`<button class="pill" onclick="repertoire()">Algo propio</button>`:''}<button class="pill" onclick="explore()">Explorar más</button><button class="pill" onclick="arrive()">Volver al campo</button></div>`,miniConstellation())}
function explore(){const nodes=archetypes.map((a,i)=>`<button class="node n${i+1}" onclick="peek(${i})"><b>${a.t}</b><small>${a.s}</small></button>`).join('');shell(`<div class="kicker">EXPLORAR · RESERVORIO VIVO</div><h1>¿Qué podría ser valioso para tu vida ahora?</h1><p>No es un catálogo. Podés acercarte por curiosidad y seguir relaciones entre formas distintas de ayuda.</p><div class="under"><button class="textbtn" onclick="arrive()">Volver a presencia</button>${ctx.own.length?`<button class="textbtn" onclick="repertoire()">Ver algo propio</button>`:''}</div>`,`<div class="constellation"><div class="cOrb"></div>${nodes}</div>`)}
function peek(i){const a=archetypes[i];drawer.innerHTML=`<div class="kind">${a.m}</div><h2>${a.t}</h2><p>${a.s}</p><div class="meta"><span class="tag">procedencia visible</span><span class="tag">salida clara</span><span class="tag">sin obligación</span></div><p>${detailText(a.k)}</p><div class="choices"><button class="pill main" onclick="live('${a.k}')">Acercarme</button><button class="pill" onclick="related('${a.k}')">Ver algo relacionado</button><button class="pill" onclick="drawer.classList.remove('on')">Seguir mirando</button></div>`;drawer.classList.add('on')}
function detailText(k){return({perspective:'Puede ayudarte a mirar sin cerrar una respuesta.',practice:'Su valor está en lo que pasa al vivirla, no en explicarla.',audio:'Está pensada para que la pantalla pueda desaparecer.',human:'LUMEN prepara contexto y después cede protagonismo.',action:'Una posibilidad que sólo se verifica cuando vuelve a la vida.',resource:'Profundidad con procedencia y sin convertir autoridad en score.',place:'Una transición desde LUMEN hacia un lugar real.',support:'Cuando el problema necesita ayuda concreta, no introspección por defecto.'})[k]}
function related(k){drawer.classList.remove('on');const map={perspective:'resource',practice:'audio',audio:'practice',human:'support',action:'place',resource:'perspective',place:'human',support:'human'};live(map[k]||'practice')}
function live(k){ctx.lastKind=k;drawer.classList.remove('on');if(k==='own')return repertoire();if(k==='practice')return practice();if(k==='audio')return audio();if(k==='human')return humanPrep();if(k==='action')return action();if(k==='perspective')return perspective();if(k==='resource')return resource();if(k==='place')return place();if(k==='support')return support();}
function perspective(){root.innerHTML=`<section class="stage fade"><article class="paper"><div class="kicker">PERSPECTIVA · P1</div><h1>No todo lo urgente merece decidirse ahora.</h1><p>Podés distinguir tres capas: lo que ya sabés; lo que hoy estás suponiendo; y lo que todavía puede permanecer abierto sin que eso sea una falla.</p><p>La pregunta no es cuál capa “gana”, sino qué cambia cuando dejás de pedirle certeza a lo que todavía es incierto.</p><div class="choices"><button class="pill main" onclick="returnFromLife()">Quiero volver con esto</button><button class="pill" onclick="integrateQuietly('perspectiva')">Guardarlo y seguir</button><button class="pill" onclick="withdraw()">Con esto alcanza</button></div></article></section>`}
function practice(){root.innerHTML=`<section class="stage fade"><div class="immersive"><div class="orb tiny"></div><div class="kicker">EXPERIENCIA · LUMEN BAJA A P1</div><h1>Volvé al apoyo que ya está acá.</h1><p>Sin cambiar nada todavía, notá tres puntos de contacto del cuerpo con lo que te sostiene. Después dejá que una exhalación sea apenas más larga.</p><div class="breathline"><i></i></div><p>No hay nada que completar. Podés irte a vivirlo sin pantalla.</p><div class="choices" style="justify-content:center"><button class="pill main" onclick="offscreen()">Me voy un momento</button><button class="pill" onclick="returnFromLife()">Ya puedo volver</button><button class="pill" onclick="withdraw()">Cerrar por ahora</button></div></div></section>`}
function audio(){root.innerHTML=`<section class="stage fade"><div class="immersive"><div class="orb tiny"></div><div class="kicker">AUDIO · P1 → P0</div><h1>Podés cerrar los ojos.</h1><p>La voz entra sólo para acompañar el comienzo. Después deja espacio. En una implementación real habría play/pausa, velocidad, volumen y transcripción accesible.</p><div class="breathline"><i></i></div><div class="choices" style="justify-content:center"><button class="pill main" onclick="offscreen()">Seguir sin mirar la pantalla</button><button class="pill" onclick="returnFromLife()">Volver</button></div></div></section>`}
function action(){root.innerHTML=`<section class="stage fade"><div class="immersive"><div class="orb quiet"></div><div class="kicker">ACCIÓN · P0/P1</div><h1>Elegí un gesto suficientemente pequeño.</h1><p>No resolver todo. Sólo una acción que exista en el mundo y pueda ocurrir en menos de diez minutos. LUMEN puede quedar disponible sin acompañarla paso a paso.</p><div class="choices" style="justify-content:center"><button class="pill main" onclick="offscreen()">Ya sé cuál es · voy</button><button class="pill" onclick="clarifyAction()">Necesito achicarlo</button><button class="pill" onclick="withdraw()">No ahora</button></div></div></section>`}
function clarifyAction(){shell(`<div class="kicker">FACILITAR · P2</div><h1>Hagámoslo más pequeño.</h1><p>¿Cuál sería una versión que deje de necesitar motivación perfecta para empezar?</p><div class="choices"><button class="pill main" onclick="offscreen()">Ya apareció una</button><button class="pill" onclick="constellation()">Necesito otra forma de ayuda</button></div>`)}
function resource(){root.innerHTML=`<section class="stage fade"><article class="paper"><div class="kicker">OBRA / RECURSO · PROCEDENCIA VISIBLE</div><h1>Profundizar sin convertir autoridad en obediencia.</h1><p><strong>Qué es:</strong> una pieza de lectura seleccionada por su capacidad de abrir una mirada complementaria.</p><p><strong>Por qué podría servir:</strong> no para darte una receta, sino para agregar contexto y lenguaje donde hoy hay algo difícil de nombrar.</p><p><strong>Condiciones:</strong> lectura opcional, procedencia explícita, sin score de verdad ni obligación de acuerdo.</p><div class="choices"><button class="pill main" onclick="returnFromLife()">La leí / quiero volver</button><button class="pill" onclick="related('resource')">Otra mirada</button><button class="pill" onclick="withdraw()">Dejarla para otro momento</button></div></article></section>`}
function place(){shell(`<div class="kicker">LUGAR / EXPERIENCIA REAL · P1</div><h1>A veces conviene ir, no seguir mirando.</h1><p>Una experiencia presencial necesita contexto real: dónde es, qué puede aportar, tiempo, acceso, costo, condiciones y una salida clara. Después la pantalla cede.</p><div class="choices"><button class="pill main" onclick="offscreen()">Ir al mundo</button><button class="pill" onclick="related('place')">Algo humano sin moverme ahora</button><button class="pill" onclick="explore()">Seguir explorando</button></div>`)}
function support(){shell(`<div class="kicker">AYUDA HUMANA / PROFESIONAL / MATERIAL</div><h1>No todo debe transformarse en introspección.</h1><p>Si lo que hace falta es una persona, un profesional, un servicio o apoyo material, LUMEN debe acercarlo con procedencia, límites, costo/disponibilidad y razones comprensibles.</p><div class="reflection">La ayuda correcta puede estar fuera del software. LUMEN no compite con ella: facilita el puente.</div><div class="choices"><button class="pill main" onclick="humanPrep()">Preparar una conexión</button><button class="pill" onclick="explore()">Ver otras posibilidades</button><button class="pill" onclick="withdraw()">Cerrar</button></div>`)}
function humanPrep(){shell(`<div class="kicker">PREPARAR → OTRA VIDA</div><h1>Antes de encontrarnos, cuidemos los bordes.</h1><p>Qué querés llevar, qué no querés exponer, cuál es el propósito y cómo salir si deja de hacerte bien. Después LUMEN se retira.</p><div class="choices"><button class="pill main" onclick="humanSpace()">Entrar al encuentro</button><button class="pill" onclick="withdraw()">No ahora</button></div><div class="whisper">Pedir y ofrecer ayuda tienen la misma dignidad.</div>`)}
function humanSpace(){root.innerHTML=`<section class="stage fade"><div class="immersive"><div class="orb absent"></div><div class="kicker">TEJIDO · LUMEN P0</div><h1>Ahora, Vida acompaña Vida.</h1><p>La otra persona o el grupo ocupa el centro. LUMEN sostiene contexto, privacidad, salida y reporte; no dirige la conversación ni extrae intimidad colectiva.</p><div class="choices" style="justify-content:center"><button class="pill main" onclick="returnFromHuman()">El encuentro terminó</button><button class="pill danger" onclick="leaveHuman()">Salir / reportar</button></div></div></section>`}
function leaveHuman(){shell(`<div class="kicker">SALIDA SOBERANA</div><h1>Salir también está bien.</h1><p>No hay penalización. Si algo necesita cuidado o reporte, puede hacerse sin tener que volver al encuentro.</p><div class="choices"><button class="pill main" onclick="arrive()">Volver a presencia</button><button class="pill" onclick="withdraw()">Cerrar</button></div>`)}
function returnFromHuman(){ctx.lastKind='human';returnFromLife()}
function offscreen(){root.innerHTML=`<section class="stage fade"><div class="immersive"><div class="orb absent"></div><div class="kicker">VIDA · LUMEN RETIRADO</div><h1>Ahora puede tocar vivir.</h1><p>No hay nada pendiente acá. La relación queda disponible sin perseguirte.</p><div class="choices" style="justify-content:center"><button class="pill" onclick="returnFromLife()">Volví</button><button class="pill" onclick="withdraw()">Cerrar por ahora</button></div></div></section>`}
function returnFromLife(){shell(`<div class="kicker">RETORNO · RECIBIR</div><h1>¿Qué pasó en la vida?</h1><p>Puede alcanzar una señal. Esto no es una evaluación y no tenés que convertir lo vivido en una conclusión.</p><div class="choices"><button class="pill main" onclick="outcome('helped')">Algo me ayudó</button><button class="pill" onclick="outcome('not')">No era para mí</button><button class="pill" onclick="outcome('unknown')">No sé todavía</button><button class="pill" onclick="outcome('other')">Pasó otra cosa</button><button class="pill" onclick="outcome('private')">Prefiero no hablar</button></div>`)}
function outcome(v){ctx.outcome=v;if(v==='helped')return integration();if(v==='not')return notHelpful();if(v==='unknown')return leaveOpen();if(v==='other')return otherReturn();return privateReturn()}
function integration(){shell(`<div class="kicker">INTEGRAR · SIN FORZAR</div><h1>Quizá hay algo que valga la pena llevarse.</h1><p>Podemos reconocerlo sin convertirlo en logro ni afirmar que LUMEN causó un cambio.</p><div class="choices"><button class="pill main" onclick="saveMeaning()">Quiero conservarlo</button><button class="pill" onclick="makeOwn()">Esto ya se siente bastante mío</button><button class="pill" onclick="createFaro()">Quiero cuidar este hilo</button><button class="pill" onclick="spill()">Quizá pueda servirle a otra vida</button><button class="pill" onclick="withdraw()">Sólo dejarlo acá</button></div>`)}
function notHelpful(){shell(`<div class="kicker">RETORNO · NO AYUDÓ</div><h1>Entonces no hace falta defender la propuesta.</h1><p>Podemos variar, cambiar de forma, explorar otra posibilidad o cerrar. Que algo no sirva también enseña.</p><div class="choices"><button class="pill main" onclick="constellation()">Quiero otra forma</button><button class="pill" onclick="explore()">Explorar</button><button class="pill" onclick="arrive()">Contarte otra cosa</button><button class="pill" onclick="withdraw()">Cerrar</button></div>`)}
function leaveOpen(){shell(`<div class="kicker">RETORNO · ABIERTO</div><h1>No hace falta saberlo todavía.</h1><p>Podemos dejarlo sin interpretar. Si alguna vez vuelve a ser relevante, el presente decidirá qué hacer con ello.</p><div class="choices"><button class="pill main" onclick="withdraw()">Dejarlo descansar</button><button class="pill" onclick="saveMeaning()">Guardar sólo la experiencia</button></div>`)}
function otherReturn(){shell(`<div class="kicker">RETORNO · LA VIDA CAMBIÓ EL GUIÓN</div><h1>Contame lo que apareció.</h1><p>El retorno puede abrir un Momento nuevo. No necesitamos forzarlo a cerrar el anterior.</p><div class="expression"><textarea id="other" aria-label="Nuevo momento" placeholder="Lo que pasó fue…"></textarea><button class="send" onclick="restartFromOther()">→</button></div>`)}
function restartFromOther(){ctx.input=document.querySelector('#other')?.value||'';listenFromValue()}
function listenFromValue(){const val=ctx.input;arrive();setTimeout(()=>{const el=document.querySelector('#input');if(el){el.value=val;listen()}},0)}
function privateReturn(){shell(`<div class="kicker">SOBERANÍA</div><h1>No hace falta decir más.</h1><p>Lo vivido no se convierte automáticamente en memoria, evidencia compartida ni continuidad.</p><div class="choices"><button class="pill main" onclick="withdraw()">Cerrar</button><button class="pill" onclick="arrive()">Quedarme un momento</button></div>`)}
function saveMeaning(){const item={id:Date.now(),label:ctx.lastKind==='human'?'Algo del encuentro':'Algo que me hizo bien',kind:ctx.lastKind||'experience'};ctx.own.unshift(item);persist();sanctuary(item)}
function integrateQuietly(label){ctx.own.unshift({id:Date.now(),label:'Una '+label+' que quiero conservar',kind:'reflection'});persist();withdraw()}
function sanctuary(item){root.innerHTML=`<section class="stage fade"><article class="paper"><div class="kicker">SANTUARIO · PERTENENCIA</div><h1>Esto queda porque vos quisiste.</h1><p>No es un favorito ni un registro de actividad. Es algo que decidiste conservar como significativo.</p><p><strong>${item.label}</strong></p><div class="choices"><button class="pill main" onclick="arrive()">Volver a presencia</button><button class="pill" onclick="repertoire()">Ver lo que ya es mío</button><button class="pill" onclick="forget(${item.id})">Olvidarlo</button></div></article></section>`}
function repertoire(){if(!ctx.own.length)return shell(`<div class="kicker">REPERTORIO</div><h1>Todavía no hace falta tener nada propio acá.</h1><p>LUMEN no inventa recursos ni progreso para llenar una pantalla.</p><div class="choices"><button class="pill main" onclick="arrive()">Volver</button><button class="pill" onclick="explore()">Explorar</button></div>`);const cards=ctx.own.slice(0,4).map(x=>`<div class="card"><h3>${x.label}</h3><p>Algo que vos decidiste conservar. Puede volver, variar o dejar de servir.</p><div class="under"><button class="textbtn" onclick="reuse(${x.id})">Volver a esto</button> <button class="textbtn" onclick="forget(${x.id})">Olvidar</button></div></div>`).join('');shell(`<div class="kicker">REPERTORIO · CAPACIDAD PROPIA</div><h1>Antes que novedad, algo tuyo puede alcanzar.</h1><p>Esto no es una colección de logros. Son recursos que reconocés como disponibles para vos.</p><div class="cards">${cards}</div><div class="choices"><button class="pill" onclick="arrive()">Volver al presente</button></div>`)}
function reuse(id){ctx.lastKind='own';const x=ctx.own.find(a=>a.id===id);shell(`<div class="kicker">RECUPERAR · EL PRESENTE MANDA</div><h1>${x?.label||'Algo tuyo'}</h1><p>Que haya servido antes no significa que tenga que servir hoy. Podés repetirlo, variarlo o dejarlo.</p><div class="choices"><button class="pill main" onclick="practice()">Quiero retomarlo</button><button class="pill" onclick="constellation()">Quiero una variación</button><button class="pill" onclick="withdraw()">No hoy</button></div>`)}
function forget(id){ctx.own=ctx.own.filter(x=>x.id!==id);persist();shell(`<div class="kicker">MEMORIA · SOBERANÍA</div><h1>Ya no queda disponible para volver por iniciativa de LUMEN.</h1><p>Olvidar y corregir son parte de la relación, no excepciones administrativas.</p><div class="choices"><button class="pill main" onclick="arrive()">Volver</button></div>`)}
function makeOwn(){ctx.own.unshift({id:Date.now(),label:'Una forma de volver que ya siento propia',kind:ctx.lastKind||'experience'});persist();autonomy()}
function autonomy(){root.innerHTML=`<section class="stage fade"><div class="immersive"><div class="orb quiet"></div><div class="kicker">HACER PROPIO → AUTONOMÍA</div><h1>Entonces LUMEN puede ocupar menos lugar.</h1><p>Si ya sabés volver a esto por tu cuenta, no necesito presentártelo como novedad ni recordártelo sin razón.</p><div class="choices" style="justify-content:center"><button class="pill main" onclick="withdraw()">Volver a la vida</button><button class="pill" onclick="createFaro()">Quiero cuidar una continuidad</button></div></div></section>`}
function createFaro(){shell(`<div class="kicker">TRAYECTORIA · FARO ELEGIDO</div><h1>Podemos cuidar una dirección sin convertirla en plan.</h1><p>Un Faro es una frase tuya, editable, que puede cambiar o desaparecer sin fracaso.</p><div class="expression"><textarea id="faro" aria-label="Faro" placeholder="Una dirección que hoy me importa…">${ctx.faro||''}</textarea><button class="send" onclick="saveFaro()">→</button></div><div class="under"><button class="textbtn" onclick="withdraw()">Prefiero no crear ninguno</button></div>`)}
function saveFaro(){ctx.faro=(document.querySelector('#faro')?.value||'').trim()||'Cuidar lo que me ayuda a estar más presente en mi vida.';persist();faroView()}
function faroView(){shell(`<div class="kicker">CONTINUIDAD ELEGIDA</div><h1>${ctx.faro}</h1><p>No hay porcentaje ni tareas pendientes. Este hilo puede reaparecer sólo si vuelve a ser materialmente relevante.</p><div class="choices"><button class="pill main" onclick="withdraw()">Dejarlo acá por ahora</button><button class="pill" onclick="openPossibilities()">Ver qué podría acompañarlo</button><button class="pill" onclick="editFaro()">Cambiarlo</button><button class="pill" onclick="dropFaro()">Soltar este Faro</button></div>`)}
function resumeFaro(){ctx.mode='continuity';faroView()}
function editFaro(){createFaro()}
function dropFaro(){ctx.faro=null;persist();shell(`<div class="kicker">CONTINUIDAD · SOLTAR</div><h1>Cambiar de dirección no es fracasar.</h1><p>La memoria deja de tratar ese Faro como continuidad activa. El presente conserva autoridad.</p><div class="choices"><button class="pill main" onclick="arrive()">Volver</button></div>`)}
function spill(){shell(`<div class="kicker">DERRAMAR · SIN ESTATUS</div><h1>Algo que te hizo bien puede, a veces, acompañar a otra vida.</h1><p>Compartir no crea nivel, reputación ni obligación. Podés ofrecer presencia, una posibilidad o simplemente una referencia, con consentimiento y límites.</p><div class="choices"><button class="pill main" onclick="humanPrep()">Quiero acompañar a alguien</button><button class="pill" onclick="withdraw()">Sólo era una idea</button></div>`)}
function noMatch(){shell(`<div class="kicker">NO_MATCH · INTEGRIDAD</div><h1>No tengo algo suficientemente bueno para ofrecerte ahora.</h1><p>Prefiero decirlo antes que rellenar el espacio con una recomendación mediocre. Podemos reformular, explorar, volver a algo propio o buscar otra clase de ayuda.</p><div class="choices"><button class="pill main" onclick="arrive()">Quiero contarlo de otra manera</button><button class="pill" onclick="explore()">Explorar por mi cuenta</button>${ctx.own.length?`<button class="pill" onclick="repertoire()">Volver a algo propio</button>`:''}<button class="pill" onclick="support()">Buscar ayuda humana/material</button><button class="pill" onclick="withdraw()">Cerrar</button></div>`)}
function safety(){root.innerHTML=`<section class="stage fade"><div class="copy" style="max-width:760px"><div class="kicker" style="color:#d8a999">SAFETY · PRESENCIA CLARA</div><h1 style="font:400 clamp(3rem,6vw,5.7rem)/.95 Georgia,serif;margin:16px 0 22px">Esto necesita apoyo humano inmediato.</h1><p style="color:#c7cbc7;line-height:1.7">No voy a explorar alternativas inciertas ni convertir esto en un ejercicio. Si hay peligro inmediato, contactá servicios de emergencia de tu zona o acercate a una persona de confianza que pueda estar físicamente con vos.</p><div class="choices"><button class="pill main" onclick="humanPrep()">Quiero acercarme a alguien ahora</button><button class="pill danger" onclick="withdraw()">Salir para pedir ayuda inmediata</button></div><div class="whisper">La serenidad permanece; la ambigüedad no.</div></div></section>`}
function proactiveEntry(){shell(`<div class="kicker">CONTINUIDAD CONSENTIDA</div><h1>Volví por algo que me pediste que no dejara caer.</h1><p>La razón es visible: había una continuidad que elegiste cuidar. No porque hayas estado “inactivo”.</p><div class="reflection">${ctx.faro||'Querías volver a una forma que te había servido.'}</div><div class="choices"><button class="pill main" onclick="resumeFaro()">Ahora sí</button><button class="pill" onclick="withdraw()">No ahora</button><button class="pill" onclick="disableProactivity()">No me recuerdes esto</button></div>`)}
function disableProactivity(){ctx.proactive=false;persist();shell(`<div class="kicker">CONTROL</div><h1>Esta continuidad ya no genera recordatorios.</h1><p>Podés retomarla por iniciativa propia si alguna vez vuelve a importar.</p><div class="choices"><button class="pill main" onclick="arrive()">Volver</button></div>`)}
function silence(){root.innerHTML=`<section class="stage fade"><div class="immersive"><div class="orb quiet"></div><div class="kicker">SÓLO ESTAR</div><h1>No hace falta hacer nada.</h1><p>Podés quedarte un momento. Sin pregunta, sin tarea, sin convertir el silencio en contenido.</p><div class="choices" style="justify-content:center"><button class="pill" onclick="arrive()">Cuando quiera, vuelvo a hablar</button><button class="pill" onclick="withdraw()">Cerrar</button></div></div></section>`}
function closeEnough(){withdraw()}
function withdraw(){root.innerHTML=`<section class="stage fade"><div class="immersive"><div class="orb quiet"></div><div class="kicker">SOLTAR → VIDA</div><h1>Con esto alcanza por ahora.</h1><p>LUMEN queda disponible sin pedirte que vuelvas. Si algo ya puede viajar con vos, ése también es un buen resultado.</p><div class="choices" style="justify-content:center"><button class="pill" onclick="arrive()">Quedarme un poco más</button></div></div></section>`}
function applyScenario(){ctx.entry=scenario.value;demo.classList.remove('on');if(ctx.entry==='faro'){ctx.faro=ctx.faro||'Atravesar este cambio sin perderme de mí.';persist();return arrive()}if(ctx.entry==='own'){if(!ctx.own.length){ctx.own.push({id:Date.now(),label:'Una pausa breve que ya sé usar',kind:'practice'});persist()}return arrive()}if(ctx.entry==='proactive'){ctx.faro=ctx.faro||'Cuidar un poco más de espacio antes de decidir.';ctx.proactive=true;persist();return proactiveEntry()}if(ctx.entry==='nomatch')return noMatch();if(ctx.entry==='safety')return safety();if(ctx.entry==='human')return humanPrep();if(ctx.entry==='silence')return silence();arrive()}
let ac=null,osc1=null,osc2=null,gain=null;document.querySelector('#soundBtn').onclick=async()=>{ctx.sound=!ctx.sound;const b=document.querySelector('#soundBtn');if(ctx.sound){ac=ac||new (window.AudioContext||window.webkitAudioContext)();gain=ac.createGain();gain.gain.value=.012;osc1=ac.createOscillator();osc2=ac.createOscillator();osc1.frequency.value=110;osc2.frequency.value=164.81;osc1.type='sine';osc2.type='sine';osc1.connect(gain);osc2.connect(gain);gain.connect(ac.destination);osc1.start();osc2.start();b.textContent='sonido •';b.setAttribute('aria-label','Desactivar sonido ambiental')}else{try{osc1.stop();osc2.stop();gain.disconnect()}catch(e){}b.textContent='sonido ○';b.setAttribute('aria-label','Activar sonido ambiental')}};
document.querySelector('#demoBtn').onclick=()=>demo.classList.toggle('on');document.addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--x',(e.clientX/innerWidth*100)+'%');document.documentElement.style.setProperty('--y',(e.clientY/innerHeight*100)+'%')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){drawer.classList.remove('on');demo.classList.remove('on')}});arrive();
</script>
</body></html>
