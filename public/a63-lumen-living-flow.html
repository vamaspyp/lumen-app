<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMEN · Living Flow</title><style>:root{--bg:#09110d;--fg:#f2f2ea;--mut:#8d9d92;--sage:#86aa8d}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}.world{min-height:100vh;background:radial-gradient(circle at 50% 25%,rgba(116,162,126,.14),transparent 31%),linear-gradient(180deg,#09110d,#101b14 65%,#09110d)}.top{position:fixed;z-index:30;left:26px;top:24px;font-size:.68rem;letter-spacing:.2em;color:#75877b}.sovereign{position:fixed;z-index:30;right:22px;top:18px;border:1px solid rgba(255,255,255,.1);background:rgba(9,17,13,.62);color:#9aaa9f;border-radius:999px;padding:9px 12px;backdrop-filter:blur(14px);cursor:pointer}.stage{min-height:100vh;display:grid;place-items:center;padding:80px 7vw;position:relative;transition:opacity .9s ease,transform .9s ease}.stage.hide{display:none}.field{width:min(1050px,100%);display:grid;grid-template-columns:1fr 1fr;gap:7vw;align-items:center}.presence{min-height:480px;display:grid;place-items:center;position:relative}.orb{width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 34% 27%,#f4faf3 0 4%,#c1d8c3 16%,#80a889 45%,#31543e 72%,#142a1c);box-shadow:0 0 0 30px rgba(190,224,195,.018),0 0 0 82px rgba(190,224,195,.012),0 0 150px rgba(119,177,132,.26);animation:breathe 8s ease-in-out infinite;transition:all 1.3s ease}.ring{position:absolute;width:410px;height:410px;border-radius:50%;border:1px solid rgba(200,225,205,.08);transition:all 1.2s}.copy{max-width:590px}.kicker{font-size:.67rem;letter-spacing:.19em;text-transform:uppercase;color:#82988a;font-weight:800}.copy h1{font:400 clamp(3.2rem,6vw,6.2rem)/.94 Georgia,serif;letter-spacing:-.055em;margin:15px 0 22px}.copy p{font-size:1.04rem;line-height:1.8;color:#98a79d;max-width:560px}.choices{display:flex;flex-wrap:wrap;gap:9px;margin-top:27px}.choice{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.045);color:#dce3de;border-radius:999px;padding:12px 16px;cursor:pointer;transition:.25s}.choice:hover{background:rgba(255,255,255,.09);transform:translateY(-1px)}.choice.main{background:#e9f0e8;color:#16221a;border-color:#e9f0e8;font-weight:750}.whisper{margin-top:20px;color:#65766b;font:italic 1rem Georgia,serif}.const{position:relative;width:500px;height:500px}.seed{position:absolute;width:165px;padding:14px 15px;border:1px solid rgba(255,255,255,.1);border-radius:22px;background:rgba(255,255,255,.045);backdrop-filter:blur(12px);color:#d7e0d9}.seed small{display:block;color:#7d8f83;margin-top:5px;line-height:1.35}.s1{left:0;top:55px}.s2{right:0;top:40px}.s3{right:5px;bottom:55px}.s4{left:0;bottom:45px}.const .orb{position:absolute;width:125px;height:125px;left:188px;top:188px}.thread{width:520px;max-width:100%;display:grid;gap:12px}.memory{padding:18px 20px;border-radius:24px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035);color:#cbd5ce}.memory span{display:block;color:#6f8275;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px}.memory strong{font:400 1.15rem Georgia,serif}.otherlives{width:470px;height:470px;position:relative;border-radius:50%;border:1px solid rgba(255,255,255,.07)}.life{position:absolute;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c9dacb,#55725d);box-shadow:0 0 45px rgba(121,169,132,.12)}.o1{top:25px;left:205px}.o2{right:42px;top:115px}.o3{right:75px;bottom:75px}.o4{left:75px;bottom:75px}.o5{left:42px;top:115px}.otherlives .orb{position:absolute;width:120px;height:120px;left:175px;top:175px;opacity:.75}.fadeOrb{opacity:.2!important;transform:scale(.72);box-shadow:0 0 60px rgba(119,177,132,.1)}.own{width:430px;height:430px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(134,170,141,.11),transparent 60%);position:relative}.own:before,.own:after{content:'';position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.07)}.own:before{inset:45px}.own:after{inset:105px}.own b{font:400 2rem Georgia,serif;color:#cad7cc;text-align:center;max-width:220px}.pulse{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:7px;z-index:20}.pulse i{width:5px;height:5px;border-radius:50%;background:#34463a;transition:.3s}.pulse i.on{background:#9cb8a2;box-shadow:0 0 12px #7ca087}.sensory{position:fixed;inset:0;pointer-events:none;opacity:.5;background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(157,202,166,.045),transparent 18%)}@keyframes breathe{50%{transform:scale(1.075);filter:brightness(1.07)}}@media(max-width:820px){.field{grid-template-columns:1fr}.presence{min-height:330px;order:-1}.orb{width:155px;height:155px}.ring{width:300px;height:300px}.const,.otherlives{transform:scale(.68);transform-origin:center;width:470px;height:470px}.copy h1{font-size:3.35rem}.stage{padding:78px 24px 55px}}@media(prefers-reduced-motion:reduce){.orb{animation:none}.stage,.orb,.ring{transition:none}}</style></head><body><main class="world"><div class="sensory"></div><div class="top">LUMEN · PRESENCIA</div><button class="sovereign" onclick="leave()">Salir cuando quieras</button><div id="root"></div><div class="pulse" id="pulse"></div></main><script>const states=[{k:'VIDA → PRESENCIA',h:'Estoy acá.',p:'No necesitás saber qué pedir. Podemos empezar por lo que está vivo ahora, o simplemente quedarnos un momento.',v:'orb',c:['Hay algo dando vueltas','Quiero continuar algo','Sólo quiero estar un momento'],w:'No hay apuro.'},{k:'ESCUCHAR → COMPRENDER',h:'Puedo intentar entender con vos.',p:'No para encerrarlo en una categoría. Sólo lo suficiente para distinguir qué necesita espacio, qué necesita claridad y qué quizá no necesita nada de LUMEN.',v:'orb',c:['Sí, reflejame lo que ves','Prefiero contarte un poco más','No quiero ponerle palabras'],w:'Si no sé, te lo voy a decir.'},{k:'ABRIR → POSIBILIDAD',h:'Hay más de una manera de estar con esto.',p:'LUMEN no abre un catálogo. Acerca un campo pequeño y diverso de posibilidades que podrían tener sentido ahora. También puede recuperar algo que ya es tuyo.',v:'const',c:['Acercame una posibilidad','Algo que ya conozco','Prefiero dejarlo acá'],w:'Vos seguís eligiendo.'},{k:'ACOMPAÑAR',h:'La forma cambia. La presencia permanece.',p:'Una posibilidad puede pedir comprensión, experiencia, acción, otra vida, continuidad o silencio. LUMEN ajusta cuánto aparece: puede estar presente, acompañar, sostener los bordes, quedar disponible o retirarse.',v:'orb',c:['Acompañame un poco','Quedate disponible','Esto lo vivo por mi cuenta'],w:'La pantalla no es el destino.'},{k:'CONECTAR',h:'A veces, Vida acompaña Vida.',p:'Otra persona o varias pueden entrar en la experiencia cuando eso tiene sentido y existe consentimiento. LUMEN prepara o cuida los bordes; no intenta reemplazar lo humano.',v:'lives',c:['Abrir a otra vida','Seguir conmigo','No ahora'],w:'Conectar no es volverse una red social.'},{k:'RETIRARSE → ESPERAR',h:'Ahora puede tocar vivir.',p:'LUMEN puede bajar completamente el volumen. No hay nada que completar, ni una pantalla a la que volver. La relación queda disponible sin perseguirte.',v:'fade',c:['Me voy a vivir esto','Quedate cerca','Cerrar por ahora'],w:'Retirarse también es acompañar.'},{k:'RECIBIR → RETORNO',h:'¿Qué pasó en la vida?',p:'Podés volver con una palabra, una sensación, una historia completa o nada claro todavía. Esto no es una evaluación.',v:'orb',c:['Algo me sirvió','Fue distinto de lo esperado','No sé todavía','No era para mí'],w:'Lo vivido vale más que completar un flujo.'},{k:'RECORDAR → PROFUNDIZAR',h:'Hay algo que quizá merece permanecer.',p:'Si vos querés, LUMEN puede reconocer una huella, relacionarla con algo anterior, ayudar a variarla o dejarla descansar. La memoria debe sentirse como cuidado, nunca vigilancia.',v:'memory',c:['Quiero recordarlo','Quiero hacerlo de otra manera','Dejarlo ir'],w:'Sólo permanece lo que tiene sentido para vos.'},{k:'GUARDAR → HACER PROPIO',h:'Esto puede dejar de ser de LUMEN.',p:'Algo vivido puede volverse una referencia íntima, una forma propia de volver, una continuidad elegida. No es un logro ni un punto: es algo que empieza a viajar con vos.',v:'own',c:['Hacerlo propio','Todavía no','Sólo guardarlo para mí'],w:'Pertenencia, no acumulación.'},{k:'SOLTAR → AUTONOMÍA → VIDA',h:'Entonces, LUMEN puede ocupar menos lugar.',p:'Si ya podés llevar algo con vos, no necesito recordártelo. Si volvés, acá estoy. Si no volvés, la Vida sigue siendo el centro.',v:'own',c:['Volver a la vida','Quedar en silencio'],w:'Menos dependencia también puede ser éxito.'}];let idx=0;const root=document.querySelector('#root'),pulse=document.querySelector('#pulse');pulse.innerHTML=states.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('');function visual(t){if(t==='const')return `<div class="const"><div class="seed s1">Comprender<small>dar sentido sin cerrar</small></div><div class="seed s2">Vivir<small>experimentar algo</small></div><div class="seed s3">Conectar<small>otra vida puede ayudar</small></div><div class="seed s4">Recordar<small>algo propio quizá alcance</small></div><div class="orb"></div></div>`;if(t==='lives')return `<div class="otherlives"><i class="life o1"></i><i class="life o2"></i><i class="life o3"></i><i class="life o4"></i><i class="life o5"></i><div class="orb"></div></div>`;if(t==='memory')return `<div class="thread"><div class="memory"><span>una huella</span><strong>“Esto me dio un poco más de espacio.”</strong></div><div class="memory"><span>algo anterior</span><strong>Ya habías encontrado una manera propia de volver.</strong></div><div class="memory"><span>posibilidad</span><strong>Podés retomarla, variarla o dejarla descansar.</strong></div></div>`;if(t==='own')return `<div class="own"><b>${idx===9?'La Vida sigue.':'Algo empieza a viajar con vos.'}</b></div>`;return `<div class="ring"></div><div class="orb ${t==='fade'?'fadeOrb':''}"></div>`}function render(){const s=states[idx];root.innerHTML=`<section class="stage"><div class="field"><div class="copy"><div class="kicker">${s.k}</div><h1>${s.h}</h1><p>${s.p}</p><div class="choices">${s.c.map((x,i)=>`<button class="choice ${i===0?'main':''}" onclick="next()">${x}</button>`).join('')}</div><div class="whisper">${s.w}</div></div><div class="presence">${visual(s.v)}</div></div></section>`;[...pulse.children].forEach((x,i)=>x.classList.toggle('on',i===idx));document.querySelector('.top').textContent='LUMEN · '+s.k}function next(){if(idx<states.length-1){idx++;render()}else leave()}function leave(){idx=9;render()}document.addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--x',(e.clientX/innerWidth*100)+'%');document.documentElement.style.setProperty('--y',(e.clientY/innerHeight*100)+'%')});render()</script></body></html>
