0 12px}.integrationCard p{color:#b9c1bf;line-height:1.6;margin-top:0}.integrationCard button{margin-top:auto;width:max-content}.closing{text-align:center;max-width:760px;margin:auto}.closing h2{font-family:Georgia,serif;font-size:clamp(3rem,7vw,6rem);font-weight:400;line-height:.98;margin:0}.closing p{color:#bac2c0;line-height:1.7;margin:24px auto 32px;max-width:610px}.continuityCue{margin:26px auto 0;max-width:560px;padding:16px 20px;border-top:1px solid rgba(255,255,255,.14);color:#aeb8b5;font-size:.9rem}

.drawer,.overlay{position:fixed;inset:0;z-index:30;pointer-events:none}.scrim{position:absolute;inset:0;background:rgba(5,10,14,.58);opacity:0;transition:.3s}.drawerPanel{position:absolute;top:0;right:0;width:min(440px,92vw);height:100%;background:#f3eee4;color:#26302d;padding:28px;transform:translateX(102%);transition:.45s var(--ease);overflow:auto}.drawer.open,.overlay.open{pointer-events:auto}.drawer.open .scrim,.overlay.open .scrim{opacity:1}.drawer.open .drawerPanel{transform:none}.drawer h2{font-family:Georgia,serif;font-size:2.5rem;font-weight:400;margin:18px 0 20px}.drawerItem{padding:16px 0;border-top:1px solid rgba(38,48,45,.12)}.drawerItem small{display:block;color:#767d78;margin-bottom:5px}.drawerLink{display:block;width:100%;text-align:left;background:none;border:0;color:#26302d;padding:13px 0;font-size:1rem}.overlayPanel{position:absolute;inset:5vh 5vw;background:#101c26;border:1px solid rgba(255,255,255,.12);border-radius:32px;transform:scale(.98);opacity:0;transition:.35s var(--ease);padding:28px;overflow:auto}.overlay.open .overlayPanel{opacity:1;transform:none}.closeX{float:right}.aboutGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}.aboutCell{padding:18px;border:1px solid rgba(255,255,255,.12);border-radius:20px}.aboutCell b{display:block;margin-bottom:6px}.aboutCell span{font-size:.9rem;color:#abb5b3;line-height:1.5}

<body>
<div id="app" class="app">
  <div class="shell">
    <header class="top">
      <button class="brand" onclick="go('arrival')" aria-label="Volver al inicio">LUMEN</button>
      <div class="topActions">
        <button class="iconbtn" onclick="toggleReview()" aria-label="Modo revisión" title="Modo revisión">◌</button>
        <button class="iconbtn" onclick="openDrawer()" aria-label="Abrir lo tuyo">⋯</button>
      </div>
    </header>
    <main id="stage" class="stage" aria-live="polite"></main>
    <footer class="bottom"><span class="presenceBadge" id="presenceBadge">P3 · dialogante</span><span>Una presencia para una vida en movimiento</span></footer>
  </div>
</div>
<div id="drawer" class="drawer" aria-hidden="true"><div class="scrim" onclick="closeDrawer()"></div><aside class="drawerPanel"><button class="iconbtn closeX" onclick="closeDrawer()" style="color:#26302d;border-color:rgba(38,48,45,.14)">×</button><div id="drawerContent"></div></aside></div>
<div id="about" class="overlay" aria-hidden="true"><div class="scrim" onclick="closeAbout()"></div><section class="overlayPanel"><button class="iconbtn closeX" onclick="closeAbout()">×</button><div id="aboutContent"></div></section></div>
<div id="toast" class="toast"></div><div class="reviewNote">Revisión A63 · V55 · los nombres internos aparecen sólo en modo revisión</div>
<script>
const possibilities=[
{id:'reading',arq:'01',kind:'Saber',title:'Lo que depende de vos',subtitle:'Una distinción antigua para recuperar margen de acción.',meta:['lectura contemplativa','5 min','energía baja/media'],why:'Puede ayudarte a separar lo que merece tu acción de lo que hoy no está enteramente en tus manos.',mode:'reading'},
{id:'ground',arq:'02',kind:'Práctica',title:'Volver al suelo',subtitle:'Cuatro minutos para recuperar contacto con el cuerpo y el entorno.',meta:['audio opcional','4 min','pantalla prescindible'],why:'Cuando la cabeza está saturada, quizá no haga falta pensar mejor todavía, sino recuperar un poco de suelo.',mode:'practice'},
{id:'peer',arq:'03',kind:'Otra vida',title:'Hablar con alguien que ya atravesó algo parecido',subtitle:'Experiencia vivida antes que otro artículo.',meta:['1:1','25 min','peer support'],why:'Hay momentos en los que una perspectiva humana reconocible puede ser más valiosa que más información.',mode:'human'},
{id:'pro',arq:'04',kind:'Ayuda competente',title:'Tal vez esto merece una consulta profesional',subtitle:'Una puerta clara cuando una microayuda no alcanza.',meta:['referral','credenciales','límites visibles'],why:'Pedir ayuda competente también puede ser una forma concreta de recuperar margen de acción.',mode:'professional'},
{id:'circle',arq:'05',kind:'Círculo',title:'Un círculo pequeño para atravesar una transición',subtitle:'Un espacio finito para escuchar y hablar si se quiere.',meta:['6 personas','75 min','3 encuentros'],why:'A veces lo que ayuda no es una respuesta, sino atravesar algo junto a otras vidas.',mode:'circle'},
{id:'horizon',arq:'06',kind:'Experiencia',title:'Recuperar horizonte',subtitle:'Una experiencia que empieza acá y después saca a LUMEN del medio.',meta:['fuera de pantalla','20 min','entorno real'],why:'Quizá algo cambie de tamaño cuando el cuerpo y la mirada vuelven a encontrarse con el mundo.',mode:'outside'},
{id:'material',arq:'07',kind:'Puerta al mundo',title:'Una puerta concreta para volver a moverte',subtitle:'Cuando la palanca principal está afuera, Fuente abre una puerta afuera.',meta:['recurso real','acceso','vigencia'],why:'No todo necesita introspección. Algunas veces la ayuda correcta es material, práctica y externa.',mode:'resource'},
{id:'path',arq:'08',kind:'Camino',title:'Siete días para ordenar una decisión difícil',subtitle:'Una composición editable, no un curso ni una racha.',meta:['7 días','editable','sin obligación'],why:'Una decisión difícil puede necesitar tiempo, perspectivas distintas y un pequeño experimento reversible.',mode:'path'}
];
const state={scene:'arrival',expression:'',intent:'',selected:'ground',step:0,outcome:'',reflection:'',review:false,saved:JSON.parse(localStorage.getItem('lumenSaved')||'[]'),own:JSON.parse(localStorage.getItem('lumenOwn')||'[]'),continuity:JSON.parse(localStorage.getItem('lumenContinuity')||'null')};
const stage=document.getElementById('stage'),app=document.getElementById('app');
function p(){return possibilities.find(x=>x.id===state.selected)||possibilities[1]}
function setPresence(mode){document.getElementById('presenceBadge').textContent=mode}
function go(scene){state.scene=scene;state.step=0;render();window.scrollTo({top:0,behavior:'smooth'})}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){app.classList.toggle('paper',false);app.classList.toggle('review',state.review);const fn=views[state.scene]||views.arrival;stage.innerHTML=`<div class="scene">${fn()}</div>`;bindScene();}
function bindScene(){if(state.scene==='arrival'){const t=document.getElementById('lifeInput');if(t){t.value=state.expression;t.focus();t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitLife()}})}}if(state.scene==='return'){const r=document.getElementById('reflection');if(r){r.value=state.reflection;r.oninput=e=>state.reflection=e.target.value}}}
const views={
arrival:()=>{setPresence('P3 · dialogante');const cue=state.continuity?`<div class="continuityCue">La última vez quedó algo abierto: <b>${esc(state.continuity.title)}</b>. <button class="soft" onclick="resumeContinuity()">Retomarlo</button></div>`:'';return `<div class="arrival"><div><div class="kicker">Estás acá</div><h1 class="display">Podés llegar<br>como estás.</h1><p class="lede">Contame lo que está pasando, o simplemente explorá. No hace falta convertirlo en un problema ni saber qué necesitás.</p><div class="expression"><textarea id="lifeInput" rows="1" aria-label="Contame lo que está pasando" placeholder="Contame lo que te pasa..."></textarea><button class="send" onclick="submitLife()" aria-label="Enviar">→</button></div><div class="softdoors"><button class="soft" onclick="door('calm')">Necesito bajar un cambio</button><button class="soft" onclick="door('decision')">Estoy pensando una decisión</button><button class="soft" onclick="go('explore')">Quiero explorar</button></div>${cue}</div><div class="orbWrap"><div class="orb" aria-hidden="true"></div></div></div>`},
understand:()=>{setPresence('P3 · dialogante');const x=esc(state.expression||'Hay algo que querés mirar con un poco más de espacio.');return `<div class="flow"><div class="kicker">Te escucho</div><p class="lumiLine">Suena a que hay algo importante ocupando bastante lugar ahora.</p><div class="reflection">“${x}”</div><p class="lede">No necesito entenderlo todo. Sólo lo suficiente para acercarte algo que tenga sentido.</p><div class="choices"><button class="choice" onclick="understood('calm')">Quiero bajar un poco el ruido</button><button class="choice" onclick="understood('clarity')">Quiero verlo más claro</button><button class="choice" onclick="understood('human')">Me vendría bien alguien</button><button class="choice" onclick="go('explore')">Prefiero explorar</button></div></div>`},
possibility:()=>{setPresence('P2 · facilitadora');const q=p();return `<div class="possibility"><section class="possibilityPanel"><div class="kicker">Una posibilidad</div><h2>${q.title}</h2><p class="lede">${q.subtitle}</p><div class="meta">${q.meta.map(m=>`<span>${m}</span>`).join('')}</div><div class="why"><b>Por qué aparece ahora</b><br>${q.why}</div><div class="choices"><button class="primary" onclick="startExperience()">Quiero probarlo</button><button class="secondary" onclick="nextPossibility()">Prefiero otra cosa</button><button class="secondary" onclick="go('explore')">Abrir posibilidades</button></div></section><aside class="constellationMini" aria-label="Otras posibilidades relacionadas"><span class="miniNode">otra mirada</span><span class="miniNode">algo humano</span><span class="miniNode">más breve</span><span class="miniNode">salir al mundo</span></aside></div>`},
explore:()=>{setPresence('P1 · ambiental');const q=p();return `<div class="explore"><div class="exploreHead"><div><div class="kicker">Posibilidades</div><h1 class="display small">No un catálogo.<br>Un campo para tu vida.</h1></div><p class="lede">Saberes, prácticas, personas, ayuda profesional, grupos, lugares, recursos y caminos. Elegí por curiosidad; no necesitás encasillarte.</p></div><div class="exploreGrid"><div class="constellation"><div class="centerNode">¿Qué podría<br>sumar ahora?</div>${possibilities.map((x,i)=>`<button class="node n${i+1} ${x.id===q.id?'active':''}" onclick="selectPossibility('${x.id}')"><b>${x.title}</b><small>${x.kind}</small></button>`).join('')}</div><aside class="detailPane"><div class="kicker">${q.kind} · ${q.arq}/08</div><h3>${q.title}</h3><p>${q.subtitle}</p><div class="meta">${q.meta.map(m=>`<span>${m}</span>`).join('')}</div><p><b>Puede tener sentido si...</b><br>${q.why}</p><div class="detailActions"><button class="primary" onclick="startExperience()">${q.mode==='human'||q.mode==='professional'||q.mode==='circle'?'Ver cómo sería':'Vivirlo'}</button><button class="secondary" onclick="go('arrival')">Volver a lo mío</button></div></aside></div></div>`},
experience:()=>experienceView(),
return:()=>{setPresence('P4 · presencia plena');return `<div class="returnScene"><div class="kicker">Volver</div><h2>¿Cómo volvés?</h2><p class="lede" style="margin-left:auto;margin-right:auto">No hace falta explicarlo demasiado. Una señal alcanza.</p><div class="choices"><button class="choice" onclick="outcome('helped')">Me sirvió</button><button class="choice" onclick="outcome('some')">Un poco</button><button class="choice" onclick="outcome('different')">Pasó otra cosa</button><button class="choice" onclick="outcome('no')">No me sirvió</button><button class="choice" onclick="outcome('unknown')">Todavía no sé</button></div><textarea id="reflection" class="reflectionInput" rows="3" placeholder="Si querés, dejá algo en palabras. También podés no hacerlo."></textarea><div class="choices"><button class="secondary" onclick="outcome('skip')">Prefiero no ponerle palabras</button></div></div>`},
integrate:()=>{setPresence('P2 · facilitadora');const q=p();return `<div><div class="flow" style="text-align:center;margin-bottom:34px"><div class="kicker">Lo que queda</div><p class="lumiLine">¿Hay algo de esto que quieras llevarte?</p></div><div class="integration"><article class="integrationCard"><h3>Guardarlo</h3><p>Conservar esta posibilidad y tu retorno como algo significativo. Queda bajo tu decisión y podés borrarlo cuando quieras.</p><button class="secondary" onclick="saveItem()">Lo guardo</button></article><article class="integrationCard"><h3>Hacerlo propio</h3><p>Reconocerlo como algo a lo que sabés que podés volver. Sin puntos, niveles ni obligación de repetir.</p><button class="secondary" onclick="makeOwn()">Me puede servir otra vez</button></article><article class="integrationCard"><h3>Dejar una continuidad</h3><p>Que LUMEN pueda traerlo de nuevo si más adelante resulta pertinente. No es un pendiente.</p><button class="secondary" onclick="setContinuity()">Quizá más adelante</button></article><article class="integrationCard"><h3>Soltar</h3><p>No todo necesita quedar registrado. También puede terminar acá.</p><button class="primary" onclick="go('close')">Con esto alcanza</button></article></div></div>`},
close:()=>{setPresence('P0 · retirada');return `<div class="closing"><div class="kicker">LUMEN se retira</div><h2>Con esto<br>alcanza por ahora.</h2><p>Lo importante no es que te quedes acá. Es que algo de lo vivido pueda viajar con vos, si te sirve.</p><button class="primary" onclick="backToLife()">Volver a mi vida</button>${state.continuity?`<div class="continuityCue">Si volvés, puedo recordar esta continuidad porque la elegiste vos. Podés quitarla en cualquier momento.</div>`:''}</div>`}
};
function experienceView(){setPresence('P0/P1 · retirada');const q=p();if(q.mode==='practice')return practiceView();if(q.mode==='reading')return readingView();if(q.mode==='outside')return outsideView();if(q.mode==='human')return humanView();if(q.mode==='professional')return professionalView();if(q.mode==='circle')return circleView();if(q.mode==='resource')return resourceView();if(q.mode==='path')return pathView();return practiceView()}
function practiceView(){const steps=['Notá tres apoyos físicos. No cambies nada todavía.','Orientá la mirada hacia tres puntos del entorno.','Escuchá dos sonidos sin interpretarlos.','Elegí una sola acción pequeña para después.'];const i=Math.min(state.step,steps.length-1);return `<div class="immersive"><div class="orb"></div><div class="kicker">Volver al suelo</div><p class="stepText">${steps[i]}</p><p class="quietNote">No hace falta estar en calma. Alcanza con saber un poco mejor dónde estás.</p><div class="progress"><i style="width:${((i+1)/steps.length)*100}%"></i></div><div class="immersiveActions"><button class="secondary" onclick="speak('${esc(steps[i])}')">Escucharlo</button>${i<steps.length-1?`<button class="primary" onclick="nextStep()">Seguir</button>`:`<button class="primary" onclick="finishExperience()">Volver</button>`}<button class="secondary" onclick="finishExperience()">Terminar acá</button></div></div>`}
function readingView(){return `<div class="immersive"><div class="kicker">Lectura contemplativa</div><p class="stepText">Hay cosas que dependen de vos. Otras no.</p><div class="experienceBody paperlike"><h4>Una distinción para este momento</h4><p>No necesitás abandonar lo que importa. Podés mirar con más precisión dónde existe margen de acción y dónde sólo existe desgaste por intentar controlar lo que hoy no está en tus manos.</p><p><b>Una pregunta:</b> ¿Cuál es la parte más pequeña y verdadera de esto que sí está en tus manos hoy?</p><p><small>Raíz: tradición estoica / Epicteto. Adaptación práctica original de LUMEN; no presentada como traducción.</small></p></div><div class="immersiveActions"><button class="primary" onclick="finishExperience()">Volver</button><button class="secondary" onclick="speak('¿Cuál es la parte más pequeña y verdadera de esto que sí está en tus manos hoy?')">Escuchar la pregunta</button></div></div>`}
function outsideView(){const steps=['Elegí un lugar cercano, seguro y accesible —o una ventana.','Mirá algo más lejano de lo habitual.','Dejá que algo del entorno te sorprenda sin buscarlo.','Notá qué problema sigue igual y cuál cambió un poco de tamaño.'];const i=Math.min(state.step,3);return `<div class="immersive"><div class="orb"></div><div class="kicker">Fuera de pantalla</div><p class="stepText">${steps[i]}</p><p class="quietNote">LUMEN puede quedarse en silencio. La experiencia ocurre afuera.</p><div class="progress"><i style="width:${(i+1)*25}%"></i></div><div class="immersiveActions">${i<3?`<button class="primary" onclick="nextStep()">Siguiente</button>`:`<button class="primary" onclick="finishExperience()">Volví</button>`}<button class="secondary" onclick="finishExperience()">Cerrar LUMEN y hacerlo por mi cuenta</button></div></div>`}
function humanView(){return `<div class="immersive"><div class="kicker">Otra vida</div><p class="stepText">A veces no hace falta otra respuesta. Hace falta alguien.</p><div class="experienceBody"><h4>Cómo sería</h4><p>Una conversación breve con una persona cuya experiencia vivida sea pertinente. Identidad y experiencia verificadas, propósito claro, límites visibles y libertad de terminar.</p><p>Escuchar primero. Compartir experiencia sólo cuando suma. Sin diagnosticar, prescribir ni ocupar el lugar de un profesional.</p><p><small>Este prototipo no inventa una persona ni simula una reserva real.</small></p></div><div class="immersiveActions"><button class="primary" onclick="finishExperience()">Esto podría servirme</button><button class="secondary" onclick="selectPossibility('pro');go('experience')">Prefiero ayuda profesional</button></div></div>`}
function professionalView(){return `<div class="immersive"><div class="kicker">Ayuda competente</div><p class="stepText">Tal vez esto merece una conversación profesional.</p><div class="experienceBody"><h4>Qué debería mostrar LUMEN</h4><p>Tipo de profesional pertinente, por qué podría ayudar, cómo verificar credenciales, qué esperar del primer contacto, modalidad, territorio, costo y disponibilidad cuando exista un proveedor real.</p><p>LUMEN no diagnostica para derivar y nunca rellena este espacio con una recomendación mediocre.</p><p><small>En el Embrión real, safety y territorio gobiernan esta salida.</small></p></div><div class="immersiveActions"><button class="primary" onclick="finishExperience()">Entiendo la opción</button><button class="secondary" onclick="go('explore')">Ver otra cosa</button></div></div>`}
function circleView(){return `<div class="immersive"><div class="kicker">Otras vidas</div><p class="stepText">Un espacio pequeño. Finito. Sin feed.</p><div class="experienceBody"><h4>Un círculo para atravesar una transición</h4><p>Seis personas. Tres encuentros. Llegada y acuerdo de cuidado → ronda breve sin obligación de hablar → conversación facilitada → cierre.</p><p>La ficha real declara quién facilita, reglas, privacidad, retención, reporte y salida.</p><p><small>Este prototipo no convoca un grupo real.</small></p></div><div class="immersiveActions"><button class="primary" onclick="finishExperience()">Lo tendría en cuenta</button><button class="secondary" onclick="go('explore')">Otra posibilidad</button></div></div>`}
function resourceView(){return `<div class="immersive"><div class="kicker">Puerta al mundo</div><p class="stepText">No todo se resuelve mirando hacia adentro.</p><div class="experienceBody"><h4>Cuando la palanca está afuera</h4><p>LUMEN puede acercar un recurso público, material u oportunidad concreta con procedencia, territorio, condiciones y vigencia visibles.</p><p>Si no aplica a tu situación, debe ofrecer una alternativa honesta o NO_MATCH. No convierte un enlace en una recomendación universal.</p></div><div class="immersiveActions"><button class="primary" onclick="finishExperience()">Volver</button><button class="secondary" onclick="go('explore')">Buscar otra puerta</button></div></div>`}
function pathView(){return `<div class="immersive"><div class="kicker">Camino editable</div><p class="stepText">Siete días para ordenar una decisión difícil.</p><div class="experienceBody"><p>No es un programa ni una racha. Podés mover, saltear o terminar cualquier parte.</p><div class="dayRow"><div class="day"><b>1</b><br>Qué importa</div><div class="day"><b>2</b><br>Hechos / miedos</div><div class="day"><b>3</b><br>Agencia</div><div class="day"><b>4</b><br>Otra mirada</div><div class="day"><b>5</b><br>Probar</div><div class="day"><b>6</b><br>Reposar</div><div class="day"><b>7</b><br>Revisar</div></div></div><div class="immersiveActions"><button class="primary" onclick="setContinuity();finishExperience()">Podría probar este camino</button><button class="secondary" onclick="finishExperience()">No ahora</button></div></div>`}
function submitLife(){const t=document.getElementById('lifeInput');state.expression=(t?.value||'').trim();if(!state.expression){toast('Podés escribir algo o elegir una puerta suave.');return}go('understand')}
function door(x){state.expression=x==='calm'?'Vengo con bastante ruido y necesito bajar un cambio.':'Estoy pensando una decisión y no termino de verla clara.';go('understand')}
function understood(x){state.intent=x;state.selected=x==='calm'?'ground':x==='clarity'?'reading':'peer';go('possibility')}
function nextPossibility(){const i=possibilities.findIndex(x=>x.id===state.selected);state.selected=possibilities[(i+1)%possibilities.length].id;render()}
function selectPossibility(id){state.selected=id;render()}
function startExperience(){state.step=0;go('experience')}
function nextStep(){state.step++;render()}
function finishExperience(){go('return')}
function outcome(x){state.outcome=x;go('integrate')}
function saveItem(){const q=p();if(!state.saved.some(x=>x.id===q.id))state.saved.push({id:q.id,title:q.title,reflection:state.reflection,outcome:state.outcome,at:new Date().toISOString()});localStorage.setItem('lumenSaved',JSON.stringify(state.saved));toast('Quedó guardado para vos.')}
function makeOwn(){const q=p();if(!state.own.some(x=>x.id===q.id))state.own.push({id:q.id,title:q.title,at:new Date().toISOString()});localStorage.setItem('lumenOwn',JSON.stringify(state.own));toast('Lo reconocí como algo a lo que podés volver.')}
function setContinuity(){const q=p();state.continuity={id:q.id,title:q.title};localStorage.setItem('lumenContinuity',JSON.stringify(state.continuity));toast('Queda como continuidad elegida, no como pendiente.')}
function resumeContinuity(){if(state.continuity){state.selected=state.continuity.id;go('possibility')}}
function backToLife(){state.expression='';state.intent='';state.outcome='';state.reflection='';go('arrival')}
function speak(text){if(!('speechSynthesis'in window)){toast('La voz no está disponible en este navegador.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/&#039;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,'&'));u.lang='es-AR';u.rate=.88;u.pitch=.95;speechSynthesis.speak(u)}
function toggleReview(){state.review=!state.review;render();toast(state.review?'Modo revisión: ON':'Modo revisión: OFF')}
function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('drawer').setAttribute('aria-hidden','false');renderDrawer()}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawer').setAttribute('aria-hidden','true')}
function renderDrawer(){const saved=state.saved.length?state.saved.map(x=>`<div class="drawerItem"><small>Guardado</small><b>${esc(x.title)}</b>${x.reflection?`<p>${esc(x.reflection)}</p>`:''}<button class="drawerLink" onclick="removeSaved('${x.id}')">Quitar</button></div>`).join(''):'<div class="drawerItem">Todavía no guardaste nada. Está bien que sea así.</div>';const own=state.own.length?state.own.map(x=>`<div class="drawerItem"><small>Algo que ya reconocés como propio</small><b>${esc(x.title)}</b></div>`).join(''):'<div class="drawerItem">Tu repertorio puede empezar vacío.</div>';document.getElementById('drawerContent').innerHTML=`<div class="kicker" style="color:#7b827d">Lo tuyo</div><h2>Un lugar propio, no un historial.</h2><button class="drawerLink" onclick="closeDrawer();go('explore')">Explorar posibilidades →</button><button class="drawerLink" onclick="closeDrawer();openAbout()">Cómo está construido este prototipo →</button><h3 style="margin-top:28px">Guardado</h3>${saved}<h3 style="margin-top:28px">Ya sé que me puede servir</h3>${own}${state.continuity?`<h3 style="margin-top:28px">Continuidad elegida</h3><div class="drawerItem"><b>${esc(state.continuity.title)}</b><button class="drawerLink" onclick="clearContinuity()">Quitar continuidad</button></div>`:''}`}
function removeSaved(id){state.saved=state.saved.filter(x=>x.id!==id);localStorage.setItem('lumenSaved',JSON.stringify(state.saved));renderDrawer()}
function clearContinuity(){state.continuity=null;localStorage.removeItem('lumenContinuity');renderDrawer();toast('La continuidad fue quitada.')}
function openAbout(){document.getElementById('about').classList.add('open');document.getElementById('about').setAttribute('aria-hidden','false');document.getElementById('aboutContent').innerHTML=`<div class="kicker">A63 · V55 · mockup de revisión</div><h1 class="display small">Experience & Sensation Field</h1><p class="lede">Este prototipo materializa una sola presencia continua. Los órganos operan por debajo; la persona no necesita navegar la anatomía de LUMEN.</p><div class="aboutGrid"><div class="aboutCell"><b>Presencia</b><span>P0–P4: LUMI sube o baja intensidad según lo que agrega valor.</span></div><div class="aboutCell"><b>Espacio</b><span>Una intención humana y un foco dominante por escena.</span></div><div class="aboutCell"><b>Tiempo</b><span>Aparición, pausa, transición, retirada y retorno.</span></div><div class="aboutCell"><b>Materia</b><span>Luz, profundidad, tactilidad y aire como identidad perceptual.</span></div><div class="aboutCell"><b>Interacción</b><span>Libertad de expresar, elegir, variar, salir y no completar.</span></div><div class="aboutCell"><b>Significado</b><span>Qué es, por qué ahora, qué pide, procedencia y salida por progressive disclosure.</span></div><div class="aboutCell"><b>Continuidad</b><span>Recordar sólo por valor y permiso; nunca fabricar obligaciones.</span></div><div class="aboutCell"><b>Retiro</b><span>Cuando la vida o otra persona lidera, LUMEN se corre.</span></div><div class="aboutCell"><b>Autonomía</b><span>Menor dependencia puede ser una señal de éxito.</span></div></div>`}
function closeAbout(){document.getElementById('about').classList.remove('open');document.getElementById('about').setAttribute('aria-hidden','true')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2400)}
render();
</script>
</body>
</html>
