<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUMEN · Experience Field V1.6</title>
<style>
:root{--fg:#f4f1e9;--mut:#93a49a;--line:rgba(244,241,233,.13);--soft:rgba(255,255,255,.045);--glow:#9ebba1;--paper:#ebe4d7;--ink:#17241d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07110d;color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}
button{cursor:pointer}.world{min-height:100vh;padding:22px;overflow:hidden;background:radial-gradient(circle at 73% 18%,rgba(225,191,128,.10),transparent 26%),radial-gradient(circle at 14% 50%,rgba(105,165,125,.14),transparent 36%),linear-gradient(150deg,#07110d,#102019 56%,#15261e);transition:background 1.1s ease}.top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:5}.brand{font-size:.67rem;letter-spacing:.22em;text-transform:uppercase;color:#83968b}.toptools{display:flex;gap:8px}.iconbtn,.pill,.navitem{border:1px solid var(--line);background:var(--soft);color:#dce3de;border-radius:999px}.iconbtn{width:40px;height:40px;padding:0;display:grid;place-items:center}.iconbtn:hover,.pill:hover,.navitem:hover,.card:hover{border-color:rgba(244,241,233,.28);background:rgba(255,255,255,.065)}.stage{min-height:calc(100vh - 84px);display:grid;place-items:center}.field{width:min(1120px,100%);display:grid;grid-template-columns:1.1fr .78fr;gap:7vw;align-items:center}.copy{max-width:700px}.eyebrow{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:#83968b}.copy h1,.space h1{font:400 clamp(3.2rem,6.4vw,6.5rem)/.94 Georgia,"Times New Roman",serif;letter-spacing:-.047em;margin:12px 0 24px}.entry{position:relative;margin-top:26px}.entry textarea{width:100%;min-height:78px;resize:none;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.035);color:#f4f1e9;border-radius:24px;padding:22px 58px 20px 20px;outline:none}.entry textarea:focus{border-color:rgba(235,228,215,.36);box-shadow:0 0 0 4px rgba(235,228,215,.035)}.send{position:absolute;right:13px;top:18px;width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:#a7b5ad;font-size:1.35rem}.row{display:flex;gap:11px;flex-wrap:wrap;margin-top:17px}.pill{padding:11px 17px}.pill.main{background:var(--paper);color:var(--ink);font-weight:650;border-color:transparent}.pill.quiet{opacity:.58}.orbspace{min-height:390px;display:grid;place-items:center;position:relative}.orb{width:164px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 27%,#fbfcf7 0 3%,#ccdcca 14%,#89ad90 42%,#3d6247 69%,#13291c);box-shadow:0 0 130px rgba(132,183,143,.20);animation:breathe 8s ease-in-out infinite}.orb.small{width:72px;opacity:.7;box-shadow:0 0 65px rgba(132,183,143,.16)}.presence{position:absolute;bottom:35px;color:#81958a;font-size:.78rem;letter-spacing:.11em}.presence:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#a5c5aa;box-shadow:0 0 14px #8fb496;margin-right:9px}@keyframes breathe{50%{transform:scale(1.045);filter:brightness(1.06)}}.dock{display:flex;gap:9px;flex-wrap:wrap;margin-top:34px}.navitem{padding:10px 15px;display:flex;gap:9px;align-items:center}.navitem span{opacity:.72}.space{width:min(1080px,100%)}.spacehead{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.space h1{font-size:clamp(3rem,5vw,5.2rem);max-width:800px;margin-bottom:12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:34px}.card{border:1px solid var(--line);background:var(--soft);border-radius:28px;padding:24px;min-height:180px;text-align:left;color:inherit;transition:.2s ease}.card small{font-size:.66rem;letter-spacing:.11em;color:#7f9387}.card h3{font:400 1.52rem Georgia,serif;margin:12px 0 0;line-height:1.15}.card p{display:none;color:#92a399;line-height:1.55;font-size:.91rem;margin:14px 0 0}.space.revealed .card p{display:block}.subbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.subbar .pill{font-size:.9rem}.introLayer{position:fixed;inset:0;background:rgba(4,10,7,.54);backdrop-filter:blur(14px);display:none;place-items:center;padding:22px;z-index:20}.introLayer.on{display:grid}.introCard{width:min(680px,100%);border:1px solid rgba(255,255,255,.13);border-radius:34px;background:linear-gradient(145deg,rgba(16,31,24,.96),rgba(12,24,18,.98));box-shadow:0 30px 120px rgba(0,0,0,.38);padding:34px}.introOrb{width:42px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#abc1ad 22%,#4e7457 65%,#183021);box-shadow:0 0 45px rgba(143,185,151,.28);margin-bottom:26px}.introCard h2{font:400 clamp(2.4rem,5vw,4.1rem)/1 Georgia,serif;letter-spacing:-.035em;margin:0 0 18px}.introCard p{color:#a6b3ab;line-height:1.75;font-size:1.04rem;margin:0}.introActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.fade{animation:fade .48s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}}.hint{color:#7f9187;font-size:.85rem;margin-top:20px}.searchline{display:flex;gap:10px;margin-top:24px}.searchline input{flex:1;border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:999px;padding:13px 17px;outline:none}.searchline input:focus{border-color:rgba(244,241,233,.28)}
@media(max-width:820px){.world{padding:18px}.field{grid-template-columns:1fr}.orbspace{min-height:210px;order:-1}.orb{width:118px}.presence{bottom:8px}.copy h1{font-size:3.55rem}.cards{grid-template-columns:1fr}.spacehead{align-items:center}.space h1{font-size:3.4rem}.dock{margin-top:24px}.navitem{flex:1;justify-content:center;min-width:42%}.introCard{padding:28px 24px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="world" id="world">
<header class="top"><div class="brand">LUMEN · PRESENCIA</div><div class="toptools"><button class="iconbtn" aria-label="Conocer este espacio" onclick="introduceCurrent()">?</button><button class="iconbtn" aria-label="Volver al inicio" onclick="home()">⌂</button></div></header>
<div class="stage" id="root"></div>
</main>
<div class="introLayer" id="introLayer" role="dialog" aria-modal="true"><div class="introCard"><div class="introOrb"></div><div class="eyebrow" id="introEyebrow">LUMEN</div><h2 id="introTitle"></h2><p id="introText"></p><div class="introActions"><button class="pill main" onclick="closeIntro()">Seguir</button><button class="pill" id="moreBtn" onclick="toggleMore()">Quiero saber más</button></div><p class="hint" id="introMore" hidden></p></div></div>
<script>
const r=document.querySelector('#root'),w=document.querySelector('#world');let current='home';
const intros={
home:{eyebrow:'Hola. Soy LUMEN.',title:'Estoy para acompañar vida, no para ocuparla.',text:'Podés venir con algo que te pasa, explorar por curiosidad o simplemente quedarte un momento. No necesitás aprender cómo funciono para empezar.',more:'Con el tiempo puedo ayudarte a relacionar momentos, posibilidades, personas y cosas que elegís conservar. Voy mostrando profundidad sólo cuando tiene sentido para vos.'},
source:{eyebrow:'LUMEN · Fuente',title:'Acá viven posibilidades.',text:'Ideas, prácticas, experiencias y saberes de distintas procedencias. No necesitás saber qué buscar: podés seguir aquello que te dé curiosidad.',more:'La Fuente no es un catálogo. Las posibilidades pueden relacionarse por sentido, contraste, contexto, duración, forma de vivirlas o cercanía con tu momento.'},
mine:{eyebrow:'LUMEN · Mi vida',title:'Lo que importa para vos puede tener continuidad.',text:'Acá podés reencontrar direcciones, prácticas, hilos y cosas propias que elegiste conservar.',more:'No intento congelarte en un perfil. Lo que está acá puede cambiar, descansar, relacionarse con algo nuevo o desaparecer cuando ya no te represente.'},
sanctuary:{eyebrow:'LUMEN · Santuario',title:'Un lugar para lo que merece cuidado.',text:'Reflexiones, recuerdos o hallazgos que elegiste guardar. Nada entra acá sólo porque pasó.',more:'El Santuario busca preservar intimidad y significado, no construir un historial exhaustivo de tu vida.'},
people:{eyebrow:'LUMEN · Personas',title:'A veces, la mejor posibilidad es otra vida.',text:'Acá podés acercarte a personas, círculos o ayuda preparada cuando lo humano agrega algo que una pantalla no puede dar.',more:'El contexto, los límites, el consentimiento y la salida importan más que la popularidad. LUMEN sostiene bordes y después puede retirarse.'}
};
function set(html){r.innerHTML=html;r.firstElementChild?.classList.add('fade')}
function tone(t='base'){const b={base:'radial-gradient(circle at 73% 18%,rgba(225,191,128,.10),transparent 26%),radial-gradient(circle at 14% 50%,rgba(105,165,125,.14),transparent 36%),linear-gradient(150deg,#07110d,#102019 56%,#15261e)',source:'radial-gradient(circle at 74% 16%,rgba(207,172,108,.13),transparent 28%),radial-gradient(circle at 15% 52%,rgba(103,154,117,.12),transparent 36%),linear-gradient(150deg,#08120e,#142019 56%,#192820)',mine:'radial-gradient(circle at 72% 17%,rgba(179,154,194,.09),transparent 28%),radial-gradient(circle at 14% 52%,rgba(109,158,126,.13),transparent 36%),linear-gradient(150deg,#09130f,#142019 56%,#19261f)',sanctuary:'radial-gradient(circle at 72% 17%,rgba(196,170,137,.10),transparent 28%),radial-gradient(circle at 14% 52%,rgba(95,142,115,.11),transparent 36%),linear-gradient(150deg,#0b120f,#171d18 56%,#20241d)',people:'radial-gradient(circle at 73% 17%,rgba(115,150,185,.12),transparent 28%),radial-gradient(circle at 14% 52%,rgba(104,150,122,.10),transparent 36%),linear-gradient(150deg,#081219,#101d1b 56%,#16231f)'};w.style.background=b[t]||b.base}
function home(){current='home';tone();set(`<section class="field"><div class="copy"><div class="eyebrow">Estoy acá</div><h1>¿Qué está vivo ahora?</h1><div class="entry"><textarea id="momentText" placeholder="Podés empezar por donde quieras..." aria-label="Contame qué está vivo ahora"></textarea><button class="send" aria-label="Compartir" onclick="moment()">→</button></div><div class="row"><button class="pill main" onclick="moment()">Necesito algo ahora</button><button class="pill" onclick="source()">Quiero explorar</button></div><nav class="dock" aria-label="Espacios principales"><button class="navitem" onclick="mine()"><span>◌</span>Mi vida</button><button class="navitem" onclick="source()"><span>≈</span>Fuente</button><button class="navitem" onclick="sanctuary()"><span>◇</span>Santuario</button><button class="navitem" onclick="people()"><span>◎</span>Personas</button></nav></div><div class="orbspace"><div class="orb"></div><div class="presence">LUMI está acá</div></div></section>`)}
function moment(){current='home';tone();const v=document.querySelector('#momentText')?.value.trim();set(`<section class="field"><div class="copy"><div class="eyebrow">Estoy con vos</div><h1>${v?'Podemos empezar por acá.':'Podemos empezar sin explicar todo.'}</h1><div class="row"><button class="pill main" onclick="source(true)">Acercame algo</button><button class="pill" onclick="mine()">Mirar algo mío</button><button class="pill quiet" onclick="home()">Quedarme acá</button></div></div><div class="orbspace"><div class="orb"></div><div class="presence">LUMI está acá</div></div></section>`)}
function source(fromMoment=false){current='source';tone('source');set(`<section class="space" id="space"><div class="spacehead"><div><div class="eyebrow">Fuente</div><h1>${fromMoment?'Quizá algo de esto te acompañe.':'Seguí lo que te llame.'}</h1></div><div class="orb small"></div></div><div class="cards"><button class="card" onclick="poss('perspectiva')"><small>PERSPECTIVA · 6 MIN</small><h3>Mirar desde otro lugar</h3><p>Una idea con procedencia y límites visibles.</p></button><button class="card" onclick="poss('practica')"><small>PRÁCTICA · 4 MIN</small><h3>Volver al cuerpo</h3><p>Una experiencia breve para hacer, no consumir.</p></button><button class="card" onclick="people()"><small>HUMANO</small><h3>Hablar con alguien</h3><p>Una posibilidad fuera de la pantalla.</p></button></div><div class="subbar"><button class="pill" onclick="reveal()">Ver más</button><button class="pill" onclick="wander()">Sorprendeme</button><button class="pill quiet" onclick="home()">Volver</button></div></section>`)}
function mine(){current='mine';tone('mine');set(`<section class="space" id="space"><div class="spacehead"><div><div class="eyebrow">Mi vida</div><h1>Lo que importa sigue acá.</h1></div><div class="orb small"></div></div><div class="cards"><button class="card" onclick="detail('faro')"><small>FARO</small><h3>Vivir con más espacio</h3><p>Una dirección que elegiste cuidar.</p></button><button class="card" onclick="detail('practica')"><small>ALGO PROPIO</small><h3>Una práctica que ya es tuya</h3><p>Algo que no necesita depender de LUMEN.</p></button><button class="card" onclick="sanctuary()"><small>SANTUARIO</small><h3>Algo que importa</h3><p>Una reflexión que elegiste conservar.</p></button></div><div class="subbar"><button class="pill" onclick="reveal()">Ver más</button><button class="pill" onclick="source()">Explorar relacionado</button><button class="pill quiet" onclick="home()">Volver</button></div></section>`)}
function sanctuary(){current='sanctuary';tone('sanctuary');set(`<section class="space" id="space"><div class="spacehead"><div><div class="eyebrow">Santuario</div><h1>Lo que elegiste cuidar.</h1></div><div class="orb small"></div></div><div class="cards"><button class="card" onclick="detail('recuerdo')"><small>REFLEXIÓN</small><h3>Una frase que volvió a vos</h3><p>La guardaste porque seguía diciendo algo.</p></button><button class="card" onclick="detail('momento')"><small>MOMENTO</small><h3>Algo que no querías perder</h3><p>Un fragmento elegido, no un historial automático.</p></button><button class="card" onclick="detail('nuevo')"><small>NUEVO</small><h3>Guardar algo ahora</h3><p>Texto breve, nota de voz o una imagen.</p></button></div><div class="subbar"><button class="pill" onclick="reveal()">Ver más</button><button class="pill quiet" onclick="home()">Volver</button></div></section>`)}
function people(){current='people';tone('people');set(`<section class="space" id="space"><div class="spacehead"><div><div class="eyebrow">Personas</div><h1>Tal vez no tengas que hacerlo solo.</h1></div><div class="orb small" style="opacity:.36"></div></div><div class="cards"><button class="card" onclick="human('one')"><small>1:1</small><h3>Alguien dispuesto a escuchar</h3><p>Una conversación humana con bordes claros.</p></button><button class="card" onclick="human('circle')"><small>CÍRCULO</small><h3>Conversar con otros</h3><p>Un encuentro pequeño con propósito visible.</p></button><button class="card" onclick="human('pro')"><small>AYUDA PREPARADA</small><h3>Hablar con alguien con experiencia</h3><p>Condiciones y procedencia visibles antes de decidir.</p></button></div><div class="subbar"><button class="pill" onclick="reveal()">Ver más</button><button class="pill quiet" onclick="home()">Volver</button></div></section>`)}
function reveal(){document.querySelector('#space')?.classList.toggle('revealed')}
function poss(type){current='source';tone('source');set(`<section class="field"><div class="copy"><div class="eyebrow">Una posibilidad</div><h1>${type==='practica'?'Cuatro minutos para volver al cuerpo.':'Una mirada para abrir, no para cerrar.'}</h1><div class="row"><button class="pill main" onclick="experience()">Vivir esto</button><button class="pill" onclick="source()">Seguir explorando</button><button class="pill quiet" onclick="home()">No es para mí</button></div></div><div class="orbspace"><div class="orb small"></div></div></section>`)}
function detail(kind){tone(current==='sanctuary'?'sanctuary':'mine');set(`<section class="field"><div class="copy"><div class="eyebrow">${current==='sanctuary'?'Santuario':'Mi vida'}</div><h1>${kind==='faro'?'“Vivir con más espacio y menos apuro.”':kind==='practica'?'Esto ya forma parte de vos.':'Esto está acá porque lo elegiste.'}</h1><div class="row"><button class="pill main" onclick="experience()">Traerlo al ahora</button><button class="pill quiet" onclick="${current==='sanctuary'?'sanctuary()':'mine()'}">Volver</button></div></div><div class="orbspace"><div class="orb small"></div></div></section>`)}
function human(kind){current='people';tone('people');set(`<section class="field"><div class="copy"><div class="eyebrow">Vida acompañando vida</div><h1>${kind==='pro'?'Elegir bien a quién acercarte también es cuidado.':'Ahora la otra persona puede tomar el centro.'}</h1><div class="row"><button class="pill main" onclick="returning()">Entrar</button><button class="pill quiet" onclick="people()">Volver</button></div></div><div class="orbspace"><div class="orb small" style="opacity:.16"></div></div></section>`)}
function experience(){current='home';tone();set(`<section class="field"><div class="copy"><div class="eyebrow">Experiencia</div><h1>Ahora puede tocar vivir.</h1><div class="row"><button class="pill main" onclick="returning()">Volví</button><button class="pill quiet" onclick="home()">Ir a mi vida</button></div></div><div class="orbspace"><div class="orb small" style="opacity:.18"></div></div></section>`)}
function returning(){current='home';tone();set(`<section class="field"><div class="copy"><div class="eyebrow">Retorno</div><h1>¿Qué quedó?</h1><div class="row"><button class="pill main" onclick="sanctuary()">Quiero conservar algo</button><button class="pill" onclick="source()">Quiero otra cosa</button><button class="pill quiet" onclick="home()">Cerrar por ahora</button></div></div><div class="orbspace"><div class="orb"></div></div></section>`)}
function wander(){current='source';tone('source');set(`<section class="field"><div class="copy"><div class="eyebrow">Deambular</div><h1>No hace falta buscar.</h1><div class="row"><button class="pill main" onclick="source()">Seguir esto</button><button class="pill quiet" onclick="home()">Seguir mi día</button></div></div><div class="orbspace"><div class="orb"></div></div></section>`)}
function introduceCurrent(){const d=intros[current]||intros.home;document.querySelector('#introEyebrow').textContent=d.eyebrow;document.querySelector('#introTitle').textContent=d.title;document.querySelector('#introText').textContent=d.text;document.querySelector('#introMore').textContent=d.more;document.querySelector('#introMore').hidden=true;document.querySelector('#moreBtn').textContent='Quiero saber más';document.querySelector('#introLayer').classList.add('on')}
function closeIntro(){document.querySelector('#introLayer').classList.remove('on')}
function toggleMore(){const el=document.querySelector('#introMore'),b=document.querySelector('#moreBtn');el.hidden=!el.hidden;b.textContent=el.hidden?'Quiero saber más':'Menos'}
document.querySelector('#introLayer').addEventListener('click',e=>{if(e.target.id==='introLayer')closeIntro()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeIntro()});
home();
</script>
</body>
</html>
