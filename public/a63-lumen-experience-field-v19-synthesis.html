<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMEN · V19 Síntesis</title><style>:root{--ink:#f3efe6;--mut:#9ca9a0;--line:rgba(242,239,230,.13);--soft:rgba(255,255,255,.045);--gold:#d7bd8c}*{box-sizing:border-box}body{margin:0;background:#09130f;color:var(--ink);font-family:Inter,system-ui,sans-serif}.world{min-height:100vh;background:radial-gradient(circle at 78% 14%,rgba(220,184,119,.1),transparent 28%),radial-gradient(circle at 14% 58%,rgba(111,161,126,.13),transparent 34%),linear-gradient(145deg,#08110d,#102019 58%,#13241d)}button,input,textarea{font:inherit}.top{position:fixed;z-index:8;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:linear-gradient(#09130fee,transparent)}.brand{font-size:.66rem;letter-spacing:.22em;color:#87968d}.nav{display:flex;gap:5px}.nav button,.btn,.chip{border:1px solid transparent;background:transparent;color:#a6b2aa;border-radius:999px;padding:10px 13px;cursor:pointer}.nav button:hover,.btn:hover,.chip:hover{background:rgba(255,255,255,.055);color:#f2f0e9}.stage{min-height:100vh;padding:100px 6vw 70px;display:grid;place-items:center}.scene{width:min(1120px,100%);animation:in .4s ease}.hero{display:grid;grid-template-columns:1.05fr .65fr;gap:8vw;align-items:center}.eyebrow{font-size:.67rem;letter-spacing:.16em;text-transform:uppercase;color:#83978b}h1{font:400 clamp(2.8rem,5.5vw,5.5rem)/.98 Georgia,serif;letter-spacing:-.04em;margin:13px 0 18px}h2,h3{font-family:Georgia,serif;font-weight:400}.lead{color:var(--mut);line-height:1.7;max-width:720px}.orbwrap{display:grid;place-items:center;min-height:320px}.orb{width:145px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 27%,#fafcf6 0 3%,#c9ddc9 14%,#84aa8d 43%,#34563f 70%,#142b1d);box-shadow:0 0 145px rgba(117,174,130,.22);animation:breathe 8s ease-in-out infinite}.orb.small{width:34px;box-shadow:0 0 42px rgba(117,174,130,.2)}textarea,input{width:100%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:#eef1eb;border-radius:22px;padding:16px;outline:none}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn,.chip{border-color:var(--line);background:rgba(255,255,255,.035)}.primary{background:#eee7da;color:#1b2821;font-weight:700}.quiet{opacity:.68}.intro{margin-top:18px;padding:14px 16px;border-left:1px solid rgba(215,189,140,.35);color:#9ca9a0;line-height:1.55;max-width:650px}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}.place{min-height:190px;border:1px solid var(--line);border-radius:30px;padding:24px;background:rgba(255,255,255,.035);cursor:pointer;transition:.25s}.place:hover,.tile:hover{background:rgba(255,255,255,.07);transform:translateY(-2px)}.place h2{font-size:1.7rem;margin:10px 0}.place p,.tile p{color:#92a098;line-height:1.55}.tools{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 26px}.chip{font-size:.88rem}.mosaic{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.tile{border:1px solid var(--line);border-radius:27px;padding:22px;background:rgba(255,255,255,.035);cursor:pointer;min-height:165px;transition:.25s}.tile:nth-child(1){grid-column:span 7}.tile:nth-child(2){grid-column:span 5}.tile:nth-child(3){grid-column:span 4}.tile:nth-child(4){grid-column:span 4}.tile:nth-child(5){grid-column:span 4}.tile:nth-child(6){grid-column:span 5}.tile:nth-child(7){grid-column:span 7}.tile small{color:#7f9187;letter-spacing:.09em}.tile h3{font-size:1.4rem;margin:8px 0}.territory{display:grid;grid-template-columns:.9fr 1.1fr;gap:5vw;align-items:start}.macro{border:1px solid var(--line);border-radius:38px;padding:30px;background:radial-gradient(circle at 50% 40%,rgba(157,181,159,.08),transparent 50%),rgba(255,255,255,.025)}.compass{position:relative;aspect-ratio:1;max-width:480px;margin:auto}.ring{position:absolute;border:1px solid rgba(255,255,255,.11);border-radius:50%;inset:8%}.ring.r2{inset:27%}.center{position:absolute;inset:40%;border-radius:50%;display:grid;place-items:center;text-align:center;background:rgba(157,181,159,.12);font:italic .9rem Georgia,serif;color:#c1cec4}.node{position:absolute;max-width:125px;padding:10px 12px;border-radius:18px;background:#13251de8;border:1px solid var(--line);font-size:.78rem;color:#b5c0b9;cursor:pointer}.n1{top:7%;left:36%}.n2{top:31%;right:0}.n3{bottom:12%;right:14%}.n4{bottom:8%;left:13%}.n5{top:32%;left:0}.strand{padding:17px 0;border-bottom:1px solid var(--line)}.strand b{font:400 1.22rem Georgia,serif}.strand p{color:#8f9e95;line-height:1.5}.people{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.person{min-height:220px;border:1px solid var(--line);border-radius:32px;padding:24px;background:rgba(255,255,255,.03);cursor:pointer}.face{width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,#b1bfb5,#40594a);margin-bottom:20px}.person p{color:#91a097;line-height:1.55}.detail{display:grid;grid-template-columns:1.1fr .7fr;gap:6vw}.experience{border:1px solid var(--line);border-radius:36px;padding:30px;background:rgba(255,255,255,.03)}.experience h2{font-size:2.2rem}.meta{color:#7f9187;font-size:.8rem;line-height:1.6}.lumi{position:fixed;z-index:10;right:20px;bottom:18px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#102019dc;backdrop-filter:blur(10px);color:#aab6ae;border-radius:999px;padding:8px 11px;cursor:pointer}.panel{display:none;position:fixed;z-index:11;right:20px;bottom:72px;width:min(370px,calc(100vw - 40px));border:1px solid var(--line);border-radius:26px;padding:21px;background:#102019f7;box-shadow:0 20px 70px #0008}.panel.show{display:block}.panel p{color:#96a49b;line-height:1.55}.crumb{font-size:.8rem;color:#829188;margin-bottom:18px}.crumb button{border:0;background:transparent;color:#a8b4ac;cursor:pointer}.note{font:italic 1rem Georgia,serif;color:#84958b;margin-top:22px}@keyframes breathe{50%{transform:scale(1.055);filter:brightness(1.06)}}@keyframes in{from{opacity:0;transform:translateY(7px)}}@media(max-width:820px){.hero,.territory,.detail{grid-template-columns:1fr}.orbwrap{min-height:180px;order:-1}.map,.people{grid-template-columns:1fr}.mosaic{display:block}.tile{margin-bottom:11px}.stage{padding:90px 20px 55px}.top{padding:14px 15px}.nav button{padding:8px 7px;font-size:.8rem}h1{font-size:3rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><div class="world"><header class="top"><div class="brand">LUMEN</div><nav class="nav"><button onclick="home()">Ahora</button><button onclick="source()">Fuente</button><button onclick="territory()">Territorio</button><button onclick="tissue()">Tejido</button></nav></header><main id="root" class="stage"></main><button class="lumi" onclick="toggleLumi()"><span class="orb small"></span><span>LUMI</span></button><aside class="panel" id="panel"><h3>Estoy acá.</h3><p>No necesitás salir de donde estás. Puedo ayudarte a entender algo, encontrar una posibilidad, relacionarlo con algo tuyo o simplemente dejarte seguir.</p><textarea placeholder="Decime lo que necesites..."></textarea><div class="row"><button class="btn primary" onclick="moment()">Conversar</button><button class="btn" onclick="toggleLumi()">Seguir</button></div></aside></div><script>const R=document.querySelector('#root'),P=document.querySelector('#panel');function set(x){R.innerHTML=x;P.classList.remove('show');scrollTo(0,0)}function toggleLumi(){P.classList.toggle('show')}function home(){set(`<section class="scene hero"><div><div class="eyebrow">Un lugar para tu vida</div><h1>¿Qué hay en tu vida hoy?</h1><p class="lead">Podés contarme lo que te pasa y lo miramos juntos. O podés recorrer LUMEN por tu cuenta.</p><textarea aria-label="Contarle a LUMI" placeholder="Contame como te salga..."></textarea><div class="row"><button class="btn primary" onclick="moment()">Seguir con LUMI</button><button class="btn" onclick="explore()">Explorar por mi cuenta</button></div><div class="intro"><b>Si es tu primera vez:</b> LUMEN puede acompañarte en algo que estés viviendo, acercarte ideas y experiencias, ayudarte a volver a cosas que son tuyas o conectarte con otras personas. No necesitás aprender cómo funciona.</div></div><div class="orbwrap"><div class="orb"></div></div></section>`)}function explore(){set(`<section class="scene"><div class="eyebrow">Explorar</div><h1>Tres lugares. Cada uno sirve para algo distinto.</h1><p class="lead">Podés entrar, mirar y volver. LUMI sigue disponible, pero no necesitás pedirle permiso.</p><div class="map"><article class="place" onclick="source()"><div class="eyebrow">Fuente</div><h2>Encontrar algo valioso</h2><p>Ideas, prácticas, obras, audios, experiencias, lugares, recursos y personas. Distintas maneras de acercarte a lo que buscás.</p></article><article class="place" onclick="territory()"><div class="eyebrow">Territorio</div><h2>Ver y retomar lo mío</h2><p>Lo que me importa, lo que estoy atravesando, lo que ya me ayudó y aquello que elegí cuidar o continuar.</p></article><article class="place" onclick="tissue()"><div class="eyebrow">Tejido</div><h2>Encontrarme con otras vidas</h2><p>Personas, profesionales, círculos y encuentros cuando lo humano es parte de la ayuda.</p></article></div><p class="note">Simple al entrar. Más profundo sólo cuando lo necesitás.</p></section>`)}function moment(){set(`<section class="scene hero"><div><div class="eyebrow">Te estoy siguiendo</div><h1>Parece que hay bastante ruido alrededor de esta decisión.</h1><p class="lead">Puedo estar entendiendo mal. Antes de buscar una respuesta, quizá te sirva hacer un poco de espacio.</p><div class="row"><button class="btn primary" onclick="detail('practice')">Probemos algo breve</button><button class="btn" onclick="source()">Quiero ver otras posibilidades</button><button class="btn quiet" onclick="home()">No ahora</button></div><p class="note">Podés corregirme en cualquier momento.</p></div><div class="orbwrap"><div class="orb"></div></div></section>`)}function source(){set(`<section class="scene"><div class="crumb"><button onclick="explore()">Explorar</button> · Fuente</div><div class="eyebrow">Fuente · reservorio vivo</div><h1>¿Cómo querés acercarte?</h1><p class="lead">Buscá algo concreto o empezá desde otro ángulo. No hace falta saber qué tipo de ayuda necesitás.</p><input placeholder="Buscá como hablarías: ‘necesito claridad’, ‘quiero dormir mejor’, ‘estoy cambiando de trabajo’..."><div class="tools"><button class="chip">Por lo que estoy viviendo</button><button class="chip">Tengo poco tiempo</button><button class="chip">Quiero profundizar</button><button class="chip">Quiero algo práctico</button><button class="chip">Quiero otra mirada</button><button class="chip">Sorprendeme con criterio</button></div><div class="mosaic"><article class="tile" onclick="detail('perspective')"><small>PERSPECTIVA · 4 MIN</small><h3>Una idea para mirar la decisión desde otro lugar</h3><p>Una reflexión que abre sin decidir por vos.</p></article><article class="tile" onclick="detail('practice')"><small>PRÁCTICA · 2 MIN</small><h3>Hacer un poco de espacio</h3><p>Una experiencia breve; LUMI se retira mientras la vivís.</p></article><article class="tile" onclick="detail('audio')"><small>AUDIO · 8 MIN</small><h3>Caminar y escuchar</h3><p>Para seguir afuera de la pantalla.</p></article><article class="tile" onclick="detail('work')"><small>OBRA</small><h3>Una fuente para profundizar</h3><p>Autoría, procedencia y contexto visibles.</p></article><article class="tile" onclick="tissue()"><small>OTRA VIDA</small><h3>Hablarlo con alguien</h3><p>Cuando otra experiencia humana puede aportar algo distinto.</p></article><article class="tile" onclick="detail('action')"><small>VIDA REAL</small><h3>Probar un gesto pequeño</h3><p>La experiencia sucede afuera; LUMEN no necesita retenerte.</p></article><article class="tile" onclick="detail('place')"><small>LUGAR · ENCUENTRO · SERVICIO</small><h3>Ir hacia algo que existe en el mundo</h3><p>Condiciones, disponibilidad y costo sólo cuando importan.</p></article></div><div class="row"><button class="btn" onclick="territory()">Ver si ya tengo algo mío que ayude</button><button class="btn quiet" onclick="explore()">Volver a explorar</button></div></section>`)}const D={perspective:['PERSPECTIVA','Una idea que abre','A veces claridad no es tener una respuesta, sino distinguir qué merece una respuesta ahora.','Lectura · 4 min · procedencia disponible'],practice:['PRÁCTICA','Dos minutos de espacio','Apoyá los pies. Mirá un punto quieto. Soltá el aire un poco más lento. No busques resolver nada todavía.','2 min · sin costo · puede hacerse fuera de pantalla'],audio:['AUDIO','Caminar y escuchar','Una pieza breve pensada para acompañarte mientras caminás. Podés cerrar la pantalla; hay transcripción disponible.','8 min · audio + transcripción'],work:['OBRA','Profundizar en una fuente','Una obra aparece con suficiente contexto para saber qué es, quién la creó, por qué podría ser relevante y cómo acceder.','Autoría · procedencia · acceso'],action:['VIDA REAL','Llevar una intención a una conversación','Antes de responder, frená diez segundos y preguntate qué querés cuidar en esa conversación. Nada más.','Fuera de pantalla · retorno opcional'],place:['EN EL MUNDO','Un encuentro cercano','Una posibilidad real con propósito, lugar, horario, disponibilidad y condiciones claras antes de acercarte.','Presencial · disponibilidad y costo visibles']};function detail(k){let d=D[k]||D.perspective;set(`<section class="scene detail"><div class="experience"><div class="eyebrow">${d[0]}</div><h2>${d[1]}</h2><p class="lead">${d[2]}</p><div class="row"><button class="btn primary" onclick="returned()">Quiero vivirlo</button><button class="btn" onclick="source()">Ver algo relacionado</button><button class="btn quiet" onclick="source()">Ahora no</button></div></div><aside><div class="eyebrow">Lo necesario para decidir</div><p class="meta">${d[3]}</p><p class="lead">¿Por qué apareció? Porque puede aportar claridad sin exigirte tomar una decisión ahora.</p><button class="btn" onclick="territory()">Relacionarlo con algo mío</button></aside></section>`)}function returned(){set(`<section class="scene hero"><div><div class="eyebrow">De vuelta</div><h1>¿Qué pasó?</h1><p class="lead">No es una encuesta. Con una señal alcanza.</p><div class="row"><button class="btn primary" onclick="integrate()">Me sirvió</button><button class="btn" onclick="source()">Quiero otra forma</button><button class="btn">Todavía no sé</button><button class="btn quiet" onclick="home()">Prefiero dejarlo acá</button></div></div><div class="orbwrap"><div class="orb" style="width:70px;opacity:.55"></div></div></section>`)}function integrate(){set(`<section class="scene"><div class="eyebrow">Puede quedar cerca, si querés</div><h1>¿Hay algo que quieras llevarte?</h1><p class="lead">Podés guardarlo, reconocerlo como algo que te sirve o simplemente dejar que descanse. No se convierte en tarea.</p><div class="row"><button class="btn primary" onclick="territory()">Tenerlo presente</button><button class="btn">Quiero probarlo en otra situación</button><button class="btn quiet" onclick="home()">Con esto alcanza</button></div></section>`)}function territory(){set(`<section class="scene territory"><div class="macro"><div class="eyebrow">Territorio · vista amplia</div><h2>Tu vida no es una lista.</h2><p class="lead">Esto es una forma de ver algunas cosas que elegiste conservar, cuidar o continuar. El presente siempre puede cambiar el mapa.</p><div class="compass"><div class="ring"></div><div class="ring r2"></div><div class="center">vos<br>ahora</div><button class="node n1">Quiero cuidar<br>mis vínculos</button><button class="node n2">Cambio de<br>trabajo</button><button class="node n3">Algo que ya<br>me sirve</button><button class="node n4">Una reflexión<br>guardada</button><button class="node n5">Camino<br>en pausa</button></div></div><div><div class="crumb"><button onclick="explore()">Explorar</button> · Territorio</div><div class="eyebrow">Ahora cerca</div><h1 style="font-size:3.4rem">Lo que tiene sentido retomar.</h1><div class="strand"><b>Una decisión que sigue viva</b><p>El cambio de trabajo aparece porque lo retomaste esta semana. Podés seguirlo, cambiarlo o dejarlo descansar.</p><div class="row"><button class="btn primary" onclick="moment()">Retomarlo</button><button class="btn">Dejarlo descansar</button></div></div><div class="strand"><b>Algo que ya sabés que te ayuda</b><p>Hacer espacio antes de conversaciones difíciles. Lo usaste más de una vez y lo reconociste como propio.</p><div class="row"><button class="btn" onclick="detail('practice')">Volver a usarlo</button><button class="btn">Usarlo en otra situación</button></div></div><div class="strand"><b>Algo que importa para vos</b><p>Una reflexión que elegiste conservar. No es historial: está acá porque decidiste que significaba algo.</p></div><div class="row"><button class="btn" onclick="source()">Encontrar algo que dialogue con esto</button><button class="btn quiet" onclick="home()">Volver al ahora</button></div></div></section>`)}function tissue(){set(`<section class="scene"><div class="crumb"><button onclick="explore()">Explorar</button> · Tejido</div><div class="eyebrow">Tejido · vida acompañando vida</div><h1>A veces la ayuda tiene rostro.</h1><p class="lead">Acá no venís a consumir personas ni a construir audiencia. Podés encontrar experiencia humana, apoyo profesional o un encuentro alrededor de algo que importa.</p><div class="tools"><button class="chip">Alguien que haya vivido algo parecido</button><button class="chip">Apoyo profesional</button><button class="chip">Un círculo o encuentro</button><button class="chip">Quiero ofrecer algo</button></div><div class="people"><article class="person"><div class="face"></div><div class="eyebrow">Experiencia compartida</div><h3>Hablar con alguien que atravesó un cambio parecido</h3><p>Contexto y límites claros. No una receta: otra vida.</p><button class="btn">Conocer un poco más</button></article><article class="person"><div class="face"></div><div class="eyebrow">Profesional</div><h3>Una persona preparada para acompañar</h3><p>Rol, alcance, credenciales, disponibilidad y costo visibles antes de acercarte.</p><button class="btn">Ver opciones</button></article><article class="person"><div class="face"></div><div class="eyebrow">Encuentro</div><h3>Un círculo pequeño alrededor de una transición</h3><p>Propósito, cuidado y salida clara. Sin likes, ranking ni exposición social.</p><button class="btn">Ver el encuentro</button></article></div><p class="note">Cuando otra persona toma el centro, LUMEN baja la voz y sostiene sólo los bordes.</p><div class="row"><button class="btn" onclick="source()">Volver a posibilidades</button><button class="btn" onclick="territory()">Volver a lo mío</button><button class="btn quiet" onclick="home()">Volver al ahora</button></div></section>`)}home();</script></body></html>
