<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1511"><title>LUMEN · Experience & Sensation Field V1.2</title><style>:root{--bg:#09130f;--bg2:#13231b;--fg:#f3f0e8;--mut:#9caaa1;--line:rgba(240,244,235,.12);--sage:#91ad97;--warm:#e7c995;--paper:#eee8dc;--ink:#27322d;--ease:cubic-bezier(.22,.8,.25,1)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif}button,textarea{font:inherit}.world{min-height:100vh;position:relative;overflow:hidden;background:radial-gradient(circle at var(--x,65%) var(--y,20%),rgba(214,181,124,.12),transparent 24%),radial-gradient(circle at 18% 45%,rgba(104,151,118,.14),transparent 32%),linear-gradient(150deg,#08120e,#112019 55%,#15251e);transition:background 1.2s var(--ease)}.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E")}.top{position:fixed;z-index:30;left:24px;right:24px;top:20px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:.67rem;letter-spacing:.23em;color:#85978b}.tools{display:flex;gap:8px}.tool{border:1px solid var(--line);background:rgba(7,16,12,.55);backdrop-filter:blur(14px);color:#9eadA3;border-radius:999px;padding:9px 12px;cursor:pointer}.tool:hover{background:rgba(255,255,255,.07)}.stage{min-height:100vh;display:grid;place-items:center;padding:80px max(22px,6vw) 58px}.field{width:min(1120px,100%);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.75fr);gap:clamp(35px,8vw,110px);align-items:center}.copy{max-width:690px}.kicker{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:#81968a;font-weight:750}.copy h1{font:400 clamp(3.1rem,6.7vw,6.8rem)/.92 Georgia,serif;letter-spacing:-.055em;margin:15px 0 23px}.copy p{color:#a4b0a8;font-size:1.05rem;line-height:1.78;max-width:640px}.orbspace{position:relative;min-height:480px;display:grid;place-items:center}.ring,.ring2{position:absolute;width:min(420px,40vw);aspect-ratio:1;border:1px solid rgba(214,231,216,.08);border-radius:50%;transition:1.3s var(--ease)}.ring2{width:min(310px,30vw);border-color:rgba(214,231,216,.1)}.orb{width:170px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 27%,#f8fbf4 0 3%,#c6dcc7 14%,#84aa8c 43%,#34563f 70%,#142b1d);box-shadow:0 0 0 32px rgba(188,221,193,.018),0 0 0 82px rgba(188,221,193,.012),0 0 145px rgba(117,174,130,.22);animation:breathe 8s ease-in-out infinite;transition:1.2s var(--ease);position:relative;z-index:3}.orb.quiet{transform:scale(.72);opacity:.28;box-shadow:0 0 55px rgba(117,174,130,.08)}@keyframes breathe{50%{transform:scale(1.055);filter:brightness(1.05)}}.expression{margin-top:32px;display:flex;gap:10px;align-items:flex-end;max-width:700px}.expression textarea{flex:1;min-height:62px;max-height:150px;resize:vertical;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.045);color:#eef1eb;border-radius:22px;padding:18px;outline:none;backdrop-filter:blur(12px)}.expression textarea:focus{border-color:rgba(222,194,145,.48);background:rgba(255,255,255,.07)}.expression textarea::placeholder{color:#8f9e95}.send{width:60px;height:60px;border:0;border-radius:50%;background:#ece6da;color:#1c2b23;font-size:1.25rem;cursor:pointer}.under{margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.exploreBtn{border:0;background:transparent;color:#b9c4bd;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.18);cursor:pointer}.ambientCue{font-size:.84rem;color:#71857a;display:none}.ambientCue.on{display:inline}.choices{display:flex;gap:9px;flex-wrap:wrap;margin-top:30px}.pill{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#dbe1dc;padding:11px 15px;border-radius:999px;cursor:pointer;transition:.25s}.pill:hover{background:rgba(255,255,255,.09);transform:translateY(-1px)}.pill.main{background:#ece6da;color:#1c2922;border-color:#ece6da;font-weight:700}.whisper{margin-top:20px;color:#657a6d;font:italic 1rem Georgia,serif}.reflection{border-left:1px solid rgba(228,194,139,.38);padding-left:22px;color:#c8d0cb;line-height:1.75;margin-top:28px;max-width:650px}.constellation{position:relative;width:min(500px,44vw);aspect-ratio:1}.cOrb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:112px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 28%,#eff6ec,#82a98b 45%,#294c36 78%);box-shadow:0 0 70px rgba(126,184,139,.2)}.node{position:absolute;width:150px;border:1px solid rgba(255,255,255,.12);background:rgba(10,23,16,.67);backdrop-filter:blur(13px);border-radius:19px;padding:12px 13px;color:#d9e0da;cursor:pointer;transition:.3s}.node:hover{transform:translateY(-3px);border-color:rgba(230,197,145,.4)}.node b{font:400 .98rem Georgia,serif}.node small{display:block;color:#73877a;margin-top:4px;line-height:1.3}.n1{left:0;top:8%}.n2{right:0;top:8%}.n3{right:-3%;top:40%}.n4{right:2%;bottom:6%}.n5{left:2%;bottom:6%}.n6{left:-3%;top:40%}.n7{left:35%;top:-5%}.n8{left:35%;bottom:-5%}.drawer{position:fixed;z-index:40;right:22px;bottom:22px;width:min(430px,calc(100vw - 44px));padding:22px;border:1px solid var(--line);background:rgba(11,24,17,.94);backdrop-filter:blur(18px);border-radius:26px;box-shadow:0 30px 90px rgba(0,0,0,.32);transform:translateY(130%);transition:.6s var(--ease)}.drawer.on{transform:none}.drawer .kind{font-size:.63rem;letter-spacing:.16em;color:#7e9385;text-transform:uppercase}.drawer h2{font:400 1.8rem Georgia,serif;margin:8px 0 10px}.drawer p{color:#9eaca2;line-height:1.6;font-size:.93rem}.immersive{text-align:center;max-width:780px;margin:auto}.immersive .orb{width:110px;margin:0 auto 38px;animation-duration:10s}.immersive h1{font:400 clamp(2.8rem,6vw,5.8rem)/1 Georgia,serif;margin:0}.immersive p{max-width:620px;margin:24px auto;color:#9fada4;line-height:1.75}.breathline{width:min(420px,80%);height:2px;background:rgba(255,255,255,.1);margin:40px auto;overflow:hidden}.breathline i{display:block;width:35%;height:100%;background:#d8bd8d;animation:travel 6s ease-in-out infinite}@keyframes travel{50%{transform:translateX(185%)}}.paper{width:min(820px,100%);background:linear-gradient(145deg,#f1ebdf,#e4ddd1);color:var(--ink);border-radius:40px;padding:clamp(28px,5vw,58px);box-shadow:0 30px 100px rgba(0,0,0,.22)}.paper .kicker{color:#748078}.paper h1{font:400 clamp(2.6rem,5vw,5rem)/.98 Georgia,serif;margin:14px 0 22px}.paper p{color:#5d6861;line-height:1.7}.paper .pill{border-color:rgba(39,50,45,.15);color:var(--ink)}.paper .pill.main{background:#26342c;color:#f2eee5}.demo{position:fixed;z-index:45;right:22px;top:70px;width:280px;padding:18px;border:1px solid var(--line);background:rgba(9,20,14,.95);border-radius:22px;display:none}.demo.on{display:block}.demo h3{font:400 1.2rem Georgia,serif;margin:0 0 10px}.demo label{display:block;color:#8fa095;font-size:.82rem;margin:10px 0}.demo select{width:100%;margin-top:5px;background:#14251b;color:#e7ebe7;border:1px solid var(--line);padding:9px;border-radius:10px}.foot{position:fixed;z-index:20;left:24px;bottom:18px;color:#52685a;font-size:.62rem;letter-spacing:.1em}.fade{animation:fade .8s var(--ease)}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(max-width:850px){.field{grid-template-columns:1fr}.orbspace{min-height:300px;order:-1}.ring{width:300px}.ring2{width:220px}.copy h1{font-size:3.5rem}.constellation{width:min(480px,92vw)}.node{width:120px;font-size:.82rem}.stage{padding:82px 22px 55px}.foot{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><main class="world" id="world"><div class="grain"></div><header class="top"><div class="brand">LUMEN · PRESENCIA</div><div class="tools"><button class="tool" id="sound" aria-label="Sonido ambiental">sonido ○</button><button class="tool" id="demoBtn" aria-label="Escenarios de prueba">···</button><button class="tool" onclick="withdraw()">Salir</button></div></header><div id="root"></div><aside class="drawer" id="drawer"></aside><aside class="demo" id="demo"><h3>Escenarios de prueba</h3><label>Historia disponible<select id="history"><option value="none">Primera llegada</option><option value="faro">Faro previo autorizado</option><option value="own">Algo propio disponible</option></select></label><small style="color:#71857a">Sólo simula contexto del Embrión. No forma parte de la experiencia normal.</small></aside><div class="foot">A63 · V55.2 · EXPERIENCE & SENSATION FIELD</div></main><script>const root=document.querySelector('#root'),drawer=document.querySelector('#drawer'),demo=document.querySelector('#demo'),history=document.querySelector('#history');let context={history:'none',input:'',selected:null,own:JSON.parse(localStorage.getItem('lumen-own')||'[]')};const archetypes=[['Comprender','Una perspectiva que puede ordenar sin cerrar','perspective'],['Practicar','Una experiencia breve para vivir, no sólo leer','practice'],['Escuchar','Una pieza de audio para salir de la pantalla','audio'],['Encontrarnos','Otra vida, círculo o encuentro humano','human'],['Actuar','Un gesto concreto en el mundo real','action'],['Profundizar','Una obra o recurso con procedencia','resource'],['Ir','Un lugar, evento o experiencia presencial','place'],['Recibir ayuda','Apoyo profesional, material o servicio','support']];function shell(copy,visual){root.innerHTML=`<section class="stage fade"><div class="field"><div class="copy">${copy}</div><div class="orbspace">${visual||'<div class="ring"></div><div class="ring2"></div><div class="orb"></div>'}</div></div></section>`}function arrive(){const cue=context.history==='faro'?'Hay un hilo anterior disponible, si hoy importa.':context.history==='own'?'Hay algo tuyo que podría estar cerca, si lo necesitás.':'';shell(`<div class="kicker">VIDA → PRESENCIA</div><h1>¿Qué está vivo ahora?</h1><p>Podés llegar como estés. No necesitás elegir una parte de LUMEN ni saber qué pedir.</p><div class="expression"><textarea id="input" placeholder="Contame lo que quieras…" aria-label="Expresión libre"></textarea><button class="send" onclick="listen()">→</button></div><div class="under"><button class="exploreBtn" onclick="explore()">Quiero explorar</button><span class="ambientCue ${cue?'on':''}">${cue}</span></div><div class="whisper">Estoy acá. Sin apuro.</div>`)}function listen(){const el=document.querySelector('#input');context.input=(el?.value||'').trim();if(!context.input){rest();return}const t=context.input.toLowerCase();let title='Puedo intentar entender con vos.';let reflection='Escucho algo que todavía no necesita convertirse en una categoría. Podemos quedarnos lo suficiente para distinguir qué podría tener sentido ahora.';if(/faro|seguir|continu|retomar|camino/.test(t)){title='Esto parece tener un hilo anterior.';reflection=context.history==='faro'?'Hay una continuidad que elegiste cuidar. Puedo traerla sólo como contexto, sin convertir este momento en un programa.':'Podemos mirar la continuidad que nombrás sin asumir que hoy necesite lo mismo que antes.'}else if(/ansiedad|agob|miedo|cans|triste|perdid|mal/.test(t)){title='Parece que esto está ocupando bastante espacio.';reflection='No necesito diagnosticarlo para estar con vos. Primero podemos bajar un poco el ruido y después ver si conviene comprender, vivir algo breve, buscar otra ayuda o simplemente dejar espacio.'}else if(/decid|eleg|duda|no sé|confund/.test(t)){title='Hay algo que todavía no termina de ordenarse.';reflection='Quizá no haga falta decidir enseguida. Puedo ayudarte a abrir perspectivas sin empujarte hacia una respuesta.'}shell(`<div class="kicker">ESCUCHAR → COMPRENDER</div><h1>${title}</h1><div class="reflection">${reflection}</div><div class="choices"><button class="pill main" onclick="openPossibilities()">Sí, es por ahí</button><button class="pill" onclick="clarify()">No del todo</button><button class="pill" onclick="explore()">Prefiero explorar</button><button class="pill" onclick="withdraw()">Con esto alcanza</button></div><div class="whisper">Si no sé, prefiero dejarlo abierto.</div>`)}function clarify(){shell(`<div class="kicker">COMPRENSIÓN · SIN CERRAR</div><h1>Contame un poco más, sólo si cambia lo que necesitás.</h1><p>No hace falta completar un check-in. Una frase, una contradicción o incluso “no sé” alcanza.</p><div class="expression"><textarea id="input" placeholder="Lo que faltaba era…"></textarea><button class="send" onclick="listen()">→</button></div><div class="choices"><button class="pill" onclick="rest()">Prefiero no ponerle más palabras</button></div>`)}function rest(){shell(`<div class="kicker">RESPIRAR → ESPERAR</div><h1>Podemos no hacer nada todavía.</h1><p>No toda presencia necesita convertirse en acción. LUMEN puede quedar disponible sin llenar el momento.</p><div class="choices"><button class="pill" onclick="arrive()">Cuando tenga sentido</button><button class="pill" onclick="withdraw()">Cerrar por ahora</button></div><div class="whisper">…</div>`,`<div class="ring"></div><div class="orb quiet"></div>`)}function openPossibilities(){const own=context.history==='own'?'<button class="pill" onclick="ownCue()">Recordar algo mío</button>':'';shell(`<div class="kicker">APERTURA → POSIBILIDAD</div><h1>Hay más de una manera de estar con esto.</h1><p>No necesito abrirte un catálogo. Puedo acercar una posibilidad, recuperar algo propio si existe, abrir otra vida o dejar que explores.</p><div class="choices"><button class="pill main" onclick="offer('practice')">Acercame una posibilidad</button>${own}<button class="pill" onclick="human()">Quizá otra persona</button><button class="pill" onclick="explore()">Quiero mirar por mi cuenta</button><button class="pill" onclick="withdraw()">No ahora</button></div><div class="whisper">Vos seguís eligiendo.</div>`)}function offer(kind){context.selected=archetypes.find(x=>x[2]===kind)||archetypes[1];const a=context.selected;shell(`<div class="kicker">POSIBILIDAD · ${a[0].toUpperCase()}</div><h1>${a[1]}.</h1><p>Por lo que trajiste, esto podría ser una forma liviana de acercarnos. No es una prescripción y no hace falta que te represente.</p><div class="choices"><button class="pill main" onclick="experience('${a[2]}')">Quiero probarlo</button><button class="pill" onclick="explore()">Prefiero otra cosa</button><button class="pill" onclick="withdraw()">No ahora</button></div><div class="whisper">Una posibilidad, no una respuesta.</div>`)}function explore(){const nodes=archetypes.map((a,i)=>`<button class="node n${i+1}" onclick="detail(${i})"><b>${a[0]}</b><small>${a[1]}</small></button>`).join('');shell(`<div class="kicker">EXPLORAR · RESERVORIO VIVO</div><h1>No una biblioteca. Un campo de posibilidades.</h1><p>Acá sí elegiste explorar. Las formas son distintas porque la vida también lo es. Podés abrir una, relacionarla con otra o volver a expresarte.</p><div class="choices"><button class="pill" onclick="arrive()">Volver a contarme</button></div>`,`<div class="constellation">${nodes}<div class="cOrb"></div></div>`)}function detail(i){const a=archetypes[i];context.selected=a;drawer.innerHTML=`<div class="kind">${a[0]}</div><h2>${a[1]}</h2><p>${detailCopy(a[2])}</p><div class="choices"><button class="pill main" onclick="drawer.classList.remove('on');experience('${a[2]}')">Vivir esta posibilidad</button><button class="pill" onclick="drawer.classList.remove('on')">Seguir mirando</button></div>`;drawer.classList.add('on')}function detailCopy(k){return {perspective:'Una mirada con procedencia que puede ayudarte a ver distinto, sin decidir por vos.',practice:'Una experiencia breve que baja el volumen de la interfaz y devuelve protagonismo al cuerpo y a la vida.',audio:'Una escucha opcional. La pantalla puede apagarse; el sonido sólo entra si agrega valor.',human:'Una persona o grupo puede ser la ayuda. LUMEN prepara el encuentro y después se corre.',action:'Un gesto pequeño y concreto para llevar esto al mundo real.',resource:'Una obra, texto o recurso cuya profundidad queda disponible sin convertir Fuente en feed.',place:'Un encuentro, taller, retiro, servicio o lugar real. LUMEN ayuda a cruzar el umbral.',support:'Cuando hace falta otro tipo de apoyo, la claridad y los límites importan más que la estética.'}[k]}function experience(k){drawer.classList.remove('on');if(k==='human')return human();if(k==='action'||k==='place'||k==='support')return outside(k);if(k==='perspective'||k==='resource')return reading(k);shell(`<div class="kicker">EXPERIENCIA · LUMEN BAJA EL VOLUMEN</div><h1>${k==='audio'?'Podés cerrar los ojos.':'Volver al suelo.'}</h1><p>${k==='audio'?'El sonido sería opt-in. Para esta maqueta, la presencia visual sólo sostiene el borde.':'Durante unos instantes, notá tres puntos de contacto de tu cuerpo con el lugar donde estás. No intentes cambiar nada. Sólo registrá que el suelo ya está haciendo parte del trabajo.'}</p><div class="breathline"><i></i></div><div class="choices" style="justify-content:center"><button class="pill main" onclick="returned()">Terminé por ahora</button><button class="pill" onclick="withdraw()">Dejarlo acá</button></div>`,`<div class="orb quiet"></div>`)}function reading(k){shell(`<div class="kicker">EXPERIENCIA · ${k==='resource'?'PROFUNDIDAD':'PERSPECTIVA'}</div><h1>Una idea para dejar abierta.</h1><div class="reflection">A veces la claridad no aparece al resolver más rápido, sino al distinguir qué parte de una situación depende de vos, cuál necesita a otros y cuál todavía necesita tiempo.</div><div class="choices"><button class="pill main" onclick="outside('reflection')">Quiero llevarla conmigo</button><button class="pill" onclick="returned()">Volver ahora</button><button class="pill" onclick="withdraw()">Dejarla ir</button></div>`)}function human(){shell(`<div class="kicker">TEJIDO · VIDA ACOMPAÑANDO VIDA</div><h1>Quizá esto no necesita más LUMEN.</h1><p>Hay momentos en que otra persona puede escuchar, acompañar, enseñar, colaborar o simplemente estar. LUMEN puede ayudar a preparar ese encuentro y sostener sus bordes; no reemplazarlo.</p><div class="choices"><button class="pill main" onclick="outside('human')">Abrir lugar a otra vida</button><button class="pill" onclick="openPossibilities()">Seguir acá</button><button class="pill" onclick="withdraw()">No ahora</button></div>`)}function outside(k){shell(`<div class="kicker">VIDA REAL · RETIRO</div><h1>Ahora puede tocar vivir.</h1><p>No hay nada que completar. ${k==='human'?'La conversación pertenece a quienes la viven.':'La posibilidad puede seguir fuera de esta pantalla.'} LUMEN queda disponible sin perseguirte.</p><div class="choices"><button class="pill main" onclick="returned()">Volví</button><button class="pill" onclick="withdraw()">Cerrar por ahora</button></div><div class="whisper">Retirarse también es acompañar.</div>`,`<div class="ring"></div><div class="orb quiet"></div>`)}function returned(){shell(`<div class="kicker">RECIBIR → RETORNO</div><h1>¿Qué pasó en la vida?</h1><p>No es una evaluación. Puede alcanzar una señal, una historia, una duda o nada claro todavía.</p><div class="choices"><button class="pill main" onclick="integrate('helped')">Algo me sirvió</button><button class="pill" onclick="integrate('different')">Fue distinto de lo esperado</button><button class="pill" onclick="integrate('unknown')">No sé todavía</button><button class="pill" onclick="integrate('no')">No era para mí</button></div>`)}function integrate(x){if(x==='no')return shell(`<div class="kicker">INTEGRIDAD · DEJAR IR</div><h1>Entonces no hace falta forzarlo.</h1><p>Que algo no haya servido también ayuda a LUMEN a acompañar mejor. No lo convertimos en fracaso ni en obligación de intentar otra cosa.</p><div class="choices"><button class="pill" onclick="arrive()">Quiero contar otra cosa</button><button class="pill" onclick="withdraw()">Cerrar</button></div>`);if(x==='unknown')return shell(`<div class="kicker">ESPERAR</div><h1>No hace falta saberlo ahora.</h1><p>Podemos dejar que la experiencia decante sin convertir la incertidumbre en tarea.</p><div class="choices"><button class="pill" onclick="saveOwn('Una experiencia que todavía está decantando')">Guardarla sin concluir</button><button class="pill" onclick="withdraw()">Dejarla ir</button></div>`);shell(`<div class="kicker">INTEGRACIÓN · SI VOS QUERÉS</div><h1>Hay algo que quizá merece permanecer.</h1><p>Puede quedar como una huella íntima, convertirse en algo que ya sabés volver a usar, relacionarse con una continuidad elegida o simplemente quedar en este momento.</p><div class="choices"><button class="pill main" onclick="saveOwn('Una forma de volver al suelo')">Quiero guardarlo</button><button class="pill" onclick="makeOwn()">Esto ya puedo llevarlo conmigo</button><button class="pill" onclick="continuity()">Relacionarlo con un Faro</button><button class="pill" onclick="withdraw()">Con esto alcanza</button></div>`)}function saveOwn(x){context.own.push(x);localStorage.setItem('lumen-own',JSON.stringify(context.own));shell(`<div class="kicker">SANTUARIO · PERTENENCIA</div><h1>Queda con vos.</h1><p>No como favorito ni historial. Como algo que elegiste preservar. Podés volver, cambiarlo o borrarlo cuando quieras.</p><div class="choices"><button class="pill main" onclick="withdraw()">Volver a la vida</button><button class="pill" onclick="makeOwn()">Creo que ya es parte de mí</button></div>`)}function makeOwn(){shell(`<div class="kicker">REPERTORIO · AUTONOMÍA</div><h1>Entonces esto ya no es de LUMEN.</h1><p>Si podés llevarlo con vos, no necesito recordártelo. Menos dependencia también es éxito.</p><div class="choices"><button class="pill main" onclick="withdraw()">Volver a la vida</button></div><div class="whisper">La capacidad propia es también una forma de despedida.</div>`,`<div class="orb quiet"></div>`)}function continuity(){shell(`<div class="kicker">TRAYECTORIA · ORIENTACIÓN</div><h1>Puede conversar con algo que venía creciendo.</h1><p>Un Faro no es una meta ni un KPI. Es una dirección humana que elegiste cuidar. Esto puede relacionarse con ella sin convertirse en un programa.</p><div class="choices"><button class="pill main" onclick="withdraw()">Sí, dejá ese hilo disponible</button><button class="pill" onclick="saveOwn('Una experiencia significativa')">Sólo guardarlo</button><button class="pill" onclick="withdraw()">No relacionarlo</button></div>`)}function ownCue(){shell(`<div class="kicker">MEMORIA · ALGO PROPIO</div><h1>Antes de buscar algo nuevo…</h1><p>Hay algo que elegiste conservar y que podría conversar con este momento. Puedo acercarlo sin asumir que sigue siendo válido.</p><div class="choices"><button class="pill main" onclick="makeOwn()">Sí, recordámelo</button><button class="pill" onclick="openPossibilities()">Hoy necesito otra cosa</button><button class="pill" onclick="withdraw()">Ya me acordé</button></div>`)}function withdraw(){shell(`<div class="kicker">SOLTAR → AUTONOMÍA → VIDA</div><h1>La Vida sigue.</h1><p>Si volvés, LUMEN puede recordar sólo lo que hayas elegido conservar. Si no volvés, también está bien.</p><div class="choices"><button class="pill" onclick="arrive()">Volver cuando tenga sentido</button></div><div class="whisper">LUMEN puede ocupar menos lugar.</div>`,`<div class="ring"></div><div class="orb quiet"></div>`)}history.addEventListener('change',e=>{context.history=e.target.value;arrive()});document.querySelector('#demoBtn').onclick=()=>demo.classList.toggle('on');document.addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--x',(e.clientX/innerWidth*100)+'%');document.documentElement.style.setProperty('--y',(e.clientY/innerHeight*100)+'%')});let audioCtx,osc,gain,soundOn=false;document.querySelector('#sound').onclick=()=>{if(!soundOn){audioCtx=new(window.AudioContext||window.webkitAudioContext)();osc=audioCtx.createOscillator();gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=174;gain.gain.value=.018;osc.connect(gain);gain.connect(audioCtx.destination);osc.start();soundOn=true;document.querySelector('#sound').textContent='sonido ●'}else{gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.6);setTimeout(()=>{osc.stop();audioCtx.close()},650);soundOn=false;document.querySelector('#sound').textContent='sonido ○'}};arrive();</script></body></html>
