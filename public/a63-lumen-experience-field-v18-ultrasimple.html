<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09130f"><title>LUMEN · V18.1 Ultra Simple</title><style>:root{--ink:#f4f0e8;--mut:#9ba9a0;--line:rgba(244,240,232,.13);--soft:rgba(255,255,255,.045);--gold:#d8be8d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09130f;color:var(--ink);font-family:Inter,system-ui,sans-serif}button,textarea,input{font:inherit}.world{min-height:100vh;background:radial-gradient(circle at 78% 14%,rgba(220,184,119,.09),transparent 27%),radial-gradient(circle at 15% 60%,rgba(111,161,126,.13),transparent 34%),linear-gradient(145deg,#08110d,#102019 58%,#13241d)}header{position:fixed;z-index:8;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:linear-gradient(#09130ff2 18%,#09130f80 72%,transparent)}.brand{font-size:.65rem;letter-spacing:.22em;color:#87968d}.places{display:flex;gap:4px}.nav{border:0;background:transparent;color:#9eaaa3;padding:9px 10px;border-radius:999px;cursor:pointer}.nav:hover,.nav:focus-visible{background:rgba(255,255,255,.05);color:#eef1eb}.stage{min-height:100vh;padding:100px 6vw 72px;display:grid;place-items:center}.scene{width:min(980px,100%);animation:in .28s ease}.home{display:grid;grid-template-columns:1fr .48fr;gap:7vw;align-items:center}.kicker{font-size:.66rem;letter-spacing:.15em;text-transform:uppercase;color:#82968a}h1{font:400 clamp(2.9rem,6vw,5.5rem)/.99 Georgia,serif;letter-spacing:-.042em;margin:12px 0 16px}.lead{max-width:690px;color:var(--mut);line-height:1.7;font-size:1.02rem}.intro{margin:18px 0 8px;padding:15px 17px;border:1px solid rgba(216,190,141,.18);background:rgba(216,190,141,.045);border-radius:20px;max-width:680px;color:#c4ccc6;line-height:1.6}.intro b{color:#eee9df;font-weight:600}.tiny{font-size:.86rem;color:#809087;line-height:1.55}.orbbox{display:grid;place-items:center;min-height:280px}.orb{width:138px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 27%,#fafcf6 0 3%,#c9ddc9 14%,#84aa8d 43%,#34563f 70%,#142b1d);box-shadow:0 0 140px rgba(117,174,130,.22);animation:breathe 8s ease-in-out infinite}.talk{display:flex;gap:9px;margin-top:22px;align-items:flex-end}.talk textarea{flex:1;min-height:58px;max-height:150px;resize:vertical;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.045);color:#eef1eb;border-radius:22px;padding:17px;outline:none}.talk textarea:focus,.search:focus{border-color:rgba(216,190,141,.45);box-shadow:0 0 0 3px rgba(216,190,141,.06)}.send,.btn{border:1px solid var(--line);border-radius:999px;padding:12px 16px;cursor:pointer;transition:.18s ease}.send{background:#eee7da;color:#1d2923;font-weight:700}.btn{background:rgba(255,255,255,.04);color:#dce2dc}.send:hover,.btn:hover{transform:translateY(-1px)}.quiet{opacity:.7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.one{max-width:730px}.offer{margin:26px 0;border-left:1px solid rgba(215,189,140,.35);padding:2px 0 2px 20px}.offer h2{font:400 1.95rem Georgia,serif;margin:7px 0}.offer p{color:#9ba9a0;line-height:1.6}.flowhint{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.flowhint span{font-size:.77rem;color:#7f8f86;border:1px solid rgba(255,255,255,.08);padding:7px 10px;border-radius:999px}.doorgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.door{border:1px solid var(--line);background:var(--soft);border-radius:30px;padding:25px;min-height:190px;cursor:pointer;transition:.18s ease}.door:hover,.item:hover{background:rgba(255,255,255,.075);transform:translateY(-2px)}.door h2{font:400 1.58rem Georgia,serif;margin:10px 0}.door p,.item p{color:#93a198;line-height:1.55}.search{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#eef1eb;border-radius:999px;padding:15px 18px;outline:none;margin:12px 0 20px}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{border:1px solid var(--line);background:var(--soft);border-radius:26px;padding:21px;cursor:pointer;transition:.18s ease}.item small{color:#7e9085;letter-spacing:.08em}.item h2{font:400 1.42rem Georgia,serif;margin:8px 0}.crumb{display:flex;gap:8px;align-items:center;color:#819188;font-size:.82rem;margin-bottom:18px}.back{border:0;background:transparent;color:#aab5ae;cursor:pointer;padding:0}.memory{padding:18px 0;border-bottom:1px solid var(--line)}.memory b{font:400 1.23rem Georgia,serif}.memory p{color:#8f9e95;line-height:1.5}.human{display:flex;gap:14px;align-items:flex-start}.avatar{width:46px;height:46px;flex:0 0 auto;border-radius:50%;background:linear-gradient(145deg,#a9b9ad,#415c4b)}.note{font:italic 1rem Georgia,serif;color:#83948a;margin-top:24px}.guide{position:fixed;right:18px;bottom:18px;z-index:9}.guide button{border:1px solid rgba(255,255,255,.12);background:rgba(11,24,18,.88);backdrop-filter:blur(12px);color:#b7c1ba;border-radius:999px;padding:10px 13px;cursor:pointer}.guidebox{position:fixed;right:18px;bottom:64px;z-index:10;width:min(360px,calc(100vw - 36px));padding:18px;border:1px solid rgba(255,255,255,.12);background:rgba(10,22,16,.96);backdrop-filter:blur(16px);border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.28);display:none}.guidebox.open{display:block}.guidebox h3{font:400 1.35rem Georgia,serif;margin:0 0 8px}.guidebox p{color:#9aa89f;line-height:1.55;margin:7px 0}.guidebox strong{color:#e8ece7;font-weight:600}.closeguide{margin-top:10px;border:0;background:transparent;color:#d2d9d4;padding:0;cursor:pointer}@keyframes breathe{50%{transform:scale(1.05);filter:brightness(1.06)}}@keyframes in{from{opacity:0;transform:translateY(6px)}}@media(max-width:800px){header{padding:14px 14px}.places{gap:0}.nav{padding:8px 7px;font-size:.8rem}.stage{padding:90px 20px 55px}.home{grid-template-columns:1fr}.orbbox{min-height:150px;order:-1}.orb{width:86px}h1{font-size:2.95rem}.doorgrid,.items{grid-template-columns:1fr}.door{min-height:0}.talk{align-items:stretch;flex-direction:column}.send{align-self:flex-start}.intro{font-size:.94rem}.guide{right:12px;bottom:12px}.guidebox{right:12px;bottom:58px;width:calc(100vw - 24px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><div class="world"><header><button class="brand back" onclick="home()" aria-label="Volver al inicio">LUMEN</button><nav class="places" aria-label="Lugares"><button class="nav" onclick="source()">Fuente</button><button class="nav" onclick="territory()">Territorio</button><button class="nav" onclick="tissue()">Tejido</button></nav></header><main id="root" class="stage"></main><div class="guide"><button onclick="toggleGuide()">¿Qué es esto?</button></div><aside id="guidebox" class="guidebox" aria-live="polite"><h3>LUMEN acompaña tu vida.</h3><p>Podés <strong>contarle algo</strong> y dejar que te acompañe, o <strong>explorar por tu cuenta</strong>.</p><p><strong>Fuente</strong> acerca posibilidades. <strong>Territorio</strong> guarda lo que ya es tuyo. <strong>Tejido</strong> te conecta con otras personas.</p><p>No hay un camino obligatorio. Podés entrar, salir y volver cuando quieras.</p><button class="closeguide" onclick="toggleGuide()">Entendido</button></aside></div><script>const R=document.querySelector('#root');let firstVisit=!sessionStorage.getItem('lumen-v18-seen');function set(x){R.innerHTML=x;scrollTo({top:0,behavior:'smooth'})}function toggleGuide(){document.querySelector('#guidebox').classList.toggle('open')}function home(){if(firstVisit){sessionStorage.setItem('lumen-v18-seen','1');firstVisit=false}set(`<section class="scene home"><div><div class="kicker">Estoy acá</div><h1>¿Qué hay en tu vida hoy?</h1><p class="lead">Contame como te salga. No necesitás saber por dónde empezar.</p><div class="intro"><b>Si es tu primera vez:</b> podés contarme algo y dejar que te acompañe. O podés recorrer Fuente, Territorio y Tejido por tu cuenta.</div><div class="talk"><textarea aria-label="Contarle a LUMI" placeholder="Escribí o hablá de lo que quieras..."></textarea><button class="send" onclick="listen()">Contarte algo</button></div><div class="actions"><button class="btn quiet" onclick="explore()">Explorar por mi cuenta</button></div><div class="flowhint"><span>Sin pasos obligatorios</span><span>Podés corregirme</span><span>Podés irte cuando quieras</span></div></div><div class="orbbox"><div class="orb"></div></div></section>`)}function listen(){set(`<section class="scene one"><div class="kicker">Te sigo</div><h1>Suena a que necesitás un poco de claridad antes de decidir.</h1><p class="lead">Puedo estar entendiendo mal. Si no va por ahí, corregime.</p><div class="offer"><h2>Podemos probar algo muy breve.</h2><p>Dos minutos para bajar un poco el ruido antes de seguir pensando.</p></div><div class="actions"><button class="send" onclick="experience()">Probarlo</button><button class="btn" onclick="other()">No es eso</button><button class="btn quiet" onclick="home()">Ahora no</button></div></section>`)}function other(){set(`<section class="scene one"><div class="kicker">Te escucho</div><h1>Decime qué sería útil ahora.</h1><p class="lead">No hace falta explicarlo bien.</p><div class="talk"><textarea autofocus placeholder="Por ejemplo: ordenar una decisión, sentirme menos solo, encontrar algo práctico..."></textarea><button class="send" onclick="listen()">Seguir</button></div><div class="actions"><button class="btn quiet" onclick="home()">Volver</button></div></section>`)}function experience(){set(`<section class="scene home"><div><div class="kicker">Ahora vos</div><h1>Salí dos minutos de la pantalla.</h1><p class="lead">Apoyá los pies. Mirá un punto quieto. Soltá el aire un poco más lento. No busques resolver nada.</p><p class="note">Yo me retiro mientras lo hacés.</p><div class="actions"><button class="send" onclick="returned()">Volví</button><button class="btn quiet" onclick="home()">Salir</button></div></div><div class="orbbox"><div class="orb" style="width:58px;opacity:.28"></div></div></section>`)}function returned(){set(`<section class="scene one"><div class="kicker">Volviste</div><h1>¿Te sirvió?</h1><p class="lead">Con una señal alcanza.</p><div class="actions"><button class="send" onclick="helped()">Sí</button><button class="btn" onclick="otherOffer()">No</button><button class="btn quiet" onclick="home()">No sé</button></div></section>`)}function helped(){set(`<section class="scene one"><div class="kicker">Bien</div><h1>¿Querés que lo recordemos?</h1><p class="lead">Así, si vuelve a tener sentido, empezamos por algo que ya sabés que te sirve.</p><div class="actions"><button class="send" onclick="saved()">Sí, guardalo</button><button class="btn quiet" onclick="home()">No hace falta</button></div></section>`)}function saved(){set(`<section class="scene home"><div><div class="kicker">Queda cerca</div><h1>Listo.</h1><p class="lead">No se convierte en una tarea. Queda en tu Territorio para cuando quieras volver.</p><div class="actions"><button class="send" onclick="territory()">Ver mi Territorio</button><button class="btn quiet" onclick="home()">Seguir con mi vida</button></div></div><div class="orbbox"><div class="orb" style="width:72px;opacity:.55"></div></div></section>`)}function otherOffer(){set(`<section class="scene one"><div class="kicker">No insistimos</div><h1>Podemos cambiar de camino.</h1><p class="lead">Otra posibilidad, otra persona o nada por ahora.</p><div class="actions"><button class="send" onclick="source()">Ver otra posibilidad</button><button class="btn" onclick="tissue()">Hablar con alguien</button><button class="btn quiet" onclick="home()">Dejarlo acá</button></div></section>`)}function explore(){set(`<section class="scene"><div class="kicker">Explorar</div><h1>Tres lugares. Nada más.</h1><p class="lead">Podés entrar al que tenga sentido ahora. Siempre podés volver.</p><div class="doorgrid"><article class="door" onclick="source()"><div class="kicker">Fuente</div><h2>Encontrar algo que pueda servirme</h2><p>Ideas, prácticas, preguntas, experiencias, recursos, personas y lugares.</p></article><article class="door" onclick="territory()"><div class="kicker">Territorio</div><h2>Volver a lo mío</h2><p>Lo que me importa, lo que ya me ayudó y lo que elegí guardar.</p></article><article class="door" onclick="tissue()"><div class="kicker">Tejido</div><h2>Encontrarme con otras personas</h2><p>Conversaciones, experiencia humana, profesionales, círculos y encuentros.</p></article></div><div class="actions"><button class="btn quiet" onclick="home()">Volver al inicio</button></div></section>`)}function source(){set(`<section class="scene"><div class="crumb"><button class="back" onclick="home()">Inicio</button><span>›</span><span>Fuente</span></div><div class="kicker">Fuente</div><h1>Encontrá algo que pueda servirte.</h1><p class="lead">Buscá por lo que estás viviendo. No hace falta saber qué tipo de ayuda querés.</p><input class="search" placeholder="Por ejemplo: ‘necesito claridad’, ‘quiero dormir mejor’..."><div class="items"><article class="item" onclick="experience()"><small>2 MIN · PRÁCTICA</small><h2>Hacer un poco de espacio</h2><p>Para cuando necesitás bajar el ruido antes de decidir.</p></article><article class="item" onclick="question()"><small>PREGUNTA</small><h2>Mirarlo desde otro lugar</h2><p>Una pregunta breve que no decide por vos.</p></article><article class="item" onclick="tissue()"><small>CON OTRA PERSONA</small><h2>Hablarlo con alguien</h2><p>Cuando pensar solo no alcanza.</p></article><article class="item" onclick="realLife()"><small>EN LA VIDA REAL</small><h2>Probar algo pequeño</h2><p>Llevar una intención concreta a la situación que estás viviendo.</p></article></div><p class="note">No hay un orden. Elegí una, buscá otra cosa o volvé.</p></section>`)}function question(){set(`<section class="scene one"><div class="crumb"><button class="back" onclick="source()">Fuente</button><span>›</span><span>Una pregunta</span></div><h1>¿Qué decisión te dejaría más en paz con vos, aunque no fuera la más cómoda?</h1><p class="lead">No hace falta responderme.</p><div class="actions"><button class="send" onclick="helped()">Me sirvió</button><button class="btn" onclick="tissue()">Quiero hablarlo con alguien</button><button class="btn quiet" onclick="source()">Volver a Fuente</button></div></section>`)}function realLife(){set(`<section class="scene one"><div class="kicker">Llevarlo a la vida</div><h1>Antes de responder, frená diez segundos.</h1><p class="lead">Soltá el aire y preguntate qué querés cuidar en esa conversación. Nada más.</p><div class="actions"><button class="send" onclick="ownNow()">Lo probé</button><button class="btn quiet" onclick="source()">Volver</button></div></section>`)}function ownNow(){set(`<section class="scene one"><div class="kicker">En la vida real</div><h1>¿Pudiste usarlo por tu cuenta?</h1><div class="actions"><button class="send" onclick="autonomy()">Sí</button><button class="btn" onclick="source()">Necesito otra forma</button><button class="btn quiet" onclick="home()">No sé</button></div></section>`)}function autonomy(){set(`<section class="scene home"><div><div class="kicker">Ya lo tenés</div><h1>Entonces LUMEN puede correrse.</h1><p class="lead">Queda disponible para vos. Si lo necesitás, volvés. Si no, seguís.</p><div class="actions"><button class="btn quiet" onclick="home()">Seguir con mi vida</button></div></div><div class="orbbox"><div class="orb" style="width:40px;opacity:.18"></div></div></section>`)}function territory(){set(`<section class="scene"><div class="crumb"><button class="back" onclick="home()">Inicio</button><span>›</span><span>Territorio</span></div><div class="kicker">Territorio</div><h1>Lo que ya es parte de tu camino.</h1><p class="lead">Acá encontrás lo que elegiste guardar, lo que te ayudó y lo que querés retomar.</p><div class="memory"><b>Esto ya te ayudó antes</b><p>Hacer dos minutos de espacio antes de una decisión difícil.</p><div class="actions"><button class="send" onclick="experience()">Retomarlo</button><button class="btn" onclick="realLife()">Usarlo en otra situación</button></div></div><div class="memory"><b>Algo que querés cuidar</b><p>Responder con más calma en una conversación importante.</p><div class="actions"><button class="btn" onclick="source()">Buscar algo que ayude</button></div></div><div class="memory"><b>Guardado para vos</b><p>Una pregunta que te ayudó a ordenar una decisión.</p><div class="actions"><button class="btn" onclick="question()">Volver a verla</button></div></div><div class="actions"><button class="btn quiet" onclick="home()">Volver al inicio</button></div></section>`)}function tissue(){set(`<section class="scene"><div class="crumb"><button class="back" onclick="home()">Inicio</button><span>›</span><span>Tejido</span></div><div class="kicker">Tejido</div><h1>Encontrate con otras personas.</h1><p class="lead">A veces lo que hace falta no es otro contenido. Puede ser una conversación, alguien con experiencia o apoyo profesional.</p><input class="search" placeholder="Por ejemplo: ‘alguien que haya pasado por esto’..."><div class="items"><article class="item"><div class="human"><div class="avatar"></div><div><small>CONVERSACIÓN</small><h2>Alguien con experiencia parecida</h2><p>Para escuchar otra vida, no una receta.</p></div></div></article><article class="item"><div class="human"><div class="avatar"></div><div><small>APOYO PROFESIONAL</small><h2>Una persona preparada para acompañar</h2><p>Alcance, condiciones y límites visibles antes de acercarte.</p></div></div></article><article class="item"><small>CÍRCULO</small><h2>Un encuentro pequeño</h2><p>Personas alrededor de algo que importa, sin métricas sociales.</p></article><article class="item" onclick="source()"><small>NO SÉ A QUIÉN</small><h2>Ayudame a encontrar la forma</h2><p>LUMEN puede acercar una ayuda adecuada o reconocer que no tiene cobertura.</p></article></div><div class="actions"><button class="btn quiet" onclick="home()">Volver al inicio</button></div></section>`)}home();</script></body></html>
