<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09130f"><title>LUMEN · V18 Ultra Simple</title><style>:root{--ink:#f4f0e8;--mut:#9ba9a0;--line:rgba(244,240,232,.13);--soft:rgba(255,255,255,.045)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09130f;color:var(--ink);font-family:Inter,system-ui,sans-serif}button,textarea,input{font:inherit}.world{min-height:100vh;background:radial-gradient(circle at 78% 14%,rgba(220,184,119,.09),transparent 27%),radial-gradient(circle at 15% 60%,rgba(111,161,126,.13),transparent 34%),linear-gradient(145deg,#08110d,#102019 58%,#13241d)}header{position:fixed;z-index:8;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:linear-gradient(#09130fe8,transparent)}.brand{font-size:.65rem;letter-spacing:.22em;color:#87968d}.places{display:flex;gap:6px}.nav{border:0;background:transparent;color:#9eaaa3;padding:9px 11px;border-radius:999px;cursor:pointer}.nav:hover{background:rgba(255,255,255,.05);color:#eef1eb}.stage{min-height:100vh;padding:96px 6vw 70px;display:grid;place-items:center}.scene{width:min(980px,100%);animation:in .35s ease}.home{display:grid;grid-template-columns:1fr .55fr;gap:8vw;align-items:center}.kicker{font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:#82968a}h1{font:400 clamp(3rem,6vw,5.8rem)/.98 Georgia,serif;letter-spacing:-.045em;margin:13px 0 18px}.lead{max-width:700px;color:var(--mut);line-height:1.7;font-size:1.02rem}.orbbox{display:grid;place-items:center;min-height:300px}.orb{width:145px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 27%,#fafcf6 0 3%,#c9ddc9 14%,#84aa8d 43%,#34563f 70%,#142b1d);box-shadow:0 0 140px rgba(117,174,130,.22);animation:breathe 8s ease-in-out infinite}.talk{display:flex;gap:9px;margin-top:24px;align-items:flex-end}.talk textarea{flex:1;min-height:58px;max-height:150px;resize:vertical;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.045);color:#eef1eb;border-radius:22px;padding:17px;outline:none}.send,.btn{border:1px solid var(--line);border-radius:999px;padding:12px 16px;cursor:pointer}.send{background:#eee7da;color:#1d2923;font-weight:700}.btn{background:rgba(255,255,255,.04);color:#dce2dc}.quiet{opacity:.68}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.one{max-width:720px}.offer{margin:28px 0;border-left:1px solid rgba(215,189,140,.35);padding:4px 0 4px 22px}.offer h2{font:400 2rem Georgia,serif;margin:7px 0}.offer p{color:#9ba9a0;line-height:1.6}.doorgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}.door{border:1px solid var(--line);background:var(--soft);border-radius:30px;padding:25px;min-height:190px;cursor:pointer}.door:hover,.item:hover{background:rgba(255,255,255,.075)}.door h2{font:400 1.65rem Georgia,serif;margin:10px 0}.door p,.item p{color:#93a198;line-height:1.55}.search{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#eef1eb;border-radius:999px;padding:15px 18px;outline:none;margin:12px 0 20px}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{border:1px solid var(--line);background:var(--soft);border-radius:26px;padding:21px;cursor:pointer}.item small{color:#7e9085;letter-spacing:.08em}.item h2{font:400 1.45rem Georgia,serif;margin:8px 0}.crumb{display:flex;gap:8px;align-items:center;color:#819188;font-size:.82rem;margin-bottom:20px}.back{border:0;background:transparent;color:#aab5ae;cursor:pointer;padding:0}.memory{padding:17px 0;border-bottom:1px solid var(--line)}.memory b{font:400 1.25rem Georgia,serif}.memory p{color:#8f9e95;line-height:1.5}.human{display:flex;gap:14px;align-items:flex-start}.avatar{width:46px;height:46px;flex:0 0 auto;border-radius:50%;background:linear-gradient(145deg,#a9b9ad,#415c4b)}.note{font:italic 1rem Georgia,serif;color:#83948a;margin-top:24px}@keyframes breathe{50%{transform:scale(1.05);filter:brightness(1.06)}}@keyframes in{from{opacity:0;transform:translateY(7px)}}@media(max-width:800px){header{padding:14px 16px}.places{gap:0}.nav{padding:8px 7px;font-size:.82rem}.stage{padding:88px 20px 55px}.home{grid-template-columns:1fr}.orbbox{min-height:170px;order:-1}.orb{width:92px}h1{font-size:3.05rem}.doorgrid,.items{grid-template-columns:1fr}.door{min-height:0}.talk{align-items:stretch;flex-direction:column}.send{align-self:flex-start}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><div class="world"><header><div class="brand">LUMEN</div><nav class="places" aria-label="Lugares"><button class="nav" onclick="source()">Fuente</button><button class="nav" onclick="territory()">Territorio</button><button class="nav" onclick="tissue()">Tejido</button></nav></header><main id="root" class="stage"></main></div><script>const R=document.querySelector('#root');function set(x){R.innerHTML=x;scrollTo(0,0)}function home(){set(`<section class="scene home"><div><div class="kicker">Estoy acá</div><h1>¿Qué hay en tu vida hoy?</h1><p class="lead">Contame como te salga. No necesitás saber por dónde empezar.</p><div class="talk"><textarea aria-label="Contarle a LUMI" placeholder="Escribí o hablá de lo que quieras..."></textarea><button class="send" onclick="listen()">Seguir</button></div><div class="actions"><button class="btn quiet" onclick="explore()">Quiero explorar por mi cuenta</button></div></div><div class="orbbox"><div class="orb"></div></div></section>`)}function listen(){set(`<section class="scene one"><div class="kicker">Te sigo</div><h1>Suena a que necesitás un poco de claridad antes de decidir.</h1><p class="lead">Puedo estar entendiendo mal.</p><div class="offer"><h2>Probemos algo muy breve.</h2><p>Dos minutos para bajar un poco el ruido antes de seguir pensando.</p></div><div class="actions"><button class="send" onclick="experience()">Sí</button><button class="btn" onclick="other()">Otra cosa</button><button class="btn quiet" onclick="home()">No ahora</button></div></section>`)}function other(){set(`<section class="scene one"><div class="kicker">Decime un poco más</div><h1>¿Qué sería útil ahora?</h1><div class="talk"><textarea autofocus placeholder="Por ejemplo: ordenar una decisión, sentirme menos solo, encontrar algo práctico..."></textarea><button class="send" onclick="listen()">Seguir</button></div><div class="actions"><button class="btn quiet" onclick="home()">Volver</button></div></section>`)}function experience(){set(`<section class="scene home"><div><div class="kicker">Ahora vos</div><h1>Salí dos minutos de la pantalla.</h1><p class="lead">Apoyá los pies. Mirá un punto quieto. Soltá el aire un poco más lento. No busques resolver nada.</p><p class="note">Yo me retiro mientras lo hacés.</p><div class="actions"><button class="send" onclick="returned()">Volví</button><button class="btn quiet" onclick="home()">Salir</button></div></div><div class="orbbox"><div class="orb" style="width:58px;opacity:.28"></div></div></section>`)}function returned(){set(`<section class="scene one"><div class="kicker">Volviste</div><h1>¿Te sirvió?</h1><div class="actions"><button class="send" onclick="helped()">Sí</button><button class="btn" onclick="otherOffer()">No</button><button class="btn quiet" onclick="home()">No sé</button></div></section>`)}function helped(){set(`<section class="scene one"><div class="kicker">Bien</div><h1>¿Querés que lo tengamos presente?</h1><p class="lead">Así, si vuelve a tener sentido, empezamos por algo que ya sabés que te sirve.</p><div class="actions"><button class="send" onclick="saved()">Sí</button><button class="btn quiet" onclick="home()">No hace falta</button></div></section>`)}function saved(){set(`<section class="scene home"><div><div class="kicker">Queda cerca</div><h1>Listo.</h1><p class="lead">No se convierte en una tarea. Cuando quieras, está en tu Territorio. Y si ya podés usarlo solo, yo dejo de sugerirlo.</p><div class="actions"><button class="send" onclick="territory()">Ver mi Territorio</button><button class="btn quiet" onclick="home()">Seguir con mi vida</button></div></div><div class="orbbox"><div class="orb" style="width:72px;opacity:.55"></div></div></section>`)}function otherOffer(){set(`<section class="scene one"><div class="kicker">Entonces no insistimos</div><h1>Busquemos otra forma.</h1><p class="lead">Podemos probar algo distinto, encontrar una persona o dejarlo acá.</p><div class="actions"><button class="send" onclick="source()">Ver otra posibilidad</button><button class="btn" onclick="tissue()">Buscar a alguien</button><button class="btn quiet" onclick="home()">Dejarlo</button></div></section>`)}function explore(){set(`<section class="scene"><div class="kicker">Explorar</div><h1>¿Adónde querés ir?</h1><div class="doorgrid"><article class="door" onclick="source()"><div class="kicker">Fuente</div><h2>Encontrar algo que pueda servirme</h2><p>Ideas, prácticas, preguntas, experiencias, recursos, personas y lugares.</p></article><article class="door" onclick="territory()"><div class="kicker">Territorio</div><h2>Volver a lo mío</h2><p>Lo que me importa, lo que ya me ayudó y lo que elegí sostener.</p></article><article class="door" onclick="tissue()"><div class="kicker">Tejido</div><h2>Encontrarme con otras personas</h2><p>Conversaciones, experiencia humana, profesionales, círculos y encuentros.</p></article></div><div class="actions"><button class="btn quiet" onclick="home()">Volver</button></div></section>`)}function source(){set(`<section class="scene"><div class="crumb"><button class="back" onclick="home()">LUMEN</button><span>›</span><span>Fuente</span></div><div class="kicker">Fuente</div><h1>¿Qué podría servirte?</h1><input class="search" placeholder="Buscá como hablarías: ‘necesito claridad’, ‘quiero dormir mejor’..."><div class="items"><article class="item" onclick="experience()"><small>2 MIN · PRÁCTICA</small><h2>Hacer un poco de espacio</h2><p>Para cuando necesitás bajar el ruido antes de decidir.</p></article><article class="item" onclick="question()"><small>PREGUNTA</small><h2>Mirarlo desde otro lugar</h2><p>Una pregunta breve que no decide por vos.</p></article><article class="item" onclick="tissue()"><small>CON OTRA PERSONA</small><h2>Hablarlo con alguien</h2><p>Cuando pensar solo no alcanza.</p></article><article class="item" onclick="realLife()"><small>EN LA VIDA REAL</small><h2>Probar algo pequeño</h2><p>Llevar una intención concreta a la situación que estás viviendo.</p></article></div><p class="note">No hay un orden. Podés elegir una, buscar otra cosa o irte.</p></section>`)}function question(){set(`<section class="scene one"><div class="crumb"><button class="back" onclick="source()">Fuente</button><span>›</span><span>Una pregunta</span></div><h1>¿Qué decisión te dejaría más en paz con vos, aunque no fuera la más cómoda?</h1><p class="lead">No hace falta responderme.</p><div class="actions"><button class="send" onclick="helped()">Me sirvió</button><button class="btn" onclick="tissue()">Quiero hablarlo con alguien</button><button class="btn quiet" onclick="home()">Me la llevo</button></div></section>`)}function realLife(){set(`<section class="scene one"><div class="kicker">Llevarlo a la vida</div><h1>Antes de responder, frená diez segundos.</h1><p class="lead">Soltá el aire y preguntate qué querés cuidar en esa conversación. Nada más.</p><div class="actions"><button class="send" onclick="ownNow()">Lo probé</button><button class="btn quiet" onclick="source()">Volver</button></div></section>`)}function ownNow(){set(`<section class="scene one"><div class="kicker">En la vida real</div><h1>¿Pudiste usarlo por tu cuenta?</h1><div class="actions"><button class="send" onclick="autonomy()">Sí</button><button class="btn" onclick="source()">Necesito otra forma</button><button class="btn quiet" onclick="home()">No sé</button></div></section>`)}function autonomy(){set(`<section class="scene home"><div><div class="kicker">Es tuyo</div><h1>Entonces no necesito seguir empujando esto.</h1><p class="lead">Queda disponible para vos. Si lo necesitás, volvés. Si no, LUMEN se corre.</p><div class="actions"><button class="btn quiet" onclick="home()">Seguir con mi vida</button></div></div><div class="orbbox"><div class="orb" style="width:40px;opacity:.18"></div></div></section>`)}function territory(){set(`<section class="scene"><div class="crumb"><button class="back" onclick="home()">LUMEN</button><span>›</span><span>Territorio</span></div><div class="kicker">Territorio</div><h1>Lo que ya es parte de tu camino.</h1><div class="memory"><b>Esto ya te ayudó antes</b><p>Hacer dos minutos de espacio antes de una decisión difícil.</p><div class="actions"><button class="send" onclick="experience()">Retomarlo</button><button class="btn" onclick="realLife()">Usarlo en otra situación</button></div></div><div class="memory"><b>Algo que querés cuidar</b><p>Responder con más calma en una conversación importante.</p><div class="actions"><button class="btn" onclick="source()">Encontrar algo que ayude</button></div></div><div class="memory"><b>Guardado para vos</b><p>Una pregunta que te ayudó a ordenar una decisión.</p><div class="actions"><button class="btn" onclick="question()">Volver a verla</button></div></div><div class="actions"><button class="btn quiet" onclick="home()">Volver</button></div></section>`)}function tissue(){set(`<section class="scene"><div class="crumb"><button class="back" onclick="home()">LUMEN</button><span>›</span><span>Tejido</span></div><div class="kicker">Tejido</div><h1>A veces lo que hace falta es otra persona.</h1><p class="lead">Podés buscar por lo que estás viviendo. LUMEN no reemplaza el encuentro humano.</p><input class="search" placeholder="Por ejemplo: ‘alguien que haya pasado por esto’..."><div class="items"><article class="item"><div class="human"><div class="avatar"></div><div><small>CONVERSACIÓN</small><h2>Alguien con experiencia parecida</h2><p>Para escuchar otra vida, no una receta.</p></div></div></article><article class="item"><div class="human"><div class="avatar"></div><div><small>APOYO PROFESIONAL</small><h2>Una persona preparada para acompañar</h2><p>Alcance, condiciones y límites visibles antes de acercarte.</p></div></div></article><article class="item"><small>CÍRCULO</small><h2>Un encuentro pequeño</h2><p>Personas alrededor de algo que importa, sin métricas sociales.</p></article><article class="item" onclick="source()"><small>NO SÉ A QUIÉN</small><h2>Ayudame a encontrar la forma</h2><p>LUMEN puede acercar la ayuda más adecuada o reconocer que no tiene cobertura.</p></article></div><div class="actions"><button class="btn quiet" onclick="home()">Volver</button></div></section>`)}home();</script></body></html>
