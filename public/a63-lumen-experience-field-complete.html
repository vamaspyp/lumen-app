ni span:nth-child(2){top:35%;right:0}.mini span:nth-child(3){bottom:30%;left:0}.mini span:nth-child(4){bottom:6%;right:12%}.exploreHead{display:flex;justify-content:space-between;gap:30px;align-items:end}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;margin-top:28px}.const{position:relative;min-height:610px;border:1px solid var(--line);border-radius:38px;background:radial-gradient(circle at 50% 50%,rgba(224,180,119,.12),transparent 22%),rgba(255,255,255,.025)}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:130px;height:130px;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 62% 34%,#f4d6a2,#987963 27%,#556b7a 58%,rgba(40,61,71,.35));font:400 1rem Georgia,serif}.node{position:absolute;width:165px;text-align:left;border:1px solid var(--line);background:rgba(11,25,34,.82);color:#e3e4de;border-radius:18px;padding:11px 12px;transition:.2s}.node:hover,.node.on{transform:translateY(-2px);border-color:rgba(224,180,119,.55)}.node small{display:block;color:#93a19f;margin-top:4px}.n1{left:6%;top:9%}.n2{right:6%;top:11%}.n3{left:3%;top:42%}.n4{right:3%;top:44%}.n5{left:10%;bottom:10%}.n6{right:10%;bottom:9%}.n7{left:39%;top:4%}.n8{left:39%;bottom:4%}.detail{background:var(--paper);color:var(--dark);border-radius:38px;padding:34px;display:flex;flex-direction:column;min-height:610px}.detail .eyebrow{color:#737a75}.detail h3{font:400 clamp(2.2rem,3.6vw,3.8rem)/1 Georgia,serif;margin:10px 0 16px}.detail p{color:#59635e;line-height:1.65}.detail .meta span{border-color:rgba(37,49,47,.15);color:#606964}.detail .ghost{border-color:rgba(37,49,47,.15);color:#273330}.detail .actions{margin-top:auto}.immersive{text-align:center;max-width:820px;margin:auto}.immersive .orb{width:120px;margin:0 auto 30px}.step{font:400 clamp(2.1rem,5vw,4.6rem)/1.12 Georgia,serif;margin:0}.quiet{color:#aeb8b6;line-height:1.65;max-width:620px;margin:26px auto}.bar{height:2px;width:min(420px,80%);background:rgba(255,255,255,.12);margin:38px auto;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);transition:.5s}.body{max-width:720px;margin:30px auto 0;padding-top:24px;border-top:1px solid var(--line);text-align:left;color:#d0d6d3;line-height:1.8}.paper{background:#f1e9dc;color:#32403b;border-radius:28px;padding:28px;border:0}.paper h4,.body h4{font:400 1.8rem Georgia,serif;margin:0 0 12px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:16px}.day{border:1px solid var(--line);border-radius:11px;padding:10px 5px;text-align:center;font-size:.72rem}.return{text-align:center;max-width:760px;margin:auto}.return h2{font:400 clamp(3rem,6vw,5.6rem)/1 Georgia,serif;margin:0 0 16px}.return textarea{width:min(620px,100%);margin-top:22px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:white;border-radius:20px;padding:15px;min-height:95px}.integrate{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:900px;margin:auto}.icard{border:1px solid var(--line);border-radius:28px;padding:26px;min-height:210px;background:rgba(255,255,255,.04);display:flex;flex-direction:column}.icard h3{font:400 2rem Georgia,serif;margin:0 0 10px}.icard p{color:#b9c2bf;line-height:1.6}.icard button{margin-top:auto;width:max-content}.close{text-align:center;max-width:760px;margin:auto}.close h2{font:400 clamp(3rem,7vw,6.2rem)/.98 Georgia,serif;margin:0}.close p{color:#b8c1bf;line-height:1.7;max-width:600px;margin:24px auto 30px}.foot{display:flex;justify-content:space-between;color:#7e8b8a;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase}.pbadge{opacity:0}.review .pbadge{opacity:1}.drawer{position:fixed;inset:0;z-index:30;pointer-events:none}.scrim{position:absolute;inset:0;background:rgba(3,8,12,.58);opacity:0;transition:.3s}.dpanel{position:absolute;right:0;top:0;height:100%;width:min(430px,92vw);background:#f3eee4;color:#28332f;padding:28px;transform:translateX(102%);transition:.4s var(--ease);overflow:auto}.drawer.open{pointer-events:auto}.drawer.open .scrim{opacity:1}.drawer.open .dpanel{transform:none}.dpanel h2{font:400 2.6rem Georgia,serif}.ditem{padding:15px 0;border-top:1px solid rgba(40,51,47,.13)}.ditem small{display:block;color:#727a75;margin-bottom:5px}.link{background:0;border:0;color:#28332f;padding:10px 0;text-align:left}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,12px);opacity:0;background:#f2e8d7;color:#26322f;border-radius:999px;padding:10px 15px;transition:.25s;z-index:50}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:860px){.arrival,.poss,.grid,.integrate{grid-template-columns:1fr}.presence{order:-1;min-height:230px}.orb{width:170px}.mini{height:150px}.exploreHead{align-items:start;flex-direction:column}.detail{min-height:auto}.const{min-height:640px}.days{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.display{font-size:3.1rem}.node{width:145px;font-size:.76rem}.n1{left:3%;top:7%}.n2{right:2%;top:21%}.n3{left:2%;top:36%}.n4{right:2%;top:51%}.n5{left:3%;bottom:20%}.n6{right:3%;bottom:7%}.n7{left:8%;top:65%}.n8{left:auto;right:6%;bottom:33%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const P=[{id:'read',k:'Saber',t:'Lo que depende de vos',s:'Una distinción antigua para recuperar margen de acción.',m:['lectura','5 min','baja/media'],w:'Puede ayudarte a separar lo que merece tu acción de lo que hoy no está enteramente en tus manos.',x:'read'},{id:'ground',k:'Práctica',t:'Volver al suelo',s:'Cuatro minutos para recuperar contacto con cuerpo y entorno.',m:['audio opcional','4 min','pantalla prescindible'],w:'Cuando la cabeza está saturada, quizá primero haga falta recuperar un poco de suelo.',x:'practice'},{id:'peer',k:'Otra vida',t:'Hablar con alguien que ya atravesó algo parecido',s:'Experiencia vivida antes que otro artículo.',m:['1:1','25 min','peer support'],w:'Hay momentos en que una perspectiva humana reconocible vale más que más información.',x:'peer'},{id:'pro',k:'Ayuda competente',t:'Tal vez esto merece una consulta profesional',s:'Una puerta clara cuando una microayuda no alcanza.',m:['referral','credenciales','límites'],w:'Pedir ayuda competente también puede ser una forma concreta de recuperar margen de acción.',x:'pro'},{id:'circle',k:'Círculo',t:'Un círculo pequeño para atravesar una transición',s:'Un espacio finito para escuchar y hablar si se quiere.',m:['6 personas','75 min','3 encuentros'],w:'A veces lo que ayuda no es una respuesta, sino atravesar algo junto a otras vidas.',x:'circle'},{id:'outside',k:'Experiencia',t:'Recuperar horizonte',s:'Empieza acá y después saca a LUMEN del medio.',m:['fuera de pantalla','20 min','mundo real'],w:'Quizá algo cambie de tamaño cuando el cuerpo y la mirada vuelven al mundo.',x:'outside'},{id:'resource',k:'Puerta al mundo',t:'Una puerta concreta para volver a moverte',s:'Cuando la palanca principal está afuera, LUMEN abre una puerta afuera.',m:['recurso real','acceso','vigencia'],w:'No todo necesita introspección. Algunas veces la ayuda correcta es material y externa.',x:'resource'},{id:'path',k:'Camino',t:'Siete días para ordenar una decisión difícil',s:'Una composición editable, no un curso ni una racha.',m:['7 días','editable','sin obligación'],w:'Una decisión difícil puede necesitar tiempo, perspectivas y un experimento reversible.',x:'path'}];
const S={scene:'arrival',text:'',sel:'ground',step:0,outcome:'',reflection:'',review:false,saved:JSON.parse(localStorage.getItem('lumenMockSaved')||'[]'),own:JSON.parse(localStorage.getItem('lumenMockOwn')||'[]'),continuity:JSON.parse(localStorage.getItem('lumenMockContinuity')||'null')};const stage=document.querySelector('#stage'),world=document.querySelector('#world');function cur(){return P.find(p=>p.id===S.sel)||P[1]}function e(v=''){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function presence(x){document.querySelector('#pbadge').textContent=x}function go(x){S.scene=x;S.step=0;render();scrollTo({top:0,behavior:'smooth'})}function render(){world.classList.toggle('review',S.review);stage.innerHTML=`<div class="scene">${V[S.scene]()}</div>`;bind()}function bind(){if(S.scene==='arrival'){const t=document.querySelector('#life');t.value=S.text;t.focus();t.onkeydown=a=>{if(a.key==='Enter'&&!a.shiftKey){a.preventDefault();submit()}}}if(S.scene==='return'){const r=document.querySelector('#reflection');r.value=S.reflection;r.oninput=a=>S.reflection=a.target.value}}
const V={arrival:()=>{presence('P3 · dialogante');return `<div class="arrival"><div><div class="eyebrow">Estás acá</div><h1 class="display">Podés llegar<br>como estás.</h1><p class="lede">Contame lo que está pasando, o simplemente explorá. No hace falta saber qué necesitás.</p><div class="entry"><textarea id="life" rows="1" placeholder="Contame lo que te pasa..."></textarea><button class="send" onclick="submit()">→</button></div><div class="chips"><button class="chip" onclick="door('calm')">Necesito bajar un cambio</button><button class="chip" onclick="door('decision')">Estoy pensando una decisión</button><button class="chip" onclick="go('explore')">Quiero explorar</button></div>${S.continuity?`<p class="lede" style="font-size:.9rem">La última vez quedó algo abierto: <b>${e(S.continuity.t)}</b>. <button class="chip" onclick="resume()">Retomarlo</button></p>`:''}</div><div class="presence"><div class="orb"></div></div></div>`},understand:()=>{presence('P3 · dialogante');return `<div class="flow"><div class="eyebrow">Te escucho</div><p class="lumi">Suena a que hay algo importante ocupando bastante lugar ahora.</p><div class="quote">“${e(S.text||'Hay algo que querés mirar con un poco más de espacio.')}”</div><p class="lede">No necesito entenderlo todo. Sólo lo suficiente para acercarte algo que tenga sentido.</p><div class="actions"><button class="chip" onclick="under('calm')">Quiero bajar un poco el ruido</button><button class="chip" onclick="under('clear')">Quiero verlo más claro</button><button class="chip" onclick="under('human')">Me vendría bien alguien</button><button class="chip" onclick="go('explore')">Prefiero explorar</button></div></div>`},possibility:()=>{presence('P2 · facilitadora');const q=cur();return `<div class="poss"><section class="panel"><div class="eyebrow">Una posibilidad</div><h2>${q.t}</h2><p class="lede">${q.s}</p><div class="meta">${q.m.map(m=>`<span>${m}</span>`).join('')}</div><p class="why"><b>Por qué aparece ahora</b><br>${q.w}</p><div class="actions"><button class="primary" onclick="start()">Quiero probarlo</button><button class="ghost" onclick="nextP()">Prefiero otra cosa</button><button class="ghost" onclick="go('explore')">Abrir posibilidades</button></div></section><aside class="mini"><span>otra mirada</span><span>algo humano</span><span>más breve</span><span>salir al mundo</span></aside></div>`},explore:()=>{presence('P1 · ambiental');const q=cur();return `<div><div class="exploreHead"><div><div class="eyebrow">Posibilidades</div><h1 class="display" style="font-size:clamp(2.8rem,5vw,5.2rem)">No un catálogo.<br>Un campo para tu vida.</h1></div><p class="lede">Saberes, prácticas, personas, ayuda profesional, grupos, lugares, recursos y caminos.</p></div><div class="grid"><div class="const"><div class="center">¿Qué podría<br>sumar ahora?</div>${P.map((p,i)=>`<button class="node n${i+1} ${p.id===q.id?'on':''}" onclick="pick('${p.id}')"><b>${p.t}</b><small>${p.k}</small></button>`).join('')}</div><aside class="detail"><div class="eyebrow">${q.k}</div><h3>${q.t}</h3><p>${q.s}</p><div class="meta">${q.m.map(m=>`<span>${m}</span>`).join('')}</div><p><b>Puede tener sentido si...</b><br>${q.w}</p><div class="actions"><button class="primary" onclick="start()">${['peer','pro','circle'].includes(q.x)?'Ver cómo sería':'Vivirlo'}</button><button class="ghost" onclick="go('arrival')">Volver a lo mío</button></div></aside></div></div>`},experience:()=>experience(),return:()=>{presence('P4 · presencia plena');return `<div class="return"><div class="eyebrow">Volver</div><h2>¿Cómo volvés?</h2><p class="lede" style="margin:auto">No hace falta explicarlo demasiado. Una señal alcanza.</p><div class="actions" style="justify-content:center"><button class="chip" onclick="out('helped')">Me sirvió</button><button class="chip" onclick="out('some')">Un poco</button><button class="chip" onclick="out('different')">Pasó otra cosa</button><button class="chip" onclick="out('no')">No me sirvió</button><button class="chip" onclick="out('unknown')">Todavía no sé</button></div><textarea id="reflection" rows="3" placeholder="Si querés, dejá algo en palabras. También podés no hacerlo."></textarea></div>`},integrate:()=>{presence('P2 · facilitadora');return `<div><div class="flow" style="text-align:center;margin-bottom:32px"><div class="eyebrow">Lo que queda</div><p class="lumi">¿Hay algo de esto que quieras llevarte?</p></div><div class="integrate"><article class="icard"><h3>Guardarlo</h3><p>Conservar esta posibilidad y tu retorno como algo significativo. Queda bajo tu decisión.</p><button class="ghost" onclick="save()">Lo guardo</button></article><article class="icard"><h3>Hacerlo propio</h3><p>Reconocerlo como algo a lo que sabés que podés volver. Sin puntos ni niveles.</p><button class="ghost" onclick="own()">Me puede servir otra vez</button></article><article class="icard"><h3>Dejar una continuidad</h3><p>Que LUMEN pueda traerlo de nuevo si más adelante resulta pertinente. No es un pendiente.</p><button class="ghost" onclick="cont()">Quizá más adelante</button></article><article class="icard"><h3>Soltar</h3><p>No todo necesita quedar registrado. También puede terminar acá.</p><button class="primary" onclick="go('close')">Con esto alcanza</button></article></div></div>`},close:()=>{presence('P0 · retirada');return `<div class="close"><div class="eyebrow">LUMEN se retira</div><h2>Con esto<br>alcanza por ahora.</h2><p>Lo importante no es que te quedes acá. Es que algo de lo vivido pueda viajar con vos, si te sirve.</p><button class="primary" onclick="back()">Volver a mi vida</button></div>`}};
function experience(){presence('P0/P1 · retirada');const q=cur(),st=['Notá tres apoyos físicos. No cambies nada todavía.','Orientá la mirada hacia tres puntos del entorno.','Escuchá dos sonidos sin interpretarlos.','Elegí una sola acción pequeña para después.'];if(q.x==='practice'){let i=Math.min(S.step,3);return `<div class="immersive"><div class="orb"></div><div class="eyebrow">Volver al suelo</div><p class="step">${st[i]}</p><p class="quiet">No hace falta estar en calma. Alcanza con saber un poco mejor dónde estás.</p><div class="bar"><i style="width:${(i+1)*25}%"></i></div><div class="actions" style="justify-content:center"><button class="ghost" onclick="speak('${st[i]}')">Escucharlo</button>${i<3?`<button class="primary" onclick="step()">Seguir</button>`:`<button class="primary" onclick="finish()">Volver</button>`}<button class="ghost" onclick="finish()">Terminar acá</button></div></div>`}if(q.x==='read')return `<div class="immersive"><div class="eyebrow">Lectura contemplativa</div><p class="step">Hay cosas que dependen de vos. Otras no.</p><div class="body paper"><h4>Una distinción para este momento</h4><p>No necesitás abandonar lo que importa. Podés mirar con más precisión dónde existe margen de acción y dónde sólo existe desgaste.</p><p><b>Una pregunta:</b> ¿Cuál es la parte más pequeña y verdadera de esto que sí está en tus manos hoy?</p><small>Raíz: tradición estoica / Epicteto. Adaptación práctica original LUMEN.</small></div><div class="actions" style="justify-content:center"><button class="primary" onclick="finish()">Volver</button></div></div>`;if(q.x==='outside'){let i=Math.min(S.step,3),a=['Elegí un lugar cercano, seguro y accesible —o una ventana.','Mirá algo más lejano de lo habitual.','Dejá que algo del entorno te sorprenda sin buscarlo.','Notá qué problema sigue igual y cuál cambió un poco de tamaño.'];return `<div class="immersive"><div class="orb"></div><div class="eyebrow">Fuera de pantalla</div><p class="step">${a[i]}</p><p class="quiet">LUMEN puede quedarse en silencio. La experiencia ocurre afuera.</p><div class="bar"><i style="width:${(i+1)*25}%"></i></div><div class="actions" style="justify-content:center">${i<3?`<button class="primary" onclick="step()">Siguiente</button>`:`<button class="primary" onclick="finish()">Volví</button>`}<button class="ghost" onclick="finish()">Cerrar y hacerlo por mi cuenta</button></div></div>`}if(q.x==='path')return `<div class="immersive"><div class="eyebrow">Camino editable</div><p class="step">Siete días para ordenar una decisión difícil.</p><div class="body"><p>No es un programa ni una racha. Podés mover, saltear o terminar cualquier parte.</p><div class="days"><div class="day">1<br>Qué importa</div><div class="day">2<br>Hechos/miedos</div><div class="day">3<br>Agencia</div><div class="day">4<br>Otra mirada</div><div class="day">5<br>Probar</div><div class="day">6<br>Reposar</div><div class="day">7<br>Revisar</div></div></div><div class="actions" style="justify-content:center"><button class="primary" onclick="cont();finish()">Podría probarlo</button><button class="ghost" onclick="finish()">No ahora</button></div></div>`;const copy={peer:['Otra vida','A veces no hace falta otra respuesta. Hace falta alguien.','Una conversación breve con una persona cuya experiencia vivida sea pertinente. Identidad y experiencia verificadas, límites visibles y libertad de terminar. Este prototipo no inventa una persona ni simula una reserva.'],pro:['Ayuda competente','Tal vez esto merece una conversación profesional.','LUMEN mostraría tipo de profesional pertinente, por qué podría ayudar, cómo verificar credenciales, qué esperar, territorio, costo y disponibilidad. No diagnostica para derivar.'],circle:['Otras vidas','Un espacio pequeño. Finito. Sin feed.','Seis personas. Tres encuentros. Acuerdo de cuidado, ronda sin obligación de hablar, conversación facilitada y cierre. Este prototipo no convoca un grupo real.'],resource:['Puerta al mundo','No todo se resuelve mirando hacia adentro.','LUMEN puede acercar un recurso público, material u oportunidad concreta con procedencia, territorio, condiciones y vigencia visibles. Si no aplica, ofrece alternativa o NO_MATCH.']}[q.x]||['Experiencia','Esto puede vivirse.','La forma de ayuda cambia; la presencia y la soberanía permanecen.'];return `<div class="immersive"><div class="eyebrow">${copy[0]}</div><p class="step">${copy[1]}</p><div class="body"><h4>${q.t}</h4><p>${copy[2]}</p></div><div class="actions" style="justify-content:center"><button class="primary" onclick="finish()">Volver</button><button class="ghost" onclick="go('explore')">Otra posibilidad</button></div></div>`}
function submit(){S.text=document.querySelector('#life').value.trim();if(!S.text)return toast('Podés escribir algo o elegir una puerta suave.');go('understand')}function door(x){S.text=x==='calm'?'Vengo con bastante ruido y necesito bajar un cambio.':'Estoy pensando una decisión y no termino de verla clara.';go('understand')}function under(x){S.sel=x==='calm'?'ground':x==='clear'?'read':'peer';go('possibility')}function nextP(){let i=P.findIndex(p=>p.id===S.sel);S.sel=P[(i+1)%P.length].id;render()}function pick(id){S.sel=id;render()}function start(){S.step=0;go('experience')}function step(){S.step++;render()}function finish(){go('return')}function out(x){S.outcome=x;go('integrate')}function save(){let q=cur();if(!S.saved.some(x=>x.id===q.id))S.saved.push({id:q.id,t:q.t,r:S.reflection});localStorage.setItem('lumenMockSaved',JSON.stringify(S.saved));toast('Quedó guardado para vos.')}function own(){let q=cur();if(!S.own.some(x=>x.id===q.id))S.own.push({id:q.id,t:q.t});localStorage.setItem('lumenMockOwn',JSON.stringify(S.own));toast('Quedó reconocido como algo a lo que podés volver.')}function cont(){let q=cur();S.continuity={id:q.id,t:q.t};localStorage.setItem('lumenMockContinuity',JSON.stringify(S.continuity));toast('Queda como continuidad elegida, no como pendiente.')}function resume(){if(S.continuity){S.sel=S.continuity.id;go('possibility')}}function back(){S.text='';S.reflection='';S.outcome='';go('arrival')}function speak(t){if(!('speechSynthesis'in window))return toast('La voz no está disponible en este navegador.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-AR';u.rate=.88;speechSynthesis.speak(u)}function toggleReview(){S.review=!S.review;render();toast(S.review?'Modo revisión: ON':'Modo revisión: OFF')}function openDrawer(){document.querySelector('#drawer').classList.add('open');draw()}function closeDrawer(){document.querySelector('#drawer').classList.remove('open')}function draw(){let sv=S.saved.length?S.saved.map(x=>`<div class="ditem"><small>Guardado</small><b>${e(x.t)}</b>${x.r?`<p>${e(x.r)}</p>`:''}</div>`).join(''):'<div class="ditem">Todavía no guardaste nada. Está bien que sea así.</div>',ow=S.own.length?S.own.map(x=>`<div class="ditem"><small>Algo que ya reconocés como propio</small><b>${e(x.t)}</b></div>`).join(''):'<div class="ditem">Tu repertorio puede empezar vacío.</div>';document.querySelector('#drawerBody').innerHTML=`<div class="eyebrow" style="color:#6f7873">Lo tuyo</div><h2>Un lugar propio, no un historial.</h2><button class="link" onclick="closeDrawer();go('explore')">Explorar posibilidades →</button><h3>Guardado</h3>${sv}<h3>Ya sé que me puede servir</h3>${ow}${S.continuity?`<h3>Continuidad elegida</h3><div class="ditem"><b>${e(S.continuity.t)}</b><button class="link" onclick="S.continuity=null;localStorage.removeItem('lumenMockContinuity');draw()">Quitar continuidad</button></div>`:''}`}function toast(t){let n=document.querySelector('#toast');n.textContent=t;n.classList.add('on');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('on'),2200)}render();
</script></body></html>
