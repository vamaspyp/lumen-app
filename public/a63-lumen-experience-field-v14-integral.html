<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMEN · Experience & Sensation Field V1.4</title><style>:root{--bg:#08120e;--fg:#f3f0e8;--mut:#9daba2;--line:rgba(240,244,235,.12);--sage:#91ad97;--warm:#e6c895}*{box-sizing:border-box}body{margin:0;background:#08120e;color:var(--fg);font-family:Inter,system-ui,sans-serif}.world{min-height:100vh;background:radial-gradient(circle at 68% 18%,rgba(214,181,124,.12),transparent 25%),radial-gradient(circle at 18% 45%,rgba(104,151,118,.14),transparent 32%),linear-gradient(150deg,#08120e,#112019 55%,#15251e);padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:.67rem;letter-spacing:.23em;color:#85978b}.tool,.pill{border:1px solid var(--line);background:rgba(255,255,255,.04);color:#dbe1dc;border-radius:999px;padding:10px 14px}.stage{min-height:88vh;display:grid;place-items:center}.field{width:min(1120px,100%);display:grid;grid-template-columns:1.05fr .75fr;gap:7vw;align-items:center}.k{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:#81968a}.copy h1{font:400 clamp(3rem,6.6vw,6.6rem)/.93 Georgia,serif;letter-spacing:-.05em;margin:14px 0 22px}.copy p{color:#a4b0a8;line-height:1.75;max-width:650px}.orbspace{min-height:430px;display:grid;place-items:center}.orb{width:165px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 27%,#f8fbf4 0 3%,#c6dcc7 14%,#84aa8c 43%,#34563f 70%,#142b1d);box-shadow:0 0 145px rgba(117,174,130,.22);animation:b 8s ease-in-out infinite}@keyframes b{50%{transform:scale(1.05)}}textarea{width:100%;min-height:68px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.045);color:#eef1eb;border-radius:22px;padding:18px;font:inherit;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.main{background:#ece6da;color:#1c2922;font-weight:700}.quiet{opacity:.65}.territory{width:min(1000px,100%)}.territory h1{font:400 clamp(2.7rem,5vw,5.2rem)/1 Georgia,serif;margin:10px 0 18px}.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:30px}.mode{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:28px;padding:24px;text-align:left;color:inherit}.mode h2{font:400 1.65rem Georgia,serif;margin:6px 0 10px}.mode p{color:#91a097;line-height:1.55}.mode small{color:#71857a}.const{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}.node{border:1px solid var(--line);border-radius:24px;padding:20px;background:rgba(255,255,255,.035)}.node h3{font:400 1.25rem Georgia,serif;margin:0 0 8px}.node p{color:#8fa095;font-size:.9rem;line-height:1.5}.back{margin-top:24px}.note{margin-top:28px;color:#71857a;font:italic 1rem Georgia,serif}.own{background:linear-gradient(145deg,#f1ebdf,#e4ddd1);color:#27322d;border-radius:38px;padding:42px}.own p{color:#5d6861}.human{background:radial-gradient(circle at 50% 10%,rgba(113,144,181,.18),transparent 35%),#0a1218}.fade{animation:f .6s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}}@media(max-width:820px){.field{grid-template-columns:1fr}.orbspace{min-height:260px;order:-1}.modes,.const{grid-template-columns:1fr}.copy h1{font-size:3.4rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main class="world" id="world"><header class="top"><div class="brand">LUMEN · PRESENCIA</div><button class="tool" onclick="home()">Salir</button></header><div class="stage" id="root"></div></main><script>const r=document.querySelector('#root');function set(x){r.innerHTML=x;r.firstElementChild?.classList.add('fade')}function home(){set(`<section class="field"><div class="copy"><div class="k">Estoy acá</div><h1>¿Qué está vivo ahora?</h1><p>No necesitás elegir una parte de LUMEN ni saber qué pedir. Podés contarme algo, quedarte un momento o simplemente moverte y ver qué encontrás.</p><textarea aria-label="Expresión libre" placeholder="Podés empezar por donde quieras..."></textarea><div class="row"><button class="pill main" onclick="moment()">Compartir</button><button class="pill" onclick="explore()">Quiero explorar</button></div><div class="note">Acompañarte cuando lo necesitás. Dejarte andar cuando querés explorar.</div></div><div class="orbspace"><div class="orb"></div></div></section>`)}function moment(){set(`<section class="field"><div class="copy"><div class="k">Escuchando</div><h1>No hace falta resolverlo todo ahora.</h1><p>Puedo quedarme con vos para comprender un poco mejor, acercar una posibilidad o simplemente dejar espacio. Y si en algún momento querés moverte por tu cuenta, el territorio sigue abierto.</p><div class="row"><button class="pill main" onclick="poss()">Ver qué podría ayudar</button><button class="pill" onclick="explore()">Prefiero explorar</button><button class="pill quiet" onclick="home()">Con esto alcanza</button></div></div><div class="orbspace"><div class="orb"></div></div></section>`)}function poss(){set(`<section class="territory"><div class="k">Una posibilidad</div><h1>Algo pequeño podría tener sentido ahora.</h1><p style="color:#9daba2;max-width:700px">Podemos vivirlo, buscar otra cosa, recuperar algo tuyo o abrir el territorio. La posibilidad no cierra el universo.</p><div class="row"><button class="pill main" onclick="live()">Quiero probarlo</button><button class="pill" onclick="source()">Ver otras posibilidades</button><button class="pill" onclick="mine()">Ver algo mío</button><button class="pill" onclick="tissue()">Acercarme a otras vidas</button></div></section>`)}function live(){set(`<section class="field"><div class="copy"><div class="k">Experiencia</div><h1>Ahora puede tocar vivir.</h1><p>LUMEN baja la voz. Podés quedarte, salir de la pantalla o volver después. No hay obligación de completar ni reportar.</p><div class="row"><button class="pill main" onclick="ret()">Volví</button><button class="pill quiet" onclick="home()">Ir a mi vida</button></div></div><div class="orbspace"><div class="orb" style="opacity:.22;transform:scale(.7)"></div></div></section>`)}function ret(){set(`<section class="field"><div class="copy"><div class="k">Retorno</div><h1>¿Qué quedó?</h1><p>No es una encuesta. Puede haber ayudado, no haber ayudado, seguir abierto o no necesitar palabras.</p><div class="row"><button class="pill main" onclick="mine()">Hay algo que quiero conservar</button><button class="pill" onclick="source()">Quiero variar</button><button class="pill quiet" onclick="home()">No quiero hablar de esto</button></div></div><div class="orbspace"><div class="orb"></div></div></section>`)}function explore(){set(`<section class="territory"><div class="k">Movimiento libre</div><h1>¿Por dónde querés andar?</h1><p style="color:#9daba2;max-width:760px">No necesitás traer un problema. Podés descubrir posibilidades, recorrer lo que es tuyo, acercarte a otras vidas o simplemente deambular. No son módulos: son formas de moverte dentro del mismo LUMEN.</p><div class="modes"><button class="mode" onclick="source()"><small>DESCUBRIR</small><h2>Explorar posibilidades</h2><p>Sabiduría, prácticas, experiencias, personas, lugares, recursos y caminos conectados por significado.</p></button><button class="mode" onclick="mine()"><small>LO TUYO</small><h2>Recorrer mi territorio</h2><p>Faros, caminos, recuerdos elegidos, experiencias y recursos que ya forman parte de tu vida.</p></button><button class="mode" onclick="tissue()"><small>OTRAS VIDAS</small><h2>Acercarme al Tejido</h2><p>Personas, círculos, encuentros y formas de pedir u ofrecer valor sin feed, ranking ni popularidad.</p></button><button class="mode" onclick="wander()"><small>SIN OBJETIVO</small><h2>Deambular</h2><p>No buscar exactamente nada. Dejar espacio para encontrar algo inesperado sin que LUMEN capture tu atención.</p></button></div><button class="pill back" onclick="home()">Volver a la presencia</button></section>`)}function source(){set(`<section class="territory"><div class="k">Reservorio vivo</div><h1>¿Qué podría ser valioso para tu vida ahora?</h1><p style="color:#9daba2">Podés seguir relaciones, no categorías rígidas. Cada cosa puede abrir otra mirada, algo más breve, más profundo, humano, cercano o contrastante.</p><div class="const"><div class="node"><h3>Comprender</h3><p>Una perspectiva que ordena sin cerrar.</p></div><div class="node"><h3>Practicar</h3><p>Algo breve que se vive, no sólo se lee.</p></div><div class="node"><h3>Escuchar</h3><p>Audio para bajar pantalla y cambiar ritmo.</p></div><div class="node"><h3>Encontrarnos</h3><p>Otra vida, círculo o encuentro humano.</p></div><div class="node"><h3>Actuar</h3><p>Un gesto concreto en el mundo real.</p></div><div class="node"><h3>Profundizar</h3><p>Una obra o recurso con procedencia.</p></div><div class="node"><h3>Ir</h3><p>Un lugar, evento o experiencia presencial.</p></div><div class="node"><h3>Recibir ayuda</h3><p>Apoyo profesional, material o servicio con límites claros.</p></div><div class="node"><h3>Otra mirada</h3><p>Contraste seguro para no quedar encerrado en lo conocido.</p></div></div><div class="row"><button class="pill" onclick="poss()">Abrir una posibilidad</button><button class="pill" onclick="mine()">Relacionar con algo mío</button><button class="pill" onclick="tissue()">Seguir hacia algo humano</button><button class="pill" onclick="explore()">Seguir andando</button></div></section>`)}function mine(){set(`<section class="territory own"><div class="k">Tu territorio</div><h1 style="font:400 clamp(2.8rem,5vw,5rem)/1 Georgia,serif">Lo que elegiste llevar con vos.</h1><p>No es historial ni tablero de progreso. Son hilos que podés reencontrar, cambiar, relacionar o soltar.</p><div class="const"><div class="node"><h3>Un Faro</h3><p>“Vivir con más espacio y menos apuro.” Editable, pausable, abandonable.</p></div><div class="node"><h3>Algo que ayudó</h3><p>Una práctica que ya sabés usar por tu cuenta.</p></div><div class="node"><h3>Una reflexión</h3><p>Algo que decidiste conservar porque importa para vos.</p></div><div class="node"><h3>Un vínculo</h3><p>Una persona o círculo significativo que quisiste recordar.</p></div></div><div class="row"><button class="pill" onclick="source()">Buscar algo relacionado</button><button class="pill" onclick="tissue()">Abrir hacia otras vidas</button><button class="pill" onclick="moment()">Traer algo al presente</button><button class="pill" onclick="explore()">Seguir recorriendo</button></div></section>`)}function tissue(){document.querySelector('#world').classList.add('human');set(`<section class="territory"><div class="k">Vida acompañando Vida</div><h1>También podés acercarte sin que LUMI te derive.</h1><p style="color:#9daba2;max-width:760px">Explorá por propósito, contexto, disponibilidad, límites y seguridad. No hay seguidores, likes ni ranking. Podés mirar, pedir, ofrecer, entrar, salir o reportar.</p><div class="const"><div class="node"><h3>Un círculo pequeño</h3><p>Personas atravesando algo parecido, con propósito y bordes claros.</p></div><div class="node"><h3>Una conversación 1:1</h3><p>Un par dispuesto a escuchar o compartir experiencia.</p></div><div class="node"><h3>Alguien con oficio</h3><p>Mentor, facilitador o profesional cuando la competencia importa.</p></div><div class="node"><h3>Ofrecer algo</h3><p>Derramar voluntariamente valor que ya podés llevar, sin status.</p></div></div><div class="row"><button class="pill main" onclick="human()">Entrar a un encuentro</button><button class="pill" onclick="explore()">Seguir explorando</button><button class="pill quiet" onclick="home()">No ahora</button></div></section>`)}function human(){set(`<section class="field"><div class="copy"><div class="k">LUMEN sostiene los bordes</div><h1>Ahora, Vida acompaña Vida.</h1><p>La otra persona toma el centro. LUMEN se retira; quedan disponibles sólo salida, cuidado y reporte.</p><div class="row"><button class="pill" onclick="ret()">El encuentro terminó</button><button class="pill quiet" onclick="home()">Salir / reportar</button></div></div><div class="orbspace"><div class="orb" style="opacity:.05;transform:scale(.4)"></div></div></section>`)}function wander(){set(`<section class="field"><div class="copy"><div class="k">Deambular</div><h1>No hace falta buscar.</h1><p>Podés quedarte un poco y dejar que algo aparezca. Sin feed infinito, sin ranking, sin urgencia. Una sola apertura cada vez.</p><div class="row"><button class="pill main" onclick="source()">Apareció algo que quiero seguir</button><button class="pill" onclick="mine()">Me hizo acordar a algo mío</button><button class="pill quiet" onclick="home()">Seguir mi día</button></div><div class="note">La curiosidad también es una forma legítima de llegar.</div></div><div class="orbspace"><div class="orb"></div></div></section>`)}home();</script></body></html>
