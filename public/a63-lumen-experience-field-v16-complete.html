<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09130f"><title>LUMEN · Field V16 Complete</title><style>
:root{--ink:#f3efe6;--mut:#9caaa1;--line:rgba(242,239,230,.13);--soft:rgba(255,255,255,.045);--sage:#9db59f;--gold:#d7bd8c;--danger:#e6b0a4}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09130f;color:var(--ink);font-family:Inter,system-ui,sans-serif}button,input,textarea{font:inherit}.world{min-height:100vh;background:radial-gradient(circle at var(--x,76%) var(--y,16%),rgba(220,184,119,.11),transparent 28%),radial-gradient(circle at 14% 55%,rgba(111,161,126,.13),transparent 34%),linear-gradient(145deg,#08110d,#102019 58%,#13241d);transition:.8s}.grain{position:fixed;inset:0;pointer-events:none;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}.top{position:fixed;z-index:8;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:linear-gradient(#09130fe8,transparent)}.brand{font-size:.64rem;letter-spacing:.22em;color:#829389}.tools,.row{display:flex;gap:8px;flex-wrap:wrap}.btn,.chip{border:1px solid var(--line);background:rgba(255,255,255,.04);color:#dce2dc;border-radius:999px;padding:10px 14px;cursor:pointer}.btn:hover,.chip:hover,.card:hover{background:rgba(255,255,255,.075)}.primary{background:#eee7da;color:#1c2922;font-weight:700}.danger{border-color:rgba(230,176,164,.35);color:#f0c7be}.stage{min-height:100vh;padding:94px 6vw 70px;display:grid;place-items:center}.scene{width:min(1120px,100%);animation:enter .45s ease}.hero{display:grid;grid-template-columns:1.08fr .72fr;gap:7vw;align-items:center}.eyebrow{font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:#82968a}.hero h1,.scene>h1{font:400 clamp(3rem,6vw,6rem)/.96 Georgia,serif;letter-spacing:-.045em;margin:14px 0 20px}.lead{max-width:760px;color:var(--mut);line-height:1.72;font-size:1.03rem}.orbwrap{min-height:370px;display:grid;place-items:center}.orb{width:158px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 27%,#fafcf6 0 3%,#c9ddc9 14%,#84aa8d 43%,#34563f 70%,#142b1d);box-shadow:0 0 145px rgba(117,174,130,.23);animation:breathe 8s ease-in-out infinite}.orb.small{width:38px;box-shadow:0 0 45px rgba(117,174,130,.18)}textarea,input{width:100%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.045);color:#eef1eb;border-radius:20px;padding:16px;outline:none}.row{margin-top:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:26px}.grid.two{grid-template-columns:repeat(2,1fr)}.card{border:1px solid var(--line);background:var(--soft);border-radius:26px;padding:21px;min-height:145px;cursor:pointer;transition:.25s}.card h2,.card h3{font:400 1.4rem Georgia,serif;margin:7px 0 9px}.card p{color:#93a198;line-height:1.55;margin:0}.card small{color:#74877c;letter-spacing:.09em}.resource{display:grid;grid-template-columns:1fr .82fr;gap:6vw}.viewer{border:1px solid var(--line);border-radius:34px;padding:30px;background:rgba(255,255,255,.035);min-height:390px}.viewer h2{font:400 2.05rem Georgia,serif}.meta{font-size:.77rem;color:#7f9187;line-height:1.6}.quiet{opacity:.67}.note{font:italic 1rem Georgia,serif;color:#809187;margin-top:24px}.sep{height:1px;background:var(--line);margin:22px 0}.wave{height:130px;display:flex;gap:5px;align-items:center;justify-content:center}.wave i{width:3px;height:20px;background:#a9bea9;border-radius:4px;animation:wave 2s ease-in-out infinite}.wave i:nth-child(2n){animation-delay:.35s}.video{aspect-ratio:16/9;border-radius:22px;background:radial-gradient(circle,rgba(213,188,141,.2),transparent 28%),#0c1511;display:grid;place-items:center}.play{width:68px;aspect-ratio:1;border:1px solid #ffffff40;border-radius:50%;display:grid;place-items:center}.breath{width:110px;aspect-ratio:1;border:1px solid #7f9d86;border-radius:50%;margin:65px auto;animation:breathe 7s ease-in-out infinite}.lumi{position:fixed;z-index:9;right:20px;bottom:18px;border:1px solid var(--line);background:#102019dc;backdrop-filter:blur(12px);border-radius:999px;padding:8px 11px;color:#a9b6ae;display:flex;align-items:center;gap:8px;cursor:pointer}.panel{position:fixed;z-index:12;right:20px;bottom:72px;width:min(390px,calc(100vw - 40px));padding:21px;border:1px solid var(--line);border-radius:25px;background:#102019f7;display:none}.panel.on{display:block}.panel h3{font:400 1.45rem Georgia,serif;margin:0 0 8px}.panel p{color:#98a69d;line-height:1.55}.qa{position:fixed;z-index:14;left:18px;bottom:18px}.qaMenu{position:fixed;z-index:15;left:18px;bottom:62px;width:min(340px,calc(100vw - 36px));padding:17px;border:1px solid var(--line);border-radius:22px;background:#102019f8;display:none}.qaMenu.on{display:block}.qaMenu .btn{margin:3px}.circle{width:min(390px,80vw);aspect-ratio:1;border:1px solid var(--line);border-radius:50%;margin:30px auto;display:grid;place-items:center;text-align:center;color:#8fa096}.status{border-left:1px solid rgba(215,189,140,.35);padding:15px 20px;margin:20px 0;color:#bdc8c1;line-height:1.65}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@keyframes breathe{50%{transform:scale(1.055);filter:brightness(1.06)}}@keyframes wave{50%{height:60px}}@keyframes enter{from{opacity:0;transform:translateY(8px)}}@media(max-width:820px){.hero,.resource{grid-template-columns:1fr}.orbwrap{min-height:230px;order:-1}.grid,.grid.two{grid-template-columns:1fr}.stage{padding-inline:21px}.hero h1,.scene>h1{font-size:3.2rem}.top{padding:14px}.qa{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="world" id="world"><div class="grain"></div><header class="top"><div class="brand">LUMEN · PRESENCIA</div><div class="tools"><button class="btn" onclick="explore()">Explorar</button><button class="btn quiet" onclick="home()">Salir</button></div></header><main class="stage" id="root" aria-live="polite"></main><button class="lumi" onclick="toggleLumi()" aria-label="Hablar con LUMI"><span class="orb small"></span><span>LUMI · disponible</span></button><aside class="panel" id="panel"><h3>Estoy acá.</h3><p>Puedo ayudarte a mirar lo que estás viviendo, explicar por qué apareció algo, buscar otra posibilidad o dejarte seguir por tu cuenta.</p><textarea aria-label="Hablar con LUMI" placeholder="Decime lo que necesites..."></textarea><div class="row"><button class="btn primary" onclick="moment()">Conversar</button><button class="btn" onclick="toggleLumi()">Seguir por mi cuenta</button></div></aside><button class="btn qa" onclick="toggleQA()">QA · fisiología</button><aside class="qaMenu" id="qa"><div class="eyebrow">Escenarios invisibles en experiencia normal</div><div class="row"><button class="btn" onclick="arrival('return')">Retorno</button><button class="btn" onclick="arrival('memory')">Memoria</button><button class="btn" onclick="clarify()">Incertidumbre</button><button class="btn" onclick="noMatch()">NO_MATCH</button><button class="btn danger" onclick="safety()">Safety</button><button class="btn" onclick="proactive()">Proactividad</button><button class="btn" onclick="memory()">Privacidad</button><button class="btn" onclick="accessibility()">Accesibilidad</button></div></aside></div><script>
const R=document.querySelector('#root'),P=document.querySelector('#panel'),Q=document.querySelector('#qa');const K='lumen-v16';let S=JSON.parse(localStorage.getItem(K)||'{"memory":true,"proactive":false,"own":[]}');function save(){localStorage.setItem(K,JSON.stringify(S))}function set(x){R.innerHTML=x;P.classList.remove('on');Q.classList.remove('on');scrollTo(0,0)}function toggleLumi(){P.classList.toggle('on')}function toggleQA(){Q.classList.toggle('on')}
function home(){arrival('first')}function arrival(kind){let copy=kind==='return'?'Qué bueno volver a encontrarnos. No hace falta retomar nada. ¿Qué está vivo ahora?':kind==='memory'?'Recuerdo algo que elegiste conservar. Puedo tenerlo en cuenta, corregirlo, olvidarlo o empezar limpio.':'¿Qué está vivo ahora?';set(`<section class="scene hero"><div><div class="eyebrow">Estoy acá</div><h1>${copy}</h1><p class="lead">Podés contarme algo, quedarte en silencio o recorrer LUMEN por tu cuenta. No necesitás saber qué función usar.</p>${kind==='memory'?'<div class="status">Hace un tiempo elegiste conservar: “cuando camino sin apuro, pienso mejor”. El presente manda sobre este recuerdo.</div>':''}<textarea id="life" placeholder="Podés empezar por donde quieras..." aria-label="Expresión libre"></textarea><div class="row"><button class="btn primary" onclick="understand()">Compartir</button><button class="btn" onclick="explore()">Quiero explorar</button><button class="btn quiet" onclick="quiet()">Sólo estar</button></div>${kind==='memory'?'<div class="row"><button class="btn" onclick="memory()">Ver por qué lo recuerdo</button></div>':''}<p class="note">La forma cambia. La relación permanece.</p></div><div class="orbwrap"><div class="orb"></div></div></section>`)}
function understand(){set(`<section class="scene hero"><div><div class="eyebrow">Comprensión tentativa</div><h1>No necesito encerrarlo en una categoría.</h1><p class="lead">Parece que hay algo que te está pidiendo espacio y claridad. Puedo equivocarme: corregime si no es eso.</p><div class="row"><button class="btn primary" onclick="possibility()">Sí, sigamos</button><button class="btn" onclick="clarify()">No exactamente</button><button class="btn" onclick="moment()">Es otra cosa</button><button class="btn quiet" onclick="home()">Con esto alcanza</button></div></div><div class="orbwrap"><div class="orb"></div></div></section>`)}
function clarify(){set(`<section class="scene hero"><div><div class="eyebrow">No voy a fingir entender</div><h1>¿Qué cambiaría más la ayuda?</h1><p class="lead">Sólo una aclaración: ¿lo que más pesa ahora es entender qué te pasa, decidir qué hacer, o atravesar este momento?</p><div class="row"><button class="btn" onclick="possibility()">Entender</button><button class="btn" onclick="source()">Decidir</button><button class="btn" onclick="resource('practice')">Atravesarlo</button><button class="btn" onclick="moment()">Prefiero contarlo de otra manera</button></div></div><div class="orbwrap"><div class="orb"></div></div></section>`)}
function moment(){set(`<section class="scene hero"><div><div class="eyebrow">Acompañamiento</div><h1>Podemos mirar esto juntos.</h1><p class="lead">Sin convertir tu vida en un formulario. Podés hablar libremente; LUMI pregunta sólo cuando una respuesta cambia materialmente lo que puede acercarte.</p><textarea placeholder="Contame como te salga..."></textarea><div class="row"><button class="btn primary" onclick="understand()">Seguir</button><button class="btn" onclick="explore()">Explorar por mi cuenta</button><button class="btn quiet" onclick="quiet()">No quiero hablar ahora</button></div></div><div class="orbwrap"><div class="orb"></div></div></section>`)}
function possibility(){set(`<section class="scene"><div class="eyebrow">Una posibilidad, no una orden</div><h1>Hacer un poco de espacio.</h1><p class="lead">Por lo que contaste, una experiencia breve puede ser más útil que seguir pensando. También podés elegir otra mirada, recuperar algo que ya sabés que te sirve o no hacer nada.</p><div class="grid two"><article class="card" onclick="resource('practice')"><small>AHORA · 2 MIN</small><h2>Dos minutos de espacio</h2><p>Una práctica mínima. Cuando empieza, LUMI se retira.</p></article><article class="card" onclick="territory()"><small>ALGO PROPIO</small><h2>Volver a lo que ya te ayuda</h2><p>Antes de ofrecer novedad, recuperar capacidad propia cuando tiene sentido.</p></article></div><div class="row"><button class="btn" onclick="source()">Ver otras posibilidades</button><button class="btn" onclick="why()">¿Por qué esto?</button><button class="btn quiet" onclick="home()">No quiero nada ahora</button></div></section>`)}
function why(){set(`<section class="scene hero"><div><div class="eyebrow">Criterio visible</div><h1>Porque parece aplicable ahora, no porque sea popular.</h1><p class="lead">La sugerencia combina lo que expresaste, el poco tiempo disponible y una posibilidad de bajo riesgo. No es diagnóstico ni certeza. Podés corregirme y elegir otra cosa.</p><div class="row"><button class="btn primary" onclick="resource('practice')">Probar</button><button class="btn" onclick="source()">Otra posibilidad</button><button class="btn" onclick="clarify()">No entendiste bien</button></div></div><div class="orbwrap"><div class="orb small"></div></div></section>`)}
function explore(){set(`<section class="scene"><div class="eyebrow">Movimiento libre</div><h1>Podés andar sin pedir permiso.</h1><p class="lead">El mismo Field cambia de densidad. No son módulos ni productos distintos.</p><div class="grid two"><article class="card" onclick="source()"><small>FUENTE</small><h2>Explorar posibilidades</h2><p>Sabiduría, experiencias, personas, lugares y ayuda real.</p></article><article class="card" onclick="territory()"><small>TERRITORIO PROPIO</small><h2>Recorrer lo mío</h2><p>Faros, Caminos, Santuario, Repertorio e hitos sin dashboard.</p></article><article class="card" onclick="tissue()"><small>TEJIDO</small><h2>Acercarme a otras vidas</h2><p>Personas, círculos, encuentros, pedir y ofrecer sin red social.</p></article><article class="card" onclick="wander()"><small>CURIOSIDAD</small><h2>Deambular</h2><p>Una apertura cada vez, sin feed, ranking ni urgencia.</p></article></div></section>`)}
const resources={reflection:['PERSPECTIVA','Una idea que abre','Una lectura breve que puede ordenar sin cerrar lo que estás viviendo.','Ensayo contemporáneo · 4 min · procedencia visible'],work:['OBRA / RECURSO','Profundizar en una fuente','Una obra externa aparece con autoría, acceso y razón de pertinencia.','Autor y procedencia · acceso externo · 18 min'],action:['ACCIÓN REAL','Cerrar la pantalla puede ser la experiencia','Llamar a alguien, caminar, ordenar una conversación o hacer un gesto en el mundo.','Fuera de pantalla · retorno opcional'],place:['LUGAR / EVENTO','Ir donde algo puede pasar','Un encuentro presencial con disponibilidad, condiciones, accesibilidad y salida claras.','Presencial · disponibilidad real · costo si aplica'],help:['AYUDA PROFESIONAL / MATERIAL','Cuando pensar no es el recurso correcto','Una persona, servicio o apoyo concreto con competencia, límites, disponibilidad y costo cuando importa.','Ayuda real · procedencia · límites explícitos'],quiet:['SILENCIO','No agregar también puede ser ayuda','No todo momento necesita contenido, práctica o conversación. LUMEN puede simplemente dejar espacio.','Sin tarea · sin retorno obligatorio']};
function source(){set(`<section class="scene"><div class="eyebrow">Fuente · reservorio vivo</div><h1>Descubrir con criterio.</h1><p class="lead">Buscar algo conocido o seguir relaciones: más breve, más profundo, otra mirada, algo humano, algo real, algo propio. No es un catálogo infinito.</p><input placeholder="Buscar una idea, persona, práctica, lugar..." aria-label="Buscar en Fuente"><div class="row"><button class="chip" onclick="resource('reflection')">Otra mirada</button><button class="chip" onclick="resource('practice')">Algo breve</button><button class="chip" onclick="resource('audio')">Escuchar</button><button class="chip" onclick="resource('video')">Ver</button><button class="chip" onclick="resource('human')">Algo humano</button></div><div class="grid"><article class="card" onclick="resource('reflection')"><small>PERSPECTIVA</small><h3>Una idea que abre</h3><p>Texto con procedencia y contraste.</p></article><article class="card" onclick="resource('practice')"><small>PRÁCTICA</small><h3>Dos minutos de espacio</h3><p>Vivir antes que consumir.</p></article><article class="card" onclick="resource('audio')"><small>AUDIO</small><h3>Caminar y escuchar</h3><p>Continuidad fuera de pantalla.</p></article><article class="card" onclick="resource('video')"><small>VIDEO</small><h3>Ver a alguien pensar</h3><p>Imagen sólo cuando agrega valor.</p></article><article class="card" onclick="resource('work')"><small>OBRA</small><h3>Profundizar</h3><p>Autoría, acceso y contexto.</p></article><article class="card" onclick="resource('action')"><small>ACCIÓN REAL</small><h3>Hacer algo afuera</h3><p>La Vida toma el centro.</p></article><article class="card" onclick="tissue()"><small>PERSONA / CÍRCULO</small><h3>Encontrar otra vida</h3><p>LUMEN deja de protagonizar.</p></article><article class="card" onclick="resource('place')"><small>LUGAR / EVENTO</small><h3>Ir</h3><p>Condiciones reales y accesibles.</p></article><article class="card" onclick="resource('help')"><small>AYUDA CONCRETA</small><h3>Recibir apoyo</h3><p>Profesional, material o servicio.</p></article><article class="card" onclick="resource('quiet')"><small>QUIETUD</small><h3>No agregar</h3><p>El silencio también es posibilidad.</p></article></div></section>`)}
function resource(k){if(k==='practice')return practice();if(k==='audio')return audio();if(k==='video')return video();if(k==='human')return tissue();let d=resources[k]||resources.reflection;set(`<section class="scene resource"><div><div class="eyebrow">${d[0]}</div><h1>${d[1]}</h1><p class="lead">${d[2]}</p><div class="row"><button class="btn primary" onclick="experience('${k}')">Vivir esto</button><button class="btn" onclick="source()">Otra posibilidad</button><button class="btn quiet" onclick="home()">Dejarlo</button></div></div><div class="viewer"><div class="meta">${d[3]}</div><div class="sep"></div><h2>Lo necesario, no todo.</h2><p class="lead">Procedencia, condiciones, riesgo, costo o disponibilidad aparecen sólo cuando cambian tu decisión o tu seguridad.</p><button class="btn" onclick="why()">Por qué podría servirme</button></div></section>`)}
function practice(){set(`<section class="scene"><div class="eyebrow">Práctica · LUMI P0/P1</div><div class="breath"></div><h1 style="text-align:center">Dejá que la exhalación dure un poco más.</h1><p class="lead" style="margin:auto;text-align:center">No hay puntaje ni objetivo. Podés detenerte en cualquier momento.</p><div class="row" style="justify-content:center"><button class="btn primary" onclick="ret()">Terminar</button><button class="btn" onclick="home()">Salir sin responder</button></div></section>`)}
function audio(){set(`<section class="scene resource"><div><div class="eyebrow">Audio · fuera de pantalla</div><h1>Caminar y escuchar.</h1><p class="lead">Sin autoplay. Podés bloquear la pantalla y seguir. LUMI queda ambiental.</p><div class="wave">${'<i></i>'.repeat(15)}</div><div class="row"><button class="btn primary" onclick="ret()">▶ Escuchar</button><button class="btn">Transcripción</button><button class="btn">Velocidad</button></div></div><div class="viewer"><div class="meta">5 min · transcripción disponible · control de audio · accesible</div><h2>La pantalla no es el destino.</h2><p class="lead">Si volvés después, LUMEN puede recibir el retorno sin exigir que sea inmediato.</p></div></section>`)}
function video(){set(`<section class="scene resource"><div><div class="eyebrow">Video · presencia humana</div><h1>Ver a alguien pensar.</h1><div class="video"><div class="play">▶</div></div><div class="row"><button class="btn primary" onclick="ret()">Ver</button><button class="btn">Subtítulos</button><button class="btn">Transcripción</button></div></div><div class="viewer"><div class="meta">Autoría · procedencia · 8 min · subtítulos · descripción alternativa</div><h2>Imagen cuando agrega algo.</h2><p class="lead">Podés cambiar a lectura, buscar otra mirada o acercarte a una persona.</p></div></section>`)}
function experience(k){set(`<section class="scene hero"><div><div class="eyebrow">La Vida toma el centro</div><h1>Andá. LUMEN espera.</h1><p class="lead">No necesitás permanecer acá para que esto cuente. Cuando una acción, lugar, obra o persona conduce, LUMI se retira.</p><div class="row"><button class="btn primary" onclick="ret()">Volví</button><button class="btn quiet" onclick="home()">Cerrar</button></div></div><div class="orbwrap"><div class="orb small" style="opacity:.25"></div></div></section>`)}
function ret(){set(`<section class="scene"><div class="eyebrow">Retorno · breve y soberano</div><h1>¿Qué dejó esto?</h1><p class="lead">No es una encuesta. Una señal alcanza; también podés no responder.</p><div class="row"><button class="btn primary" onclick="integrate('helped')">Me ayudó</button><button class="btn" onclick="integrate('no')">No me ayudó</button><button class="btn" onclick="integrate('unsure')">No sé todavía</button><button class="btn" onclick="integrate('other')">Pasó otra cosa</button><button class="btn" onclick="source()">Quiero variar</button><button class="btn quiet" onclick="home()">No quiero hablar de esto</button></div></section>`)}
function integrate(x){let lead=x==='helped'?'Podés dejarlo acá, guardarlo, hacerlo parte de tu repertorio o relacionarlo con una dirección elegida.':x==='no'?'Gracias. No voy a insistir con lo mismo. Podemos variar, entender qué no encajó o dejarlo.':'No hace falta cerrar una conclusión ahora.';set(`<section class="scene"><div class="eyebrow">Integración sin presión</div><h1>${x==='helped'?'Que haya servido no crea una obligación.':'Esto también es información.'}</h1><p class="lead">${lead}</p><div class="row"><button class="btn" onclick="sanctuary()">Guardar porque importa</button><button class="btn" onclick="repertoire()">Hacerlo propio</button><button class="btn" onclick="faro()">Relacionar con un Faro</button><button class="btn" onclick="source()">Variar</button><button class="btn quiet" onclick="home()">Soltar</button></div></section>`)}
function territory(){set(`<section class="scene"><div class="eyebrow">Territorio propio · mismo Field, más íntimo</div><h1>Lo que elegiste conservar.</h1><p class="lead">No es un dashboard sobre tu vida. El presente puede interrumpir, cambiar o volver irrelevante cualquier continuidad.</p><div class="grid"><article class="card" onclick="faro()"><small>FARO</small><h3>Lo que hoy orienta</h3><p>Editable, pausable, redefinible.</p></article><article class="card" onclick="camino()"><small>CAMINO</small><h3>Una ruta posible</h3><p>No secuencia obligatoria.</p></article><article class="card" onclick="sanctuary()"><small>SANTUARIO</small><h3>Lo que importa para mí</h3><p>Íntimo, corregible, exportable, borrable.</p></article><article class="card" onclick="repertoire()"><small>REPERTORIO</small><h3>Lo que ya sé que puedo usar</h3><p>Capacidad propia, no score.</p></article><article class="card" onclick="milestones()"><small>HITOS</small><h3>Cosas que reconozco</h3><p>Hechos de vida, no badges.</p></article><article class="card" onclick="memory()"><small>MEMORIA</small><h3>Qué puede recordar LUMEN</h3><p>Razón visible y soberanía.</p></article></div></section>`)}
function faro(){set(`<section class="scene"><div class="eyebrow">Faro · orientación elegida</div><h1>“Quiero vivir con más presencia y menos apuro.”</h1><p class="lead">No es KPI. Podés cambiarlo, pausarlo, abandonarlo o dejar que el Momento actual tenga prioridad.</p><textarea>Quiero vivir con más presencia y menos apuro.</textarea><div class="row"><button class="btn primary" onclick="territory()">Guardar cambio</button><button class="btn">Pausar</button><button class="btn">Redefinir</button><button class="btn danger" onclick="territory()">Soltar Faro</button></div></section>`)}
function camino(){set(`<section class="scene"><div class="eyebrow">Camino · sugerencia editable</div><h1>No hay que cumplir una secuencia.</h1><div class="grid"><article class="card"><small>POSIBLE</small><h3>Volver a una práctica propia</h3><p>Repetir o variar.</p></article><article class="card"><small>POSIBLE</small><h3>Conversar con alguien</h3><p>Otra vida puede ser el siguiente movimiento.</p></article><article class="card"><small>POSIBLE</small><h3>No hacer nada todavía</h3><p>La pausa también pertenece.</p></article></div><div class="row"><button class="btn">Cambiar orden</button><button class="btn">Saltar</button><button class="btn">Pausar Camino</button><button class="btn danger" onclick="territory()">Abandonar</button></div></section>`)}
function sanctuary(){set(`<section class="scene resource"><div><div class="eyebrow">Santuario · pertenencia</div><h1>“Esto importa para mí.”</h1><p class="lead">Una frase, reflexión o experiencia elegida. No se convierte automáticamente en evidencia colectiva ni se muestra sin contexto.</p><textarea>Cuando camino sin apuro, pienso mejor.</textarea><div class="row"><button class="btn primary" onclick="territory()">Guardar</button><button class="btn">Agregar reflexión</button><button class="btn">Exportar</button><button class="btn danger">Borrar</button></div></div><div class="viewer"><h2>Por qué está acá</h2><p class="lead">Lo guardaste después de una experiencia que marcaste como útil. Elegiste permitir que LUMEN lo use para personalizar.</p><button class="btn" onclick="memory()">Cambiar permiso</button></div></section>`)}
function repertoire(){set(`<section class="scene"><div class="eyebrow">Repertorio · capacidad propia</div><h1>Cosas que ya no necesitan ser novedad.</h1><div class="grid"><article class="card" onclick="resource('practice')"><small>PRÁCTICA PROPIA</small><h3>Dos minutos de espacio</h3><p>Repetir · variar · aplicar en otro contexto.</p></article><article class="card" onclick="resource('reflection')"><small>PREGUNTA PROPIA</small><h3>¿Qué merece respuesta ahora?</h3><p>Usarla sin LUMEN también cuenta.</p></article><article class="card" onclick="tissue()"><small>VÍNCULO</small><h3>Una persona a la que puedo recurrir</h3><p>La capacidad puede ser relacional.</p></article></div><p class="note">Éxito también es necesitar menos mediación.</p></section>`)}
function milestones(){set(`<section class="scene"><div class="eyebrow">Hitos · reconocimiento, no recompensa</div><h1>Hechos que elegiste reconocer.</h1><div class="status">“Pedí ayuda antes de llegar al límite.”</div><div class="status">“Pude cambiar una dirección que ya no era mía.”</div><div class="row"><button class="btn" onclick="territory()">Volver</button><button class="btn danger">Ocultar un hito</button></div></section>`)}
function tissue(){set(`<section class="scene"><div class="eyebrow">Tejido · la Vida acompaña a la Vida</div><h1>Acercarte sin entrar a una red social.</h1><p class="lead">Sin followers, likes, ranking ni reputación. Importan propósito, rol, límites, disponibilidad, consentimiento y salida.</p><div class="grid"><article class="card" onclick="oneToOne()"><small>1:1</small><h3>Hablar con una persona</h3><p>Pertinencia y límites antes de acercarte.</p></article><article class="card" onclick="oneToOne()"><small>MENTOR / PROFESIONAL</small><h3>Alguien con un rol claro</h3><p>Competencia, costo y disponibilidad si importan.</p></article><article class="card" onclick="circlePrep()"><small>CÍRCULO</small><h3>Encontrarnos alrededor de algo</h3><p>Confidencialidad, facilitación y salida.</p></article><article class="card" onclick="circlePrep()"><small>ENCUENTRO</small><h3>Actividad compartida</h3><p>Otro humano conduce; LUMEN sostiene bordes.</p></article><article class="card" onclick="spill()"><small>DERRAME</small><h3>Ofrecer algo que puede servir</h3><p>Sin niveles de contribuidor.</p></article></div></section>`)}
function oneToOne(){set(`<section class="scene resource"><div><div class="eyebrow">Otra vida · LUMI baja presencia</div><h1>Marina acompaña procesos de transición.</h1><p class="lead">Aparece porque su rol y disponibilidad son pertinentes, no por popularidad.</p><div class="row"><button class="btn primary" onclick="humanLive()">Acercarme</button><button class="btn">Ver rol y límites</button><button class="btn">Otra persona</button></div></div><div class="viewer"><div class="meta">Rol verificado · disponibilidad · modalidad · costo si aplica · reporte/retirada accesibles</div><h2>Antes de acercarte</h2><p class="lead">Qué puede ofrecer, qué no, condiciones de privacidad y cómo salir.</p></div></section>`)}
function circlePrep(){set(`<section class="scene resource"><div><div class="eyebrow">Círculo · antes</div><h1>Conversar sobre cambios de vida.</h1><p class="lead">6 personas · facilitación humana · confidencialidad acordada · podés escuchar sin hablar · salir en cualquier momento.</p><div class="row"><button class="btn primary" onclick="humanLive()">Entrar</button><button class="btn">Ver acuerdos</button><button class="btn quiet" onclick="tissue()">No ahora</button></div></div><div class="viewer"><h2>Bordes claros</h2><p class="lead">Propósito, rol del facilitador, límites, consentimiento, seguridad, salida y reporte. Dentro, la tecnología desaparece.</p></div></section>`)}
function humanLive(){set(`<section class="scene"><div class="eyebrow">LUMI · P0</div><div class="circle">Otra Vida está en el centro.<br>LUMEN sostiene los bordes y se retira.</div><div class="row" style="justify-content:center"><button class="btn primary" onclick="ret()">Terminar encuentro</button><button class="btn" onclick="tissue()">Salir</button><button class="btn danger">Reportar</button></div></section>`)}
function spill(){set(`<section class="scene"><div class="eyebrow">Derrame · valor sin status</div><h1>¿Qué querés poner en circulación?</h1><div class="grid two"><article class="card"><small>PRESENCIA</small><h3>Estar para alguien</h3><p>Disponibilidad con límites.</p></article><article class="card"><small>EXPERIENCIA</small><h3>Compartir algo aprendido</h3><p>Sin convertir vivencia en verdad universal.</p></article><article class="card"><small>RECURSO</small><h3>Acercar algo útil</h3><p>Con procedencia.</p></article><article class="card"><small>AYUDA CONCRETA</small><h3>Ofrecer una mano</h3><p>Contexto y condiciones claras.</p></article></div></section>`)}
function wander(){set(`<section class="scene hero"><div><div class="eyebrow">Deambular · sin feed</div><h1>Una sola apertura.</h1><p class="lead">“A veces una pregunta nueva cambia más que una respuesta mejor.” Si no te llama, seguí andando. No hay algoritmo intentando retenerte.</p><div class="row"><button class="btn" onclick="resource('reflection')">Abrir</button><button class="btn" onclick="wander()">Otra dirección</button><button class="btn quiet" onclick="home()">Irme</button></div></div><div class="orbwrap"><div class="orb small" style="opacity:.55"></div></div></section>`)}
function quiet(){set(`<section class="scene hero"><div><div class="eyebrow">Quietud</div><h1>No hace falta hacer nada.</h1><p class="lead">Podés quedarte un momento. No voy a llenar el silencio.</p><div class="row"><button class="btn" onclick="home()">Cuando quiera, vuelvo</button></div></div><div class="orbwrap"><div class="orb small" style="opacity:.18"></div></div></section>`)}
function noMatch(){set(`<section class="scene hero"><div><div class="eyebrow">Honestidad · cobertura insuficiente</div><h1>No tengo algo suficientemente bueno para acercarte.</h1><p class="lead">Prefiero no rellenar el espacio con una recomendación mediocre. Podemos reformular, explorar Fuente, mirar algo propio, buscar ayuda humana/profesional o cerrar.</p><div class="row"><button class="btn" onclick="clarify()">Reformular</button><button class="btn" onclick="source()">Explorar</button><button class="btn" onclick="territory()">Algo mío</button><button class="btn" onclick="tissue()">Ayuda humana</button><button class="btn quiet" onclick="home()">Cerrar</button></div></div><div class="orbwrap"><div class="orb small"></div></div></section>`)}
function safety(){set(`<section class="scene"><div class="eyebrow">Custodia · prioridad humana</div><h1>Esto merece ayuda humana directa ahora.</h1><p class="lead">No voy a tratar una situación de riesgo como una conversación exploratoria. LUMEN puede ayudarte a acercarte a una persona, profesional o servicio adecuado y quedarse sólo lo necesario.</p><div class="status">Si hay peligro inmediato, priorizá servicios de emergencia locales o una persona de confianza que pueda estar físicamente con vos. LUMEN no sustituye atención de emergencia.</div><div class="row"><button class="btn primary" onclick="tissue()">Acercar ayuda humana</button><button class="btn">Ver opciones profesionales</button><button class="btn">Contactar a alguien de confianza</button><button class="btn quiet" onclick="home()">Salir</button></div></section>`)}
function proactive(){set(`<section class="scene hero"><div><div class="eyebrow">Proactividad · sólo con permiso</div><h1>Volví porque vos lo pediste.</h1><p class="lead">La última vez elegiste que te recuerde retomar esto hoy. Esa es la única razón. Podés continuar, posponer o apagarlo sin culpa.</p><div class="row"><button class="btn primary" onclick="territory()">Retomar</button><button class="btn">No ahora</button><button class="btn" onclick="S.proactive=false;save();home()">No me recuerdes esto</button><button class="btn quiet" onclick="home()">Cerrar</button></div></div><div class="orbwrap"><div class="orb small"></div></div></section>`)}
function memory(){set(`<section class="scene resource"><div><div class="eyebrow">Memoria · soberanía</div><h1>Recordar sólo cuando te sirve.</h1><p class="lead">LUMEN puede explicar qué recuerda, de dónde salió y por qué lo usa. Podés corregirlo, impedir su uso o borrarlo.</p><div class="status">Recuerdo autorizado: “caminar sin apuro me ayuda a pensar”. Fuente: algo que guardaste en Santuario.</div><div class="row"><button class="btn primary" onclick="territory()">Corregir</button><button class="btn" onclick="S.memory=!S.memory;save();memory()">${S.memory?'No usar para personalizar':'Permitir personalización'}</button><button class="btn danger" onclick="S.memory=false;save();home()">Olvidar</button></div></div><div class="viewer"><h2>Privacidad visible</h2><p class="lead">Lo íntimo no se recolecta “por si acaso”. Santuario y evidencia colectiva permanecen separados. Las notificaciones no exponen contenido sensible por defecto.</p></div></section>`)}
function accessibility(){set(`<section class="scene"><div class="eyebrow">Accesibilidad · desde el nacimiento</div><h1>La calma también tiene que ser accesible.</h1><div class="grid two"><article class="card"><small>MOVIMIENTO</small><h3>Reducir animación</h3><p>Respeta la preferencia del sistema; ninguna información depende del movimiento.</p></article><article class="card"><small>AUDIO / VIDEO</small><h3>Texto equivalente</h3><p>Transcripción, subtítulos y alternativas.</p></article><article class="card"><small>ENERGÍA</small><h3>Modo de baja carga</h3><p>Menos decisiones, lenguaje claro, salidas visibles.</p></article><article class="card"><small>INTERACCIÓN</small><h3>Teclado y foco</h3><p>Controles semánticos, etiquetas y reflow.</p></article><article class="card" onclick="language()"><small>IDIOMA / CULTURA</small><h3>Cambiar expresión, no sentido</h3><p>Metáforas y cortesía adaptables; seguridad estable.</p></article><article class="card" onclick="handoff()"><small>MULTISUPERFICIE</small><h3>Continuar sin pantalla</h3><p>La relación sobrevive al dispositivo.</p></article></div></section>`)}
function language(){set(`<section class="scene hero"><div><div class="eyebrow">Idioma y cultura</div><h1>El significado permanece; la expresión puede cambiar.</h1><p class="lead">Idioma, metáforas, ejemplos, ritmo y cortesía pueden adaptarse sin alterar silenciosamente propósito, seguridad o límites.</p><div class="row"><button class="btn primary">Español</button><button class="btn">English</button><button class="btn">Português</button><button class="btn" onclick="accessibility()">Volver</button></div></div><div class="orbwrap"><div class="orb small"></div></div></section>`)}
function handoff(){set(`<section class="scene"><div class="eyebrow">Continuidad multisuperficie</div><h1>Podés seguir caminando.</h1><p class="lead">Esta experiencia puede continuar en audio y volver más tarde, incluso desde otra superficie. Lo que se preserva es el hilo semántico autorizado, no la pantalla.</p><div class="row"><button class="btn primary" onclick="audio()">Continuar en audio</button><button class="btn" onclick="ret()">Volví más tarde</button><button class="btn quiet" onclick="home()">Cerrar</button></div></section>`)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){P.classList.remove('on');Q.classList.remove('on')}});document.querySelector('#world').addEventListener('pointermove',e=>{document.querySelector('#world').style.setProperty('--x',e.clientX/innerWidth*100+'%');document.querySelector('#world').style.setProperty('--y',e.clientY/innerHeight*100+'%')});home();
