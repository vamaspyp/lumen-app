name: LUMEN Premium Playwright Certification

on:
  push:
    branches: [greenfield-a64-premium-vnext]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  premium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:regression
      - name: Preserve visual certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-premium-playwright-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
