name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, greenfield-v04-s0, greenfield-v04-s1]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Certify live greenfield backend
        run: npm run test:live
