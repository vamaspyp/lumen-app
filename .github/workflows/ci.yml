name: CI

on:
  pull_request:
    branches: [main, greenfield-v04-embryo, greenfield-a63-v19-hifi-es, a63-premium-validation-base]
  push:
    branches: [main, greenfield-v04-s0, greenfield-v04-s1, greenfield-v04-embryo, greenfield-a63-embryo-complete, greenfield-a63-premium-cleanroom]

jobs:
  conduction-gate:
    name: Conduction Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify live-POV attestation and governed execution context
        run: node scripts/check-conduction-gate.mjs

  custody-gate:
    name: Custody Gate
    needs: conduction-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify organism synchrony and custodian contracts
        run: node scripts/check-custody-gate.mjs

  verify:
    needs: [conduction-gate, custody-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Architecture + unit + custody + lint + build + embryo regression
        run: npm run verify
      - name: Preserve clean-room visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanroom-visual-qa
          path: |
            test-results/cleanroom-home.png
            test-results/cleanroom-home-mobile.png
          if-no-files-found: ignore
      - name: Certify live greenfield backend
        run: npm run test:live
